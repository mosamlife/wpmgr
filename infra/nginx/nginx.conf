# WPMgr web — serves the Vite SPA with history-API fallback and reverse-proxies
# the control-plane API. ONE public hostname serves several surfaces:
#   - the dashboard SPA (static)              -> served from disk
#   - the dashboard API  (/api/v1/*)          -> proxied to api:8080 (prefix PRESERVED)
#   - the agent endpoints (/enroll, /agent/*) -> proxied to api:8080 (root API paths)
#   - RUM beacon ingest  (/rum/*)              -> proxied to api:8080 (root API path)
#   - provider webhooks  (/webhooks/*)         -> proxied to api:8080 (root API path)
# The API's routes live under /api/v1, /enroll, /agent/v1, /rum and /webhooks — so we
# must NOT strip the /api prefix, and we must explicitly proxy every other public
# root-API path (otherwise a request to any of them falls through to the SPA
# try_files catch-all and nginx returns 405 instead of reaching the Go handler).
# GH #175: this exact class of bug — a Go route registered on the root engine with
# no matching nginx location — silently 405'd ALL self-hosted RUM ingest. When
# adding a new PUBLIC root-engine route in Go (server.go), add its location here
# too, and extend infra/nginx/routing_smoke_test.sh's NOT-405 assertions.

# Allow WebSocket upgrades to pass through; empty Connection for normal requests.
map $http_upgrade $wpmgr_conn_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Manifests / metadata payloads from agents can be sizeable.
    client_max_body_size 64m;

    # ---- Security headers (applied to every response) --------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP — same-origin by default with explicit exceptions for the bits the
    # SPA actually needs.
    #   style-src 'unsafe-inline'  — motion (Framer's successor) and Radix UI
    #     inject inline `style="transform:..."` at runtime; nonces aren't
    #     practical with our static-served build. Combined with Trusted Types
    #     this is acceptable for a first-party SPA without third-party scripts.
    #   style-src + font-src fonts.{googleapis,gstatic}.com — IBM Plex Sans /
    #     Mono are loaded via Google Fonts.
    #   img-src 'self' data: blob: https:  — 'self'/data/blob cover embedded SVG
    #     icons + chart blob URLs; `https:` is REQUIRED so the Media Optimizer
    #     tab can render attachment thumbnails served from each managed site's own
    #     origin (e.g. https://<site>/wp-content/uploads/...) and from presigned
    #     object-storage URLs. Tenant sites live on arbitrary domains, so they
    #     cannot be enumerated statically; `https:` (TLS-only — no mixed content)
    #     is the standard scope for an authenticated dashboard showing
    #     user-content images, which cannot execute script.
    #   connect-src 'self'   — SSE + REST are same-origin via /api/v1.
    #   Razorpay Checkout.js in-app payment modal (loaded on demand only on
    #     /settings/billing when the customer picks Razorpay) — enumerated hosts,
    #     no wildcard: script-src checkout.razorpay.com; connect-src
    #     api.razorpay.com + lumberjack.razorpay.com; frame-src api/checkout
    #     .razorpay.com. style-src already allows 'unsafe-inline' (Radix/motion)
    #     and img-src already allows https:, so those cover the modal's inline
    #     styles + payment-method/bank/QR images with no further change.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Docker embedded DNS so the "api" upstream resolves at request time (nginx
    # starts even if api isn't up yet).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "api:8080";

    # ---- Client identity: this nginx is the trust boundary ----------------
    # For a self-hosted install THIS nginx is the edge, so it must NOT extend a
    # caller-supplied X-Forwarded-For. $proxy_add_x_forwarded_for appends the
    # peer to whatever arrived and never strips it, which lets any caller
    # prepend entries of their choosing and so decide which entry the API reads
    # as "the client". X-Forwarded-For is therefore SET from $remote_addr, not
    # appended to: what the API receives is observed by nginx, never asserted
    # by the caller. This nginx appends exactly ONE entry, which is what
    # WPMGR_AUTH_PROXY_HOPS=1 (see .env.example) counts.
    #
    # Chained proxy in front? This server block listens on plain :80, so an
    # internet-facing install usually terminates TLS somewhere ahead of it.
    # Overwriting would otherwise replace the real client with that proxy's own
    # address. Declare the front proxy — and only it — as trusted by mounting a
    # file into /etc/nginx/trusted-proxies/ holding set_real_ip_from lines:
    #
    #   set_real_ip_from 10.0.0.0/8;   # the front proxy's address or CIDR
    #
    # ngx_http_realip_module then rewrites $remote_addr to the real client
    # taken from that proxy's X-Forwarded-For, so the header written below
    # still carries one entry and it is still the real client. A spoofed header
    # from any source NOT listed is ignored, so the trust boundary holds.
    #
    # The directory is EMPTY by default: no source is trusted, $remote_addr is
    # the real peer, and nginx is the edge. A wildcard include that matches
    # nothing is valid nginx, so the default needs no file and no mount.
    include /etc/nginx/trusted-proxies/*.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Common proxy headers (inherited by the proxied locations below, since none
    # of them redefine proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $wpmgr_conn_upgrade;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Dashboard API. PREFIX PRESERVED: the API serves routes under /api/v1, so
    # pass the URI through unchanged (no rewrite). proxy_buffering off so SSE
    # (/api/v1/updates/{id}/events) streams live.
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Session auth endpoints (login/logout/me/register/oidc) — root API paths.
    location /auth/ {
        proxy_pass http://$api_upstream;
    }

    # Agent enrollment (public) — POST from the WordPress plugin.
    location = /enroll {
        proxy_pass http://$api_upstream;
    }

    # Agent-authenticated endpoints (metadata, heartbeat, backup presign/manifest).
    location /agent/ {
        proxy_pass http://$api_upstream;
        proxy_read_timeout 300s;
    }

    # RUM beacon ingest (public) — cross-origin POST + OPTIONS from managed
    # sites' pages (navigator.sendBeacon). Prefix location (not `=`) so both
    # the POST and any CORS preflight OPTIONS forward with the URI unchanged.
    # nginx must NOT answer CORS itself — rumCORSMiddleware in Go owns that;
    # this just proxies through.
    location /rum/ {
        proxy_pass http://$api_upstream;
    }

    # Inbound provider webhooks (email bounce/complaint, Stripe billing) —
    # server-to-server POST, public/unauthenticated at the edge (verified by
    # provider signature in the Go handler).
    location /webhooks/ {
        proxy_pass http://$api_upstream;
    }

    # Health endpoints proxied through for convenience.
    location = /healthz {
        proxy_pass http://$api_upstream/healthz;
    }
    location = /readyz {
        proxy_pass http://$api_upstream/readyz;
    }

    # Static crawlable legal pages — served before the SPA fallback so that
    # raw-HTML fetches (link-checkers, plugin-store reviewers) get real content
    # without JavaScript. The React routes /terms and /privacy still work for
    # in-app client-side navigation (the browser never hits nginx for those).
    location = /terms {
        default_type text/html;
        charset utf-8;
        try_files /terms.html =404;
    }
    location = /privacy {
        default_type text/html;
        charset utf-8;
        try_files /privacy.html =404;
    }

    # SPA fallback — everything else serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
