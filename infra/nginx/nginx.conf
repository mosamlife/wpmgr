# WPMgr web — serves the Vite SPA with history-API fallback and proxies
# /api to the api service (resolved on the compose network).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers (applied to every response) --------------------
    # `always` so they are emitted on error responses (4xx/5xx) too. App-level
    # headers (e.g. per-route CSP nonces, HSTS once TLS terminates here) are a
    # backend concern tracked separately; this is the edge baseline.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Defense-in-depth clickjacking guard alongside X-Frame-Options. No external
    # origins are embedded by the SPA; tighten this as the frontend evolves.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Use Docker's embedded DNS so the "api" upstream is resolved at request
    # time. This lets nginx start even if the api container isn't up yet
    # (no startup crash on an unresolvable upstream).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "api:8080";

    # Gzip static assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API calls to the api container. The "api" name resolves on the
    # compose network; api listens on :8080.
    location /api/ {
        # Strip the /api prefix before proxying (variable proxy_pass does not
        # rewrite the URI automatically, so do it explicitly).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health endpoints proxied through for convenience.
    location = /healthz {
        proxy_pass http://$api_upstream/healthz;
    }
    location = /readyz {
        proxy_pass http://$api_upstream/readyz;
    }

    # SPA fallback — everything else serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
