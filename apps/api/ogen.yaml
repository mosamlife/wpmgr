# ogen generator configuration. See https://ogen.dev/docs/configuration
# We consume the generated types, their Validate() methods and the client.
# Gin owns HTTP routing in internal/server, so ogen's server half (the Handler
# interface, the router, the unimplemented stub and the server-side
# encoders/decoders) was generated but never mounted. Since 2026-08-21 it is
# not generated at all: `paths/server` and `webhooks/server` are off below.
#
# That switch is what lets the SSE endpoints generate. ogen still cannot model
# text/event-stream as a server operation, and with server generation on it
# registered response marker methods on the shared Error type before raising
# the not-implemented error, emitting a method that referenced two types it
# then never wrote — so the package did not compile. With server generation
# off, no operation is skipped: streamSiteEvents, streamUpdateRunEvents and
# streamBackupSnapshotEvents all materialise as ordinary client methods and
# typed event payloads. The Gin handlers still own the streaming transport by
# hand; nothing consumes the generated SSE client methods today.
generator:
  features:
    disable:
      - "paths/server"
      - "webhooks/server"
