  # --- M4 / M5.6 backup agent callbacks (agent-authenticated) -------------------
  /agent/v1/backups/{snapshotId}/presign:
    post:
      operationId: agentPresignBackupChunks
      summary: Request presigned PUT URLs for not-yet-stored ciphertext chunk hashes (agent-authenticated)
      description: |
        Incremental dedup: hashes already stored for the tenant are omitted
        from `uploads` and the agent skips uploading them. Content-addressed,
        tenant-namespaced object keys mean a presign can never target another
        tenant's chunk prefix. The snapshot is re-verified to belong to the
        calling site before any presign is minted.
      tags: [agent, backups]
      security:
        - AgentSignature: []
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPresignChunksRequest"
      responses:
        "200":
          description: Presigned upload URLs for not-yet-stored hashes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPresignChunksResponse"
        "401":
          description: Agent authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: snapshot_site_mismatch — the snapshot does not belong to this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /agent/v1/backups/{snapshotId}/manifest:
    post:
      operationId: agentSubmitBackupManifest
      summary: Submit the completed backup manifest after chunk upload (agent-authenticated)
      description: |
        ADR-051: an archive-delta increment submits the SAME request shape as
        a full backup (its zip parts, DB dump, files-list, and optional
        tombstones are all `ManifestEntry` rows); per-cycle telemetry
        counters ride as optional top-level fields. Upserts not-yet-stored
        chunks, increments refcounts for every reference, inserts manifest
        entries, and completes the snapshot.
      tags: [agent, backups]
      security:
        - AgentSignature: []
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSubmitManifestRequest"
      responses:
        "200":
          description: Manifest recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSubmitManifestResponse"
        "401":
          description: Agent authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: snapshot_site_mismatch — the snapshot does not belong to this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /agent/v1/backups/{snapshotId}/progress:
    post:
      operationId: agentReportBackupProgress
      summary: Report the backup runner's latest phase (M5.6 / ADR-032, agent-authenticated)
      description: |
        Fired on every stage transition, and per-chunk during the custom
        presigned-S3 sync. `snapshot_id` comes strictly from the URL path,
        never the body — a compromised agent cannot target another
        snapshot by spoofing it in the JSON body.
      tags: [agent, backups]
      security:
        - AgentSignature: []
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase]
              properties:
                phase:
                  type: string
                phase_detail:
                  type: object
      responses:
        "200":
          description: Progress recorded
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          description: Agent authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: snapshot_site_mismatch — the snapshot does not belong to this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Body exceeds the progress payload size cap

  /api/v1/sites/{siteId}:
    get:
      operationId: getSite
      summary: Get a site by ID
