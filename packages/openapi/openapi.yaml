      properties:
        connection_state: { type: string }
        last_seen_at: { type: string, format: date-time }
        recovered:
          type: boolean
          description: True when this re-check recovered the connection from degraded/disconnected to connected.

    # ---------------------------------------------------------------------------
    # M94 / GH #148 — fleet incident detail
    # ---------------------------------------------------------------------------
    FleetIncidentDetail:
      type: object
      required: [id, site_id, name, url, started_at, ongoing, peak_status, last_http_status, reason, incident_count_30d, probes, probes_truncated]
