    ObjectCacheConfig:
      type: object
      description: Per-site object cache configuration and live status.
      required: [enabled, scheme, host, port, database, has_password, prefix, maxttl_seconds, queryttl_seconds, connect_timeout_ms, read_timeout_ms, retry_count, retry_interval_ms, serializer, compression, async_flush, flush_strategy, shared, flush_on_failback, analytics_enabled, oc_state, oc_latency_ms, oc_used_memory_bytes]
      properties:
        enabled:
          type: boolean
        scheme:
          type: string
          enum: [tcp, unix, tls]
        host:
          type: string
        port:
          type: integer
        socket_path:
          type: string
        database:
          type: integer
        username:
          type: string
        has_password:
          type: boolean
          description: True when an encrypted password is stored. The password itself is never returned.
        prefix:
          type: string
        maxttl_seconds:
          type: integer
        queryttl_seconds:
          type: integer
        connect_timeout_ms:
          type: integer
        read_timeout_ms:
          type: integer
        retry_count:
          type: integer
        retry_interval_ms:
          type: integer
        serializer:
          type: string
          enum: [php, igbinary]
        compression:
          type: string
          enum: [none, lzf, lz4, zstd]
        async_flush:
          type: boolean
        flush_strategy:
          type: string
          enum: [auto, flushdb, scan]
        shared:
          type: boolean
          description: True when the Redis instance is shared with other sites (prefix isolation).
        flush_on_failback:
          type: boolean
          description: Flush all keys when the object cache recovers from a down state.
        analytics_enabled:
          type: boolean
        debug_header_enabled:
          type: boolean
          description: >-
            When true the drop-in emits a per-request x-wpmgr-object-cache response
            header with cache hit/miss/state details. Default false.
        last_test_config_hash:
          type: string
          nullable: true
          description: Non-empty after a passing test; cleared when connection fields change.
        last_tested_at:
          type: string
          format: date-time
          nullable: true
        last_test_result:
          allOf:
            - $ref: "#/components/schemas/ObjectCacheTestResult"
          nullable: true
          description: >-
            The stored result of the most recent connection test, including the
            server capability report, so the dashboard can show requirements
            without re-running a test.
        oc_state:
          type: string
          description: "Live connectivity state from the last heartbeat: '' (unknown/no config), 'disabled', 'connected', 'degraded', or 'down'."
        oc_latency_ms:
          type: integer
        oc_last_error_class:
          type: string
          nullable: true
        oc_used_memory_bytes:
          type: integer
          format: int64
        oc_hit_ratio_pct:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ObjectCacheConfigPut:
      type: object
      description: Fields accepted by PUT /perf/object-cache/config. All fields are optional; omitted fields are unchanged. An empty password preserves the stored password.
      properties:
        enabled:
          type: boolean
        scheme:
          type: string
          enum: [tcp, unix, tls]
        host:
          type: string
        port:
          type: integer
        socket_path:
          type: string
        database:
          type: integer
        username:
          type: string
        password:
          type: string
          description: Write-only. Empty string means "keep stored password".
        prefix:
          type: string
        maxttl_seconds:
          type: integer
        queryttl_seconds:
          type: integer
        connect_timeout_ms:
          type: integer
        read_timeout_ms:
          type: integer
        retry_count:
          type: integer
        retry_interval_ms:
          type: integer
        serializer:
          type: string
          enum: [php, igbinary]
        compression:
          type: string
          enum: [none, lzf, lz4, zstd]
        async_flush:
          type: boolean
        flush_strategy:
          type: string
          enum: [auto, flushdb, scan]
        shared:
          type: boolean
        flush_on_failback:
          type: boolean
        analytics_enabled:
          type: boolean
        debug_header_enabled:
          type: boolean
          description: >-
            When true the drop-in emits a per-request x-wpmgr-object-cache response
            header with cache hit/miss/state details. Default false.

    ObjectCacheCapabilities:
      type: object
      description: >-
        Server and PHP extension capabilities detected by the agent during a
        connection test. phpredis_version empty or absent means the phpredis
        extension is not installed on the server.
      required:
        [
          igbinary_available,
          lzf_available,
          lz4_available,
          zstd_available,
          tls_supported,
          value_metadata_reads,
          native_retry_options,
          keepttl_supported,
          flush_async_supported,
        ]
      properties:
        phpredis_version:
          type: string
          nullable: true
        igbinary_available:
          type: boolean
        lzf_available:
          type: boolean
        lz4_available:
          type: boolean
        zstd_available:
          type: boolean
        tls_supported:
          type: boolean
        value_metadata_reads:
          type: boolean
        native_retry_options:
          type: boolean
        keepttl_supported:
          type: boolean
        flush_async_supported:
          type: boolean

    ObjectCacheTestResult:
      type: object
      description: Result of an objectcache.test command.
      required: [ok, reachable, round_trip_ok]
      properties:
        ok:
          type: boolean
        detail:
          type: string
          nullable: true
        reachable:
          type: boolean
        latency_ms:
          type: integer
        server_version:
          type: string
          nullable: true
        eviction_policy:
          type: string
          nullable: true
        max_memory_bytes:
          type: integer
          format: int64
        used_memory_bytes:
          type: integer
          format: int64
        capabilities:
          $ref: "#/components/schemas/ObjectCacheCapabilities"
        flush_capability_class:
          type: string
          description: dedicated_db or shared_prefix; drives the flush strategy disclosure.
          nullable: true
        acl_denials:
          type: array
          items:
            type: string
          nullable: true
        round_trip_ok:
          type: boolean
        config_hash:
          type: string
          nullable: true

    ObjectCacheStatsHistoryPoint:
      type: object
      description: One daily-aggregated data point in the stats history.
      required: [sampled_at, hit_count, miss_count, used_memory_bytes, ops_per_sec, evicted_keys_delta]
      properties:
        sampled_at:
          type: string
          format: date-time
        ratio_pct:
          type: number
          nullable: true
          description: Hit ratio as a percentage (0–100). Null when no data.
        hit_count:
          type: integer
          format: int64
        miss_count:
          type: integer
          format: int64
        used_memory_bytes:
          type: integer
          format: int64
        avg_wait_ms:
          type: number
        ops_per_sec:
          type: integer
        evicted_keys_delta:
          type: integer
          format: int64

    ObjectCacheStatsHistory:
      type: object
      description: Daily-aggregated object cache stats history for trend charts.
      required: [points, avg_ratio_pct]
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/ObjectCacheStatsHistoryPoint"
        avg_ratio_pct:
          type: number
          description: Average hit ratio across all data points in the window.

    # -------------------------------------------------------------------------
    # m82 — File Manager (P1 read-only)
    # -------------------------------------------------------------------------

    FileEntry:
      type: object
      description: One entry in a site directory listing.
      required: [name, size, mtime, mode, is_dir, is_link, is_writable]
      properties:
        name:
          type: string
          description: Filename (basename only; no directory component).
        size:
          type: integer
          format: int64
          description: File size in bytes (0 for directories).
        mtime:
          type: integer
          format: int64
          description: Last-modified time as Unix epoch seconds.
        mode:
          type: string
          description: Human-readable permission string (e.g. "-rw-r--r--").
        is_dir:
          type: boolean
          description: True when the entry is a directory.
        is_link:
          type: boolean
          description: True when the entry is a symlink. The agent never follows symlinks.
        is_writable:
          type: boolean
          description: True when the agent process can write to this entry.

    FileListResult:
      type: object
      description: One page of directory entries from a `file_list` agent command.
      required: [path, entries, total, truncated]
      properties:
        path:
          type: string
          description: Absolute resolved path (echoed from the agent).
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
        total:
          type: integer
          description: Total count of entries in the directory (before cursor pagination).
        truncated:
          type: boolean
          description: True when more entries remain beyond this page.
        cursor:
          type: string
          nullable: true
          description: Opaque resume cursor; present only when `truncated=true`.

    FileReadResult:
      type: object
      description: Inline base64-encoded content of a file (≤ 256 KiB).
      required: [path, size, mtime, mode, encoding, content_base64, truncated]
      properties:
        path:
          type: string
          description: Echoed path.
        size:
          type: integer
          format: int64
          description: Full file size in bytes (before any byte-cap truncation).
        mtime:
          type: integer
          format: int64
          description: Last-modified time as Unix epoch seconds.
        mode:
          type: string
          description: Human-readable permission string.
        encoding:
          type: string
          description: Always "base64" in v1.
          enum: [base64]
        content_base64:
          type: string
          description: Base64-encoded file content (up to 256 KiB).
        truncated:
          type: boolean
          description: >
            True when the file was larger than the byte cap (256 KiB). Use the
            download endpoint to retrieve the full file.

    FileDownloadRequest:
      type: object
      description: Request body for `POST /sites/{siteId}/files/download`.
      required: [path]
      properties:
        path:
          type: string
          description: Site-relative path to the file to stage for download.

    FileDownloadResult:
      type: object
      description: >
        Presigned download URL and transfer metadata returned by the
        `file_download_prepare` flow.
      required: [ok, transfer_id, download_url, size_bytes, chunk_count, expires_at]
      properties:
        ok:
          type: boolean
        transfer_id:
          type: string
          format: uuid
          description: CP-assigned transfer ID (for audit correlation).
        download_url:
          type: string
          format: uri
          description: >
            Presigned GET URL for the browser to fetch the staged file directly
            from object storage. Valid for at most 5 minutes. Never log this URL.
        size_bytes:
          type: integer
          format: int64
          description: Staged file size in bytes.
        chunk_count:
          type: integer
          description: Number of S3 parts the agent uploaded.
        expires_at:
          type: integer
          format: int64
          description: Unix epoch seconds when the presigned GET URL expires.

    FileManagerSettings:
      type: object
      description: >
        Per-site file manager configuration. Returned by both
        `GET /sites/{siteId}/files/settings` and
        `PUT /sites/{siteId}/files/settings`.
      required: [enabled, write_enabled, root_jail]
      properties:
        enabled:
          type: boolean
          description: >
            Whether the file manager read mode is enabled for this site.
            Defaults to `false` (off by default, explicit opt-in required).
        write_enabled:
          type: boolean
          description: >
            Whether the file manager write mode is enabled for this site (P2).
            Separate opt-in from `enabled` so read and write can be toggled
            independently. Defaults to `false`. Both `enabled` AND
            `write_enabled` must be `true` before any write/delete/chmod/
            mkdir/rename/upload command will be signed.
        root_jail:
          type: string
          description: >
            The filesystem root the agent restricts all file operations to.
            Always `""` in P1/P2 — the agent defaults to the site's `ABSPATH`.
            Reserved for future P3 configuration.

    UpdateFileManagerSettingsRequest:
      type: object
      description: Request body for `PUT /sites/{siteId}/files/settings`.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Set to `true` to enable the file manager (read), `false` to disable it.
        write_enabled:
          type: boolean
          description: >
            Set to `true` to also enable write mode (P2). Defaults to `false`
            when omitted (the read flag is updated but write remains off).

    # -------------------------------------------------------------------------
    # P2 Write request/response schemas
    # -------------------------------------------------------------------------

    WriteFileContentRequest:
      type: object
      description: Request body for `PUT /sites/{siteId}/files/content`.
      required: [path, content_base64]
      properties:
        path:
          type: string
          description: Site-relative file path to create or overwrite.
        content_base64:
          type: string
          description: Base64-encoded file content (≤ 256 KiB).
        confirm_executable_write:
          type: boolean
          default: false
          description: >
            Must be `true` when the target path matches the executable-extension
            deny-list (`.php`, `.phar`, `.htaccess`, etc.) or is inside a
            PHP-executable web directory. Requires owner permission
            (`site.files.write_code`). Absence causes a
            `403 executable_write_denied` from the agent.
        confirm_sensitive:
          type: boolean
          default: false
          description: >
            Must be `true` when the target path matches the sensitive-file
            deny-list (`wp-config.php`, `.env*`, `*.pem`, etc.). Requires
            owner permission (`site.files.write_code`).

    WriteFileResult:
      type: object
      description: Response body for a successful `PUT /sites/{siteId}/files/content`.
      required: [path, size, mtime, mode]
      properties:
        path:
          type: string
          description: Resolved path of the written file (echoed).
        size:
          type: integer
          format: int64
          description: Bytes written.
        mtime:
          type: integer
          format: int64
          description: Last-modified time after the write (Unix epoch seconds).
        mode:
          type: string
          description: 4-digit octal permission string, e.g. `"0644"`.

    FileMkdirRequest:
      type: object
      description: Request body for `POST /sites/{siteId}/files/mkdir`.
      required: [path]
      properties:
        path:
          type: string
          description: Site-relative path for the new directory.

    FileMkdirResult:
      type: object
      description: Response body for a successful `POST /sites/{siteId}/files/mkdir`.
      required: [path]
      properties:
        path:
          type: string
          description: Resolved path of the created directory (echoed).

    FileRenameRequest:
      type: object
      description: Request body for `POST /sites/{siteId}/files/rename`.
      required: [src, dst]
      properties:
        src:
          type: string
          description: Site-relative source path (must exist).
        dst:
          type: string
          description: Site-relative destination path.
        confirm_executable_write:
          type: boolean
          default: false
          description: >
            Required when `dst` matches the executable-extension deny-list.
            Requires owner permission (`site.files.write_code`).
        confirm_sensitive:
          type: boolean
          default: false
          description: >
            Required when either `src` or `dst` is a sensitive path.
            Requires owner permission (`site.files.write_code`).

    FileRenameResult:
      type: object
      description: Response body for a successful `POST /sites/{siteId}/files/rename`.
      required: [src, dst]
      properties:
        src:
          type: string
        dst:
          type: string

    FileDeleteRequest:
      type: object
      description: Request body for `POST /sites/{siteId}/files/delete`.
      required: [path, confirm]
      properties:
        path:
          type: string
          description: Site-relative path to delete.
        recursive:
          type: boolean
          default: false
          description: >
            When `true`, recursively delete a non-empty directory and all its
            contents. When `false`, the agent refuses to delete a non-empty
            directory (returns `400 not_directory`).
        confirm:
          type: string
          description: >
            Typed confirmation token — must be the string `"DELETE"` exactly.
            Missing or wrong value returns `400 confirm_required` without
            issuing the delete command to the agent.

    FileDeleteResult:
      type: object
      description: Response body for a successful `POST /sites/{siteId}/files/delete`.
      required: [path, deleted]
      properties:
        path:
          type: string
          description: Echoed path that was deleted.
        deleted:
          type: integer
          description: >
            Number of filesystem entries removed (1 for a file; ≥1 for a
            recursive directory removal).

    FileChmodRequest:
      type: object
      description: Request body for `POST /sites/{siteId}/files/chmod`.
      required: [path, mode]
      properties:
        path:
          type: string
          description: Site-relative path.
        mode:
          type: string
          description: >
            4-digit octal permission string, e.g. `"0644"` or `"0755"`.
            The agent validates against a safe allowlist — no setuid, no
            setgid, no world-write.

    FileChmodResult:
      type: object
      description: Response body for a successful `POST /sites/{siteId}/files/chmod`.
      required: [path, mode]
      properties:
        path:
          type: string
        mode:
          type: string
          description: Effective mode after the chmod (echoed).

    PrepareUploadRequest:
      type: object
      description: Request body for `POST /sites/{siteId}/files/upload`.
      required: [path]
      properties:
        path:
          type: string
          description: Site-relative target path for the uploaded file.
        part_count:
          type: integer
          minimum: 1
          maximum: 32
          default: 1
          description: >
            Number of chunks the browser will PUT. Each chunk corresponds to
            one presigned S3 PUT URL. Use 1 for files ≤ 5 MiB; increase for
            larger files (max 32 × 5 MiB = 160 MiB total).
        confirm_executable_write:
          type: boolean
          default: false
          description: >
            Required when `path` matches the executable-extension deny-list.
            Requires owner permission (`site.files.write_code`).
        confirm_sensitive:
          type: boolean
          default: false
          description: >
            Required when `path` matches the sensitive-file deny-list.
            Requires owner permission (`site.files.write_code`).

    PrepareUploadPresignedPut:
      type: object
      description: One presigned S3 PUT slot returned by `prepareSiteFileUpload`.
      required: [index, url]
      properties:
        index:
          type: integer
          description: Zero-based chunk index.
        url:
          type: string
          description: >
            Presigned S3 PUT URL. Short TTL (≤ 5 min). Single-use.
            The browser PUTs the corresponding chunk bytes directly to this URL.

    PrepareUploadResult:
      type: object
      description: Response body for `POST /sites/{siteId}/files/upload`.
      required: [ok, transfer_id, object_key, presigned_puts, expires_at]
      properties:
        ok:
          type: boolean
        transfer_id:
          type: string
          format: uuid
          description: Opaque transfer ID — pass to `applySiteFileUpload` for audit.
        object_key:
          type: string
          description: >
            S3 key prefix for the staged chunks. Pass to `applySiteFileUpload`
            so the CP can mint presigned GETs for the agent.
        presigned_puts:
          type: array
          items:
            $ref: "#/components/schemas/PrepareUploadPresignedPut"
        expires_at:
          type: integer
          format: int64
          description: Unix epoch seconds when the presigned URLs expire (≤ 5 min from now).

    ApplyUploadRequest:
      type: object
      description: Request body for `POST /sites/{siteId}/files/upload/apply`.
      required: [path, object_key, part_count, total_size, sha256]
      properties:
        path:
          type: string
          description: Site-relative target path (must match the prepare call).
        object_key:
          type: string
          description: The `object_key` returned by `prepareSiteFileUpload`.
        part_count:
          type: integer
          description: Number of chunks staged (must match `part_count` from the prepare call).
        total_size:
          type: integer
          format: int64
          description: Expected assembled file size in bytes.
        sha256:
          type: string
          description: >
            Hex-encoded SHA-256 of the fully assembled file content.
            The agent validates this after reassembly and before the atomic swap;
            a mismatch returns `400 write_failed`.
        confirm_executable_write:
          type: boolean
          default: false
          description: Mirrors the prepare call — required for executable target paths.
        confirm_sensitive:
          type: boolean
          default: false
          description: Mirrors the prepare call — required for sensitive target paths.

    ApplyUploadResult:
      type: object
      description: Response body for a successful `POST /sites/{siteId}/files/upload/apply`.
      required: [ok, path, size, mtime]
      properties:
        ok:
          type: boolean
        path:
          type: string
          description: Resolved path of the written file (echoed).
        size:
          type: integer
          format: int64
          description: Bytes written (should match `total_size`).
        mtime:
          type: integer
          format: int64
          description: Last-modified time after the atomic swap (Unix epoch seconds).

    # -------------------------------------------------------------------------
    # P3 Advanced ops schemas: archive / extract / search / versions
    # -------------------------------------------------------------------------

    FileArchiveCreateRequest:
      type: object
      description: Request body for `POST /sites/{siteId}/files/archive`.
      required: [paths]
      properties:
        paths:
          type: array
          items:
            type: string
          minItems: 1
          description: >
            Site-relative paths to include in the archive. The agent runs each
            through the containment guard; at least one path is required.
        confirm_sensitive:
          type: boolean
          default: false
          description: >
            Must be `true` when any path in `paths` matches the sensitive-file
            deny-list (wp-config.php, .env*, *.pem, …). Requires owner
            permission (`site.files.read_sensitive`). A non-owner caller or a
            caller that omits this flag when a sensitive path is present is
            rejected at the CP (agent never called) and the denial is audited
            at elevated severity. The agent independently re-checks and returns
            `sensitive_denied` when absent / false.

    FileArchiveCreateResult:
      type: object
      description: >
        Presigned download URL and transfer metadata returned by the
        `file_archive_create` flow.
      required: [ok, transfer_id, download_url, size_bytes, chunk_count, expires_at]
      properties:
        ok:
          type: boolean
        transfer_id:
          type: string
          format: uuid
          description: CP-assigned transfer ID (for audit correlation).
        download_url:
          type: string
          format: uri
          description: >
            Presigned GET URL for the browser to download the staged archive
            directly from object storage. Valid for at most 5 minutes. Never log this URL.
        size_bytes:
          type: integer
          format: int64
          description: Total archive size in bytes.
        chunk_count:
          type: integer
          description: Number of S3 parts the agent uploaded.
        expires_at:
          type: integer
          format: int64
          description: Unix epoch seconds when the presigned GET URL expires (≤ 5 min from now).

    FileExtractRequest:
      type: object
      description: Request body for `POST /sites/{siteId}/files/extract`.
      required: [archive_path, dest_path]
      properties:
        archive_path:
          type: string
          description: Site-relative path to the ZIP archive to extract.
        dest_path:
          type: string
          description: Site-relative destination directory. Created if absent.
        confirm_executable_write:
          type: boolean
          default: false
          description: >
            Must be `true` when any archive entry would resolve to an
            executable-extension path (php, phar, htaccess, …).
            Requires owner permission (`site.files.write_code`). A non-owner
            passing this is rejected at the CP (agent never called) and the
            denial is audited at elevated severity.
        confirm_sensitive:
          type: boolean
          default: false
          description: >
            Must be `true` when any archive entry would resolve to a sensitive
            path (wp-config.php, .env*, *.pem, …).
            Same owner gate as `confirm_executable_write`.

    FileExtractResult:
      type: object
      description: Response body for a successful `POST /sites/{siteId}/files/extract`.
      required: [dest_path, extracted]
      properties:
        dest_path:
          type: string
          description: Resolved destination directory path (echoed).
        extracted:
          type: integer
          description: Number of entries extracted from the archive.

    FileSearchMatch:
      type: object
      description: One result in a `file_search` response.
      required: [path, name, size, mtime, is_dir]
      properties:
        path:
          type: string
          description: Site-relative path of the matching file or directory.
        name:
          type: string
          description: Basename of the entry.
        size:
          type: integer
          format: int64
          description: File size in bytes (0 for directories).
        mtime:
          type: integer
          format: int64
          description: Last-modified time as Unix epoch seconds.
        is_dir:
          type: boolean
          description: True when the matched entry is a directory.
        line:
          type: integer
          description: >
            Line number of the match within the file (`content` mode only;
            absent for `name` mode).
        snippet:
          type: string
          description: >
            Surrounding text context for the match (`content` mode only;
            absent for `name` mode). Never contains content from sensitive paths.

    FileSearchResult:
      type: object
      description: >
        Paginated list of search results from a `file_search` agent command.
      required: [matches, truncated]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/FileSearchMatch"
        truncated:
          type: boolean
          description: True when more results remain beyond this page.
        cursor:
          type: string
          nullable: true
          description: Opaque resume cursor; present only when `truncated=true`.

    FileVersion:
      type: object
      description: One version entry in a file's version history.
      required: [version_id, size, mtime, created_at]
      properties:
        version_id:
          type: string
          description: >
            Opaque version identifier. Pass to
            `POST /files/versions/restore` to restore this version.
        size:
          type: integer
          format: int64
          description: File size in bytes at this version.
        mtime:
          type: integer
          format: int64
          description: Last-modified time of this version (Unix epoch seconds).
        created_at:
          type: integer
          format: int64
          description: >
            When this version was created (Unix epoch seconds). May equal
            `mtime` when the agent derives both from the same filesystem timestamp.

    FileVersionsResult:
      type: object
      description: >
        Version history for a file, ordered newest-first, from a
        `file_versions_list` agent command.
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/FileVersion"
          description: >
            List of versions ordered newest-first. Empty when the agent has no
            history for the path (no version system configured or no prior writes).

    FileVersionRestoreRequest:
      type: object
      description: Request body for `POST /sites/{siteId}/files/versions/restore`.
      required: [path, version_id]
      properties:
        path:
          type: string
          description: Site-relative path of the file to restore.
        version_id:
          type: string
          description: >
            Opaque version identifier returned by `GET /files/versions?path=…`.
            Returns `404 no_such_version` when the ID does not exist for the path.
        confirm_sensitive:
          type: boolean
          default: false
          description: >
            Must be `true` when `path` matches the sensitive-file deny-list
            (wp-config.php, .env*, *.pem, …). Requires owner permission
            (`site.files.write_code`). A non-owner caller or a caller that
            omits this flag when the path is sensitive is rejected at the CP
            (agent never called) and the denial is audited at elevated severity.
            The agent independently re-checks and returns `sensitive_denied`
            when absent / false.

    FileVersionRestoreResult:
      type: object
      description: Response body for a successful `POST /sites/{siteId}/files/versions/restore`.
      required: [path, size, mtime, version_id]
      properties:
        path:
          type: string
          description: Resolved path of the restored file (echoed).
        size:
          type: integer
          format: int64
          description: Size of the restored file in bytes.
        mtime:
          type: integer
          format: int64
          description: Last-modified time after restore (Unix epoch seconds).
        version_id:
          type: string
          description: The version ID that was restored (echoed for audit correlation).

    # ---------------------------------------------------------------------------
    # ADR-056 Phase 3 — dashboard two-factor authentication
    # ---------------------------------------------------------------------------
    TwoFactorStatus:
      type: object
      description: Current 2FA configuration summary for the authenticated user.
      required: [totp_enabled, webauthn_count, recovery_codes_remaining, two_factor_enabled, trusted_devices]
      properties:
        totp_enabled: { type: boolean }
        webauthn_count: { type: integer }
        recovery_codes_remaining: { type: integer }
        two_factor_enabled: { type: boolean }
        trusted_devices:
          type: array
          items: { $ref: "#/components/schemas/TrustedDevice" }
    RecoveryCodesResponse:
      type: object
      description: A freshly (re)generated batch of 10 single-use recovery codes, shown exactly once.
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
    TwoFactorChallengeCompleteRequest:
      type: object
      description: >-
        Completes the 2FA challenge minted at login. `challenge` is the nonce
        from the login response; `code` is the TOTP code or recovery code
        depending on the endpoint.
      required: [challenge, code]
      properties:
        challenge: { type: string, format: uuid }
        code: { type: string }
        remember_device: { type: boolean, default: false }
        device_label: { type: string }
    WebAuthnCredential:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    TrustedDevice:
      type: object
      required: [id, label, user_agent, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        ip: { type: string }

    # ---------------------------------------------------------------------------
    # Orgs lifecycle
    # ---------------------------------------------------------------------------
    OrgList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, slug, role]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              role: { type: string, description: The caller's role in this org. }
    DeleteOrgResponse:
      type: object
      required: [id, lane]
      properties:
        id: { type: string, format: uuid }
        lane:
          type: string
          enum: [hard, soft]
          description: >-
            `hard` — an empty org was deleted immediately. `soft` — a
            populated org was soft-deleted and is recoverable until the
            grace-window purge worker runs.
        active_tenant_id:
          type: string
          format: uuid
          description: >-
            The caller's session active tenant AFTER this delete. Absent when
            it drops to no-org onboarding (this was their last live org).

    # ---------------------------------------------------------------------------
    # ADR-057 Phase 1 — hardening config + ban list; ADR-059 Phase 3 — policy
    # ---------------------------------------------------------------------------
    SiteHardeningConfig:
      type: object
      description: Per-site core-hardening toggles (ADR-057).
      properties:
        disable_file_editor: { type: boolean }
        xmlrpc_mode: { type: string, description: "One of the agent-defined XML-RPC restriction modes." }
        restrict_rest_api: { type: string, description: "One of the agent-defined REST API restriction modes." }
        restrict_login_identifier: { type: string, description: "One of the agent-defined login-identifier restriction modes." }
        force_unique_nickname: { type: boolean }
        disable_author_archive_enum: { type: boolean }
        force_ssl: { type: boolean }
        disable_directory_browsing: { type: boolean }
        disable_php_in_uploads: { type: boolean }
        protect_system_files: { type: boolean }
        updated_at: { type: string, format: date-time }
    SiteBan:
      type: object
      required: [id, type, value, comment, actor_type, actor_id, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, description: "Ban entry kind (e.g. ip, username, user_agent)." }
        value: { type: string }
        comment: { type: string }
        actor_type: { type: string }
        actor_id: { type: string }
        created_at: { type: string, format: date-time }
    SiteSecurityPolicy:
      type: object
      description: Site-user (WordPress user) auth policy — 2FA + password requirements (ADR-059).
      properties:
        two_factor_enabled: { type: boolean }
        two_factor_methods:
          type: array
          items: { type: string }
        two_factor_required_roles:
          type: array
          items: { type: string }
        two_factor_grace_logins: { type: integer }
        two_factor_remember_device_days: { type: integer }
        block_xmlrpc_for_2fa_users: { type: boolean }
        password_min_zxcvbn_score: { type: integer }
        password_min_zxcvbn_roles:
          type: array
          items: { type: string }
        password_block_compromised: { type: boolean }
        password_reuse_block_count: { type: integer }
        password_max_age_days: { type: integer }
        password_expiry_roles:
          type: array
          items: { type: string }
        hide_backend_enabled: { type: boolean }
        hide_backend_slug: { type: string }
        hide_backend_redirect: { type: string }
        updated_at: { type: string, format: date-time }
    SitePolicyGroup:
      type: object
      description: A per-role override of the site-user auth policy.
      required: [role]
      properties:
        role:
          type: string
          description: The WordPress role slug this override applies to (e.g. administrator).
        require_2fa: { type: boolean, nullable: true }
        allowed_methods:
          type: array
          items: { type: string }
        min_zxcvbn_score: { type: integer, nullable: true }
        block_compromised: { type: boolean, nullable: true }
        max_age_days: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    # ---------------------------------------------------------------------------
    # S3 malware / file-integrity scans
    # ---------------------------------------------------------------------------
    ScanRun:
      type: object
      required: [id, site_id, kind, status, files_scanned, created_at]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        kind: { type: string, description: "core | plugins | themes | full" }
        status: { type: string, description: "queued | running | completed | failed" }
        files_scanned: { type: integer, format: int64 }
        wp_version: { type: string }
        locale: { type: string }
        error: { type: string }
        finding_counts:
          type: object
          additionalProperties: { type: integer }
          description: Count of findings by severity for this run.
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ScanFinding:
      type: object
      required: [id, site_id, run_id, finding_type, path, severity, ignored, created_at, last_seen_run]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        finding_type: { type: string, description: "modified | added | missing" }
        path: { type: string }
        severity: { type: string }
        expected_md5: { type: string }
        actual_md5: { type: string }
        ignored: { type: boolean }
        ignored_by: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_run: { type: string, format: uuid }
    ScanFindingFile:
      type: object
      required: [ok, path, size]
      properties:
        ok: { type: boolean }
        path: { type: string }
        size: { type: integer, format: int64 }
        content_base64: { type: string }
        error: { type: string }

    # ---------------------------------------------------------------------------
    # m79 vulnerability scanner
    # ---------------------------------------------------------------------------
    VulnAttribution:
      type: object
      description: Vulnerability-feed attribution notices, rendered in the UI footer and on any finding row that shows a CVE.
      required: [defiant_notice, defiant_license, mitre_notice]
      properties:
        defiant_notice: { type: string }
        defiant_license: { type: string }
        mitre_notice: { type: string }
    VulnFinding:
      type: object
      required: [id, site_id, vuln_id, kind, slug, name, installed_version, severity, title, status, first_seen, last_seen, references, wordfence_link]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        vuln_id: { type: string }
        kind: { type: string, description: "core | plugin | theme" }
        slug: { type: string }
        name: { type: string }
        installed_version: { type: string }
        fixed_version: { type: string }
        severity: { type: string }
        cvss_score: { type: number, format: double }
        cve: { type: string }
        cve_link: { type: string }
        title: { type: string }
        status: { type: string, description: "open | dismissed | remediated" }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        references:
          type: array
          items: { type: string }
        wordfence_link:
          type: string
          description: >-
            Deterministic per-record Wordfence Intelligence vulnerability-database
            URL, built from vuln_id (https://www.wordfence.com/threat-intel/vulnerabilities/id/{vuln_id}).
            Satisfies the Defiant per-record attribution requirement independently
            of the references[] array's contents.
    SiteVulnerabilitiesResponse:
      type: object
      required: [items, attribution, feed_ok, enrichment_available]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/VulnFinding" }
        attribution: { $ref: "#/components/schemas/VulnAttribution" }
        feed_ok: { type: boolean }
        feed_synced: { type: string, format: date-time }
        enrichment_available:
          type: boolean
          description: True when the Production feed has successfully enriched findings with CVSS/CVE data, independent of feed_ok (which tracks Scanner-driven detection freshness).
        last_enrichment_at: { type: string, format: date-time }
    FleetVulnerabilitiesResponse:
      type: object
      required: [total_open, critical, high, medium, low, unknown, items, attribution, feed_ok, enrichment_available]
      properties:
        total_open: { type: integer }
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
        unknown:
          type: integer
          description: Findings with neither a CVSS rating nor a numeric score yet — genuinely unknown severity, not a confirmed low.
        items:
          type: array
          items:
            type: object
            required: [site_id, site_name, site_url, finding]
            properties:
              site_id: { type: string, format: uuid }
              site_name: { type: string }
              site_url: { type: string }
              finding: { $ref: "#/components/schemas/VulnFinding" }
        attribution: { $ref: "#/components/schemas/VulnAttribution" }
        feed_ok: { type: boolean }
        feed_synced: { type: string, format: date-time }
        enrichment_available:
          type: boolean
          description: True when the Production feed has successfully enriched findings with CVSS/CVE data, independent of feed_ok (which tracks Scanner-driven detection freshness).
        last_enrichment_at: { type: string, format: date-time }

    # ---------------------------------------------------------------------------
    # Read-only agent-freshness dashboard (internal/agentrelease)
    # ---------------------------------------------------------------------------
    AgentLatestVersion:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: The currently published WPMgr agent version, or "unknown" when it cannot be determined right now.
    FleetAgentCounts:
      type: object
      required: [current, outdated, unknown, ineligible]
      properties:
        current: { type: integer }
        outdated: { type: integer }
        unknown: { type: integer }
        ineligible: { type: integer }
    FleetAgentSite:
      type: object
      required: [site_id, site_name, agent_version, status]
      properties:
        site_id: { type: string, format: uuid }
        site_name: { type: string }
        agent_version:
          type: string
          description: The site's last-reported agent_version, verbatim. Empty when the agent has never reported one; distinct from status="unknown", which also covers a malformed version string.
        status:
          type: string
          enum: [current, outdated, unknown, ineligible]
    FleetAgentVersions:
      type: object
      required: [latest_version, reference_source, counts, sites, agent_mirror]
      properties:
        latest_version:
          type: string
          description: >
            The single version every site in sites was classified against, or
            "unknown" when there was none. Read it together with
            reference_source, which says where it came from: under "fleet"
            this is the newest agent version seen in THIS tenant's fleet, not
            the newest agent that exists, and presenting it as the latter
            would overclaim.
        reference_source:
          type: string
          enum: [published, fleet, none]
          description: >
            Where latest_version came from. "published": the release channel
            pointer manifest (agent-releases/latest.json), so "current" means
            the site runs the newest agent that exists. "fleet": the manifest
            could not be read, so the newest well-formed agent version present
            in this tenant's own fleet was used instead; "current" then means
            only that no newer agent has been seen in this fleet. A
            self-hosted install has its own object storage and never receives
            the release pipeline's manifest, so this is its normal steady
            state. "none": nothing safe to compare against, so every site is
            "unknown". That arises two ways, and they are deliberately not
            distinguished in this field: an install that has never read a
            manifest and has no well-formed agent version anywhere in its
            fleet, or an install whose manifest WAS readable but has been
            unreadable for longer than the staleness bound. The second case
            does not fall back to "fleet", because "this install has a
            channel and it is currently unreachable" must not be answered
            with fleet-derived data.
        counts: { $ref: "#/components/schemas/FleetAgentCounts" }
        sites:
          type: array
          items:
            $ref: "#/components/schemas/FleetAgentSite"
        self_update_enabled:
          type: boolean
          description: >
            Whether the control plane's agent self-update channel (the
            fleet-wide WPMGR_UPDATE_AGENT_SELF_UPDATE_ENABLED kill switch) is
            currently turned on for this instance. Absent or false while the
            channel ships dark. The frontend uses this, together with the
            operator's role, to decide whether the "Update WPMgr agent" bulk
            action is shown at all, rather than let an operator arm a run the
            control plane will only refuse.
        agent_mirror: { $ref: "#/components/schemas/AgentMirrorStatus" }

    AgentMirrorStatus:
      type: object
      required:
        [enabled, status, stale_after_seconds, can_check_now, last_success_at,
         last_success_outcome, last_success_version, last_attempt_at,
         last_attempt_outcome, last_attempt_detail, last_attempt_trigger,
         last_mirrored_at, last_mirrored_version]
      description: >
        Freshness of the UPSTREAM AGENT-RELEASE MIRROR (internal/agentupstream,
        WPMGR_UPDATE_AGENT_MIRROR_ENABLED), which on a self-hosted install is
        what keeps agent-releases/latest.json, and therefore latest_version,
        up to date (GH #322), together with one capability: whether the
        CALLING VIEWER may trigger a check on that mirror right now
        (can_check_now).

        Every field except can_check_now describes the MIRROR JOB, never the
        reference version itself. When reference_source is "fleet" or "none"
        there is no published reference, and these timestamps say nothing
        about latest_version. When enabled is false there is no mirror at all:
        on the hosted service the release pipeline writes the manifest
        directly, so every timestamp here is null, no freshness age should be
        shown to a user, and can_check_now is false for everyone.

        can_check_now is the one field that is a property of the CALLER rather
        than of the install, so it is not cacheable across users: two people
        looking at the same fleet can legitimately receive different values.
      properties:
        enabled:
          type: boolean
          description: >
            Whether this install runs the upstream mirror
            (WPMGR_UPDATE_AGENT_MIRROR_ENABLED). False on the hosted service
            and by default. Always emitted so a caller never has to treat
            "absent" and "off" as the same undefined thing.
        status:
          type: string
          enum: [disabled, pending, ok, stale, standing_down, misconfigured]
          description: >
            Server-computed roll-up, so the staleness threshold has exactly
            one definition. "disabled": mirroring is off, show nothing.
            "misconfigured": enabled but it cannot run (the last attempt was
            not_configured), which never self-heals, so it warns immediately.
            "standing_down": this install publishes its own agent releases
            and the mirror is correctly refusing to overwrite them
            (foreign_channel); informational, never a warning. "pending":
            enabled, no attempt yet. "stale": nothing confirmed against
            upstream within stale_after_seconds, or never confirmed. "ok":
            confirmed recently.
        stale_after_seconds:
          type: integer
          format: int32
          description: >
            The staleness threshold behind status="stale", in seconds
            (46800, i.e. 13 hours). Emitted so a client can phrase the
            warning without duplicating the constant. It is two nominal
            6h30m cycles (the 6h schedule plus up to 30m jitter) and clears
            the roughly 12h30m gap a single control-plane restart can
            legitimately produce (River's periodic-job scheduler recomputes
            its next run as "now plus the interval" on restart rather than
            resuming a prior clock), so reaching it means at least two
            consecutive scheduled runs failed to confirm anything.
        can_check_now:
          type: boolean
          description: >
            Whether the CALLING VIEWER may trigger a mirror check on this
            install right now, i.e. whether POST
            /api/v1/admin/agent-mirror/check would admit this caller rather
            than answer 403. The dashboard renders its "Check now" action in
            the Sites page Agent column popover exactly when this is true, so
            an operator is never offered a button that refuses them, and the
            operator who may act is never left without one.

            The control plane computes this from the SAME decision the
            endpoint's own gate runs, not a second copy of the rule: superadmin
            (users.is_superadmin), OR the owner of the only live organisation
            on this install (GH #322, the single-tenant self-hosted case, where
            the multi-tenant protection the gate exists for has no other tenant
            to protect). An API-key principal is always false, since this is an
            install-level action against a shared upstream request budget and
            the audit record wants a human.

            False whenever enabled is false: no caller may trigger a run that
            does not exist. False for every non-superadmin on an install with
            more than one live organisation, which leaves the hosted,
            multi-tenant case exactly as it was. A second organisation
            appearing closes the path again on the very next request, because
            nothing about this answer is cached.
        last_success_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When this install last CONFIRMED what upstream publishes: the
            last attempt whose outcome was mirrored, current, or unchanged.
            This is the ONLY field an age may ever be rendered from. Null
            when it has never happened. Deliberately distinct from
            last_attempt_at: a run that failed ten minutes ago must never be
            reported as "checked ten minutes ago".
        last_success_outcome:
          type: string
          enum: [mirrored, current, unchanged]
          nullable: true
          description: >
            Which kind of confirmation last_success_at was. "mirrored": a
            new release was published here. "current": upstream examined and
            this install already publishes exactly it. "unchanged": upstream
            answered 304, which is a genuine confirmation because the
            conditional request is only sent while the published pointer is
            unchanged too.
        last_success_version:
          type: string
          nullable: true
          description: >
            The agent version that confirmation established. Carried forward
            across an "unchanged" (304) result, which by definition names the
            same release.
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When a mirror run last executed, whatever the result. Null when
            none ever has. Never render an age from this field.
        last_attempt_outcome:
          type: string
          enum:
            [mirrored, current, unchanged, rate_limited, refused,
             foreign_channel, upstream_unavailable, storage_error,
             not_configured]
          nullable: true
          description: >
            "rate_limited" is NOT a failure: the mirror keeps a minimum gap
            between upstream requests, and skipping is expected and must
            never be presented as an error. "refused" means upstream was
            reached and the release was deliberately not published (not
            newer, or the versions cannot be ordered). "foreign_channel"
            means this install publishes its own agent releases and the
            mirror will never overwrite them. "upstream_unavailable" and
            "storage_error" are the real failures: something was tried and it
            broke.
        last_attempt_detail:
          type: string
          nullable: true
          description: >
            Short non-secret reason for the last attempt, composed by the
            control plane and capped at 200 characters. Never a raw wrapped
            error, so it can never carry a presigned URL or any credential.
        last_attempt_trigger:
          type: string
          enum: [periodic, manual]
          nullable: true
          description: Whether the last attempt was the scheduled tick or an operator-requested check now.
        last_mirrored_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the mirror last actually PUBLISHED a new release into this
            install's storage, as opposed to merely confirming the existing
            one.
        last_mirrored_version:
          type: string
          nullable: true

    AgentMirrorCheckQueued:
      type: object
      required: [status, queued_at, message]
      properties:
        status:
          type: string
          enum: [queued]
          description: >
            Always "queued". The run has NOT executed yet. Callers must not
            present this as "checked" or "up to date"; poll
            GET /api/v1/fleet/agents and read
            agent_mirror.last_attempt_outcome for the real outcome.
        queued_at:
          type: string
          format: date-time
        message:
          type: string

