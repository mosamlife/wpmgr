      summary: Paginated, filtered list of tenant accounts (superadmin)
      description: |
        Superadmin-only accounts console: instance-wide header tiles (always
        unfiltered by the current query, so they read as a stable instance
        census) plus a filtered, sorted, paginated list of every tenant.
        Default order is a server-computed "needs attention" ranking:
        suspended first, then past_due (soonest-to-expire grace first), then
        active (MRR desc), then everything else (newest first). Requires
        is_superadmin=true.
      tags: [admin-billing]
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive substring match against org name, org slug, or owner email.
        - name: status
          in: query
          schema: { type: string }
          description: >-
            Comma-separated tenants.plan_status values to filter by (e.g.
            "past_due,canceled").
        - name: plan
          in: query
          schema: { type: string }
          description: Comma-separated plan tiers to filter by (e.g. "starter,agency").
        - name: past_due
          in: query
          schema: { type: boolean, default: false }
          description: Restrict to accounts whose plan_status is past_due.
        - name: near_limit
          in: query
          schema: { type: boolean, default: false }
          description: Restrict to accounts at or above 80% of their site or storage cap.
        - name: has_overrides
          in: query
          schema: { type: boolean, default: false }
          description: Restrict to accounts with a non-empty tenants.plan_overrides.
        - name: comped
          in: query
          schema: { type: boolean, default: false }
          description: Restrict to accounts whose plan_status is comped.
        - name: idle_90d
          in: query
          schema: { type: boolean, default: false }
          description: Restrict to accounts with no recorded activity in the last 90 days.
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
