                $ref: "#/components/schemas/ClientReportSchedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putClientReportSchedule
      summary: Create or update the report schedule for a client
      tags: [clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
