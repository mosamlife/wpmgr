        updated_at: { type: string, format: date-time }
    SmtpSettingsUpdate:
      type: object
      required: [enabled, host, port, username, from_address, from_name, tls_mode, allow_insecure_tls]
      properties:
        enabled: { type: boolean }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        from_address: { type: string }
        from_name: { type: string }
        tls_mode: { type: string, description: "none | starttls | tls" }
        allow_insecure_tls: { type: boolean }
        password:
          type: string
          format: password
          nullable: true
          description: Write-only. Omit or null to leave the stored ciphertext unchanged.

    # ---------------------------------------------------------------------------
