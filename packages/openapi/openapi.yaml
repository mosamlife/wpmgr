              schema:
                $ref: "#/components/schemas/SitePolicyGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteSitePolicyGroup
      summary: Delete a per-role policy group override
      description: Requires the `site.security.manage` permission.
      tags: [security]
