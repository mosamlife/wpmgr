                  status:
                    type: string
                    enum: [pending]
                  updated_at:
                    type: string
                    format: date-time
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Site not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Screenshot capture not configured on this instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/updates/available:
    get:
      operationId: getSiteAvailableUpdates
      summary: Get the cached per-item available-updates list for a site
      description: |
        Returns the cached list of plugins/themes (and core) that have an update
        available, derived from the agent's last metadata sync. Items are sorted
        core -> plugins -> themes, with active before inactive. `as_of` is the
        site's last update timestamp. Requires viewer+.
      tags: [updates]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Available updates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAvailableUpdates"
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/recheck:
    post:
      operationId: recheckSite
      summary: Operator-triggered synchronous connection re-check (M58)
      description: |
        Dispatches a synchronous `metadata` command to the site's agent,
        applies the returned metadata, and records a heartbeat (recovering
        the connection state to `connected` when it was `degraded` or
        `disconnected`). Rate-limited per (tenant, site). Requires
        `site.write` and site access; no org-scope requirement (a
        write-access collaborator may re-check).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Re-check completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecheckResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: recheck_rate_limited — see `Retry-After` header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: agent_unreachable — could not reach the site agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: recheck_disabled or lifecycle_disabled — re-check is not available on this control plane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/uptime:
    get:
      operationId: getSiteUptime
      summary: Get a site's uptime status over a window
      description: |
        Returns the uptime % and average latency for a site over the requested
        window (7d/30d/90d), the current up/down state, the last check time, the
        TLS certificate expiry, and a downsampled recent check series. Metrics
        come from the ClickHouse uptime store, scoped by tenant_id + site_id; the
        site's tenant ownership is verified in Postgres first (a foreign site is
        a 404). Requires viewer+.
      tags: [uptime]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: ["7d", "30d", "90d"]
            default: "7d"
      responses:
        "200":
          description: The site's uptime status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UptimeStatus"
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/backups/fleet:
    get:
      operationId: listFleetBackups
      summary: Paginated filtered list of backup snapshots across fleet sites
      description: |
        Returns a filtered, paginated list of backup snapshots across the caller's
        accessible sites. Org-scoped principals see all tenant sites; site-scoped
        collaborators see only their granted sites. Requires viewer+.
      tags: [backups]
      parameters:
        - name: sites
          in: query
          schema:
            type: string
          description: Comma-separated site UUIDs. Defaults to all accessible sites.
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
          description: Filter by snapshot status.
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated snapshot list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupFleetList"
  /api/v1/backups/health:
    get:
      operationId: getFleetBackupHealth
      summary: Per-site backup health classification across the fleet
      description: |
        Returns one health item per requested site with a server-derived status:
        unprotected, failed, stale, in_flight, or protected. Requires viewer+.
      tags: [backups]
      parameters:
        - name: sites
          in: query
          schema:
            type: string
          description: Comma-separated site UUIDs. Defaults to all accessible sites.
      responses:
        "200":
          description: Per-site backup health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupHealthList"
  /api/v1/fleet/status:
    get:
      operationId: getFleetUptimeStatus
      summary: Fleet-wide uptime status with summary counts and per-site items
      description: |
        Returns summary counts {up, degraded, down, unknown} and a per-site list
        with the latest probe result, 7-day uptime %, and in-incident flag.
        Status derivation: down=latest probe up=false; degraded=up but latency
        >2000ms, or connection_state=degraded (status_reason=agent_degraded),
        or connection_state=disconnected (status_reason=agent_unreachable, GH
        #291: a cached response can stay up=true while the agent side already
        proved the site unreachable); up=probe up+fast; unknown=no probe.
        connection_state=revoked/archived does not affect status derivation
        (the operator deliberately stopped managing the site). Requires
        viewer+.
      tags: [uptime]
      responses:
        "200":
          description: Fleet uptime status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetUptimeStatus"
  /api/v1/fleet/incidents:
    get:
      operationId: getFleetIncidents
      summary: Open incidents and recently-alerted sites
      description: |
        Returns open incidents (in_incident=true) and recently-alerted sites
        (last_alert_at >= since). Full historical incident reconstruction is NOT
        possible from site_alert_state, which stores only current transition
        memory. ended_at/duration_seconds are estimated from updated_at for
        closed incidents, not from a true incident-close record. Requires viewer+.
      tags: [uptime]
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Lower bound on last_alert_at. Defaults to 7 days ago.
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 100
      responses:
        "200":
          description: Open incidents and recent alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetIncidentList"
  /api/v1/fleet/incidents/{incidentId}:
    get:
      operationId: getFleetIncidentDetail
      summary: Incident detail — summary, probe timeline, and 30-day flapping count (M94, GH #148)
      description: |
        A site-scoped collaborator without access to the incident's own site
        gets `404 incident_not_found` (never a distinguishing signal).
      tags: [uptime]
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Incident detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetIncidentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/agent/latest:
    get:
      operationId: getAgentLatestVersion
      summary: Currently published WPMgr agent release version
      description: |
        Reads the published agent-releases/latest.json pointer manifest (the
        same object internal/agent/update_handler.go serves to agents)
        through a cached, best-effort reader. version is "unknown" when no
        release has ever been published, object storage is not configured,
        or the manifest cannot currently be read; this never surfaces as an
        error.
      tags: [agent-releases]
      responses:
        "200":
          description: The currently published agent version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLatestVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/fleet/agents:
    get:
      operationId: getFleetAgentVersions
      summary: Tenant-wide agent-version rollup across all sites
      description: |
        Per-site {site_id, site_name, agent_version, status} plus fleet-wide
        counts, classified against a single reference version. That reference
        is the published agent version when the release manifest can be read,
        and otherwise the newest well-formed agent version present in this
        tenant's own fleet, which is what a self-hosted install (whose object
        storage never receives the release pipeline's manifest) gets.
        reference_source names which of the two, or "none" when neither was
        available. status is one of current | outdated | unknown | ineligible.
        "unknown" covers a site that has never reported agent_version, a
        malformed/unparseable version on either side of the comparison, or a
        reference_source of "none"; never a false
        "outdated". "ineligible" is a site that cannot self-update at all:
        today that is the public plugin-directory build, which ships without
        the self-updater and is upgraded by the plugin directory instead.
        Such a site is identified from its own plugin inventory and is
        reported "ineligible" whatever its version, because comparing it
        against a release channel it cannot consume would be a permanent
        false "outdated". Org-scoped only
        (RequireOrgScope), mirroring the vulnerability-scanner fleet rollup:
        a site-scoped collaborator has no cross-site rollup.

        agent_mirror (GH #322) reports the freshness of the upstream release
        mirror, which on a self-hosted install is what keeps latest_version
        up to date. It describes the mirror job, not the reference version:
        when reference_source is "fleet" or "none", or when
        agent_mirror.enabled is false, its timestamps say nothing about
        latest_version and no freshness age should be shown.
      tags: [agent-releases]
      responses:
        "200":
          description: Fleet agent-version rollup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetAgentVersions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/perf/rum/fleet:
    get:
      operationId: getFleetRumAggregate
      summary: Cross-site RUM Core Web Vitals aggregate
      description: |
        Returns a fleet-level CWV aggregate across all tenant sites reporting RUM
        data in the window. Includes summary counts, per-metric p75/rating/
        distribution, fleet pass %, and worst offenders. Org-scope only;
        site-scoped collaborators should use the per-site /perf/rum/summary.
        Requires viewer+.
      tags: [perf]
      parameters:
        - name: window_days
          in: query
          schema:
            type: integer
            default: 28
            minimum: 1
            maximum: 365
        - name: device
          in: query
          schema:
            type: string
            enum: [desktop, mobile, tablet, all]
          description: Device filter. Default all (no device filter).
      responses:
        "200":
          description: Fleet RUM aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetRumAggregate"
  /api/v1/perf/db/fleet-health:
    get:
      operationId: getFleetDbHealth
      summary: Fleet-level database health aggregate across all scanned sites
      description: |
        Returns an aggregate of database health metrics across all tenant sites
        that have at least one completed DB scan within the lookback window.
        Includes total DB size, orphaned option/cron counts, and the top-N sites
        by DB size. Org-scope only. Requires viewer+.
      tags: [perf]
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 90
            minimum: 7
            maximum: 365
          description: Lookback window for growth calculation.
      responses:
        "200":
          description: Fleet DB health aggregate
          content:
            application/json:
              schema:
                type: object
                description: Fleet DB health aggregate (shape matches FleetDbHealth Go model).
                properties:
                  sites_needing_review:
                    type: array
                    description: |
                      Every scanned site with at least one orphan candidate
                      (orphaned wp_options rows or WP-Cron events) — NOT
                      capped, unlike top_sites (which is capped at 10 and
                      ordered by DB size, so a small flagged site can be
                      absent from it). Sorted by orphan count descending,
                      then by site name.
                    items:
                      type: object
                      properties:
                        site_id:
                          type: string
                          format: uuid
                        site_name:
                          type: string
                        orphaned_options_count:
                          type: integer
                        orphaned_cron_count:
                          type: integer
  /api/v1/uptime/summary:
    get:
      operationId: getUptimeSummary
      summary: Current up/down status per site for the dashboard
      description: |
        Returns the current up/down status and last check for every site in the
        tenant (from the latest recorded probe). Requires viewer+.
      tags: [uptime]
      responses:
        "200":
          description: Per-site current uptime status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UptimeSummary"
  /api/v1/alert-config:
    get:
      operationId: getAlertConfig
      summary: Get the tenant's uptime alert configuration
      description: |
        Returns the tenant's downtime/recovery alert channel: email recipients,
        whether a webhook is configured, and the enabled flag. The webhook secret
        is never returned. Requires admin+.
      tags: [uptime]
      responses:
        "200":
          description: The tenant's alert configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfig"
    put:
      operationId: putAlertConfig
      summary: Create or update the tenant's uptime alert configuration
      description: |
        Sets the email recipients, webhook URL + signing secret, and enabled flag
        for downtime/recovery alerts. The webhook secret is write-only. Requires
        admin+.
      tags: [uptime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertConfigUpdate"
      responses:
        "200":
          description: The saved alert configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfig"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # ── ADR-037 Sprint 2 — Site Health (diagnostics) + PHP error monitor ────────
  /api/v1/sites/{siteId}/diagnostics:
    get:
      operationId: getSiteDiagnostics
      summary: Latest site diagnostics by category
      description: |
        Returns one card per category (14 total) carrying the latest payload
        the agent shipped + the collection/freshness timestamps. Categories the
        agent has never reported for are returned with a null payload so the UI
        can render an "awaiting first sync" placeholder.
      tags: [diagnostics]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Site diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDiagnosticsList"
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/diagnostics/refresh:
    post:
      operationId: refreshSiteDiagnostics
      summary: Enqueue an on-demand diagnostics command to the agent
      description: |
        Enqueues a signed `diagnostics` command to the agent. The agent runs
        the 14-category collector immediately and pushes the result back to
        POST /agent/v1/diagnostics. Returns 202 on accept. Returns 503 with
        code `diagnostics_refresh_unwired` when the CP->agent commander has
        not yet been wired (V1).
      tags: [diagnostics]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "202":
          description: Refresh enqueued
        "503":
          description: Refresh is not yet wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/errors:
    get:
      operationId: listSitePHPErrors
      summary: List fingerprint-grouped PHP errors for a site
      description: |
        Returns the agent-captured PHP errors for the site, grouped by md5
        fingerprint. Each row carries the occurrence count, first/last seen
        timestamps, and the silenced flag.
      tags: [diagnostics]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only rows whose last_seen_at is after this timestamp.
        - name: silenced
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter by silenced state. Omit for both.
        - $ref: "#/components/parameters/Limit"
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: PHP error list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PHPErrorList"
  /api/v1/sites/{siteId}/errors/{md5}/silence:
    post:
      operationId: silenceSitePHPError
      summary: Silence (or unsilence) a fingerprint-grouped PHP error
      description: |
        Toggles the silenced flag on a (site, md5) error row. The agent
        continues to count silently on its side; the CP UI hides silenced
        rows by default.
      tags: [diagnostics]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: md5
          in: path
          required: true
          schema:
            type: string
          description: The md5 fingerprint.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PHPErrorSilence"
      responses:
        "204":
          description: Silence flag updated
        "404":
          description: Error not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # ── S1.2 PHP-error ignore-list + error-level config ─────────────────────────
  /api/v1/sites/{siteId}/errors/config:
    get:
      operationId: getSiteErrorConfig
      summary: Get the per-site PHP error reporting config
      description: |
        Returns the site's PHP error-level mask and md5 ignore-list. When no
        config row has been saved yet the defaults are returned: error_level=6143
        (WordPress default E_ALL & ~E_STRICT) and an empty ignore_md5s list.
        The config is pushed to the agent on each PATCH; this GET only reads
        the CP-side stored value.
      tags: [diagnostics]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Error config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteErrorConfig"
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: patchSiteErrorConfig
      summary: Save per-site PHP error reporting config and push to agent
      description: |
        Stores the PHP error-level mask and md5 ignore-list for the site, then
        pushes the new config to the agent via a signed `sync_error_config`
        command. Returns the stored config on success.

        Validation:
          - `error_level` must be a positive integer that fits in int32 (>0,
            ≤2147483647). Typical values: 6143 (WP default), 32767 (E_ALL),
            0x7FFFFFFF (all flags set).
          - Each entry in `ignore_md5s` must be exactly 32 lowercase hex
            characters (the md5(code:file:line:message) fingerprint produced
            by the agent).

        If the agent push fails after the config is successfully stored the
        response is still HTTP 200 with the stored config; an
        `X-Agent-Push-Warning` response header carries the push error message
        so the UI can surface it as a non-blocking warning.
      tags: [diagnostics]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteErrorConfigUpdate"
      responses:
        "200":
          description: Config stored (and pushed to agent unless the push failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteErrorConfig"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # ── ADR-037 Sprint 3 — WordPress activity log (tamper-evident) ──────────────
  /api/v1/sites/{siteId}/activity:
    get:
      operationId: listSiteActivity
      summary: List WordPress activity-log events for a site
      description: |
        Returns the agent-captured WordPress activity events for the site,
        newest first. Each event carries the hash-chain fields (prev_hash,
        this_hash) and a server-verified chain_valid flag: the CP recomputes
        every event's hash at ingest and flags any tamper (a mutated, inserted,
        or deleted historical row) as chain_valid=false. Filter by event_type,
        object_type, actor_login, severity, and an occurred-at time range.
      tags: [activity]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: event_type
          in: query
          required: false
          schema: { type: string }
          description: Exact-match filter on the event type.
        - name: object_type
          in: query
          required: false
          schema: { type: string }
          description: Exact-match filter on the object type.
        - name: actor_login
          in: query
          required: false
          schema: { type: string }
          description: Exact-match filter on the actor login.
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [high, medium, low]
          description: Filter by severity.
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Only events whose occurred_at is at/after this timestamp.
        - name: until
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Only events whose occurred_at is at/before this timestamp.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Activity event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteActivityList"
  /api/v1/sites/{siteId}/activity/verify:
    get:
      operationId: verifySiteActivity
      summary: Re-verify the activity-log hash chain for a site
      description: |
        Recomputes the entire hash chain for the site server-side from genesis
        and reports whether it is intact. When a break is found, break_at_seq
        carries the seq of the first event whose recomputed hash (or prev_hash
        linkage) does not match — the tamper point. This is the integrity badge
        feeding the activity view.
      tags: [activity]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Chain verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityVerifyResult"
  # ── S2 — Login Protection + IP store ───────────────────────────────────────
  /api/v1/sites/{siteId}/security/login-protection:
    get:
      operationId: getSiteLoginProtection
      summary: Get the login-protection config for a site
      description: |
        Returns the current login-protection mode, brute-force thresholds, IP
        header selection, and CIDR allow/deny lists for the site. When no config
        has been saved yet, returns the built-in defaults (mode=protect, standard
        thresholds, REMOTE_ADDR, empty CIDR lists).
      tags: [security]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Current login-protection config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteLoginProtectionConfig"
    put:
      operationId: putSiteLoginProtection
      summary: Save (and push to agent) the login-protection config
      description: |
        Stores the new config and pushes it to the agent via the signed
        `sync_security_config` command. If the agent push fails after a
        successful store, HTTP 200 is still returned with the stored config;
        the push error is surfaced in the `X-Agent-Push-Warning` response
        header so callers can surface it as a non-blocking warning.

        **Safety rail**: when `mode` is `"protect"` and `allow_cidrs` is empty,
        the CP automatically adds the requesting operator's client IP (/32 for
        IPv4, /128 for IPv6) to `allow_cidrs` before storing. This prevents the
        operator from enabling protection and immediately locking themselves out.
        The auto-added CIDR is reflected in the returned config.
      tags: [security]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteLoginProtectionConfigUpdate"
      responses:
        "200":
          description: Stored login-protection config (including any auto-added operator CIDR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteLoginProtectionConfig"
        "422":
          description: Validation error (invalid mode, CIDR, or thresholds)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/security/unblock-ip:
    post:
      operationId: unblockSiteIP
      summary: Unblock an IP address on the site
      description: |
        Sends the signed `unblock_ip` command to the site's agent, removing any
        active block for the given IP. Returns `ok=true` on success; `ok=false`
        with a `detail` message when the agent rejects or cannot apply the
        unblock (still HTTP 200 — it is an application-level, not transport, failure).
      tags: [security]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnblockIPRequest"
      responses:
        "200":
          description: Unblock result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnblockIPResult"
        "422":
          description: Validation error (invalid IP address)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Security agent client not wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/security/login-events:
    get:
      operationId: listSiteLoginEvents
      summary: List login events for a site
      description: |
        Returns the agent-ingested login events for the site, ordered by
        `occurred_at` descending (newest first). Filter by `status` (1=failure,
        2=success, 3=blocked). Default limit is 100; max 500.
      tags: [security]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 100
          description: Maximum number of events to return.
        - name: status
          in: query
          required: false
          schema:
            type: integer
            format: int32
            enum: [1, 2, 3]
          description: |
            Filter by login-event status: 1=failure, 2=success, 3=blocked.
            Omit to return all statuses.
      responses:
        "200":
          description: Login event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteLoginEventList"
  # ── ADR-057 Phase 1 — hardening config + ban list ──────────────────────────
  /api/v1/sites/{siteId}/security/hardening:
    get:
      operationId: getSiteHardeningConfig
      summary: Get the hardening config for a site
      tags: [security]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Current hardening config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteHardeningConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putSiteHardeningConfig
      summary: Save the hardening config for a site and push it to the agent
      description: |
        Requires the `site.security.manage` permission. On a successful store
        but failed agent push, returns `200` with the stored config and an
        `X-Agent-Push-Warning` header (never a 5xx — the config is durably
        saved and will be re-pushed on the next reconcile).
      tags: [security]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteHardeningConfig"
      responses:
        "200":
          description: Hardening config saved (see `X-Agent-Push-Warning` header for a non-fatal push failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteHardeningConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/sites/{siteId}/security/bans:
    get:
      operationId: listSiteBans
      summary: List ban entries for a site
      tags: [security]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Ban list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SiteBan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createSiteBan
      summary: Create a ban entry for a site
      description: Requires the `site.security.manage` permission.
      tags: [security]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type:
                  type: string
                  description: Ban entry kind (e.g. `ip`, `username`, `user_agent`).
                value:
                  type: string
                comment:
                  type: string
      responses:
        "201":
          description: Ban created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteBan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/sites/{siteId}/security/bans/{banId}:
    delete:
      operationId: deleteSiteBan
