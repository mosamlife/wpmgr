  /api/v1/audit:
    get:
      operationId: listAudit
      summary: List the active tenant's audit log (admin+)
      tags: [audit]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: action
          in: query
          required: false
          description: >
            Prefix-match filter on the `action` field. Passing `site.files.`
            returns every file-manager event; passing an exact action string
            (e.g. `site.files.delete`) also works because it is a prefix of
            itself. Omit to return all actions.
          schema:
            type: string
        - name: site_id
          in: query
          required: false
          description: >
            UUID of a specific site. When set, only entries whose `target_type`
            is `"site"` and `target_id` matches this UUID are returned. All
            per-site actions (file-manager, perf, backup, cache, security, …)
            write the site UUID as `target_id` with `target_type="site"`, so
            this filter produces a complete per-site timeline. Omit to return
            entries for all sites.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/audit/verify:
    get:
      operationId: verifyAudit
      summary: Verify the integrity of the audit hash-chain (admin+)
      tags: [audit]
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerify"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/audit/integrity/rebaseline:
    post:
      operationId: rebaselineAuditIntegrity
      summary: Acknowledge a historical audit chain break by re-baselining (owner)
      description: |
        Moves the tenant's audit-integrity verification anchor to the CURRENT
        chain head, so `verifyAudit` treats everything up to and including
        that point as trusted and only walks entries written after it going
        forward. This exists because `audit_log` is append-only and hash-
        chained: a historical break caused by a race that pre-dates the
        per-tenant serialization in the append path can never be repaired in
        place, so without this endpoint an operator would see a permanent
        "chain break" badge with no way to acknowledge it.

        This endpoint NEVER alters or deletes any `audit_log` row — the
        flagged rows (and everything else) remain exactly as written, for
        forensic review; re-baselining only moves where verification starts.
        It is itself recorded as a normal hash-chained audit entry (action
        `audit.integrity.rebaselined`), so the acknowledgment lives in the
        tamper-evident trail too. Any tampering that happens AFTER the
        baseline is still caught by `verifyAudit`. Owner-only
        (`audit:manage`) — the same trust bar as tenant/SMTP management.
      tags: [audit]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditRebaselineRequest"
      responses:
        "200":
          description: >
            The re-baseline was applied; the returned verification result
            should report ok=true unless tampering occurred concurrently with
            this call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerify"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The tenant has no audit history to baseline yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
