  /api/v1/orgs/switch:
    post:
      operationId: switchOrg
      summary: Switch the session's active organisation by tenant id (body form)
      description: |
        Requires authentication but NOT an active tenant — this is how a user
        stranded without a valid active org (e.g. a former site-collaborator
        whose access was revoked) recovers. The membership gate runs under
        the caller's own row-level-security scope: a non-member of
        `tenant_id` gets 403, never a different signal that would confirm the
        tenant's existence.
      tags: [orgs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Active organisation switched
          content:
            application/json:
              schema:
                type: object
                required: [ok, tenant_id, tenant_name]
                properties:
                  ok:
                    type: boolean
                  tenant_id:
                    type: string
                    format: uuid
                  tenant_name:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member of the requested organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/orgs/{orgId}/activate:
    post:
      operationId: activateOrg
      summary: Switch the session's active organisation (must be a member)
      tags: [orgs]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Active organisation switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivateOrgResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a member of the requested organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Organisation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/orgs/{orgId}:
    patch:
      operationId: renameOrg
      summary: Rename an organisation
      description: Requires the caller to be an admin or owner of this org.
      tags: [orgs]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Organisation renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member, or insufficient role (admin/owner required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteOrg
      summary: Delete an organisation (owner-only)
      description: |
        Two-lane deletion (GH #152). An EMPTY org (zero sites, zero other
        members) is hard-deleted immediately (`lane=hard`). A populated org is
        soft-deleted (`lane=soft`): it becomes invisible everywhere instantly
        and is recoverable via `POST /orgs/{orgId}/restore` until the
        grace-window purge worker runs. `confirm_name` must exactly match the
        organisation's current name. When this is the caller's active org,
        their session is reassigned to another live membership, or cleared
        entirely (dropping to onboarding) if it was their last org, `active_tenant_id` in the response reflects the post-delete state.
        On a hosted instance an active paid subscription must be
        cancelled/downgraded first (`billing_active` 409).
      tags: [orgs]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_name]
              properties:
                confirm_name:
                  type: string
      responses:
        "200":
          description: Organisation deleted (hard or soft, see `lane`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteOrgResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member, or insufficient role (owner required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            org_already_deleted | billing_active | restore_in_progress, see the error `code` for which precondition failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: confirm_name does not match the organisation's name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/orgs/{orgId}/restore:
    post:
      operationId: restoreOrg
      summary: Undelete a soft-deleted organisation within the grace window (owner-only)
      tags: [orgs]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Organisation restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member, or insufficient role (owner required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: org_already_purged — the organisation was already permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            org_not_deleted | purge_in_progress — see the error `code` for
            which precondition failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
