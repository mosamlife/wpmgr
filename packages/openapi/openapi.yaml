        but failed agent push, returns `200` with the stored policy and an
        `X-Agent-Push-Warning` header.
      tags: [security]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSecurityPolicy"
