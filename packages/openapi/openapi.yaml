  /api/v1/tags:
    get:
      operationId: listTags
      summary: List the tenant's tag registry (GH #230 rich tags)
      description: |
        Lists every tag in the tenant's registry (m100), sorted
        case-insensitively by name, with a live `usage_count` (the number of
        sites currently carrying it — unused tags with usage_count 0 are
        legitimate). No pagination: a tenant's tag vocabulary is small.
      tags: [sites]
      responses:
        "200":
          description: The tenant's tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteTagList"
    post:
      operationId: createTag
      summary: Create a new tag in the registry
      tags: [sites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteTagCreate"
      responses:
        "201":
          description: The created tag (usage_count 0)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteTag"
        "409":
          description: A tag with this exact-case name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed (invalid_tag / invalid_color)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tags/{tagId}:
    patch:
      operationId: updateTag
      summary: Rename, recolor, or merge a tag
      description: |
        A color-only body just updates the color. A `name` change renames the
        tag and propagates the new name onto every site (and every unexpired,
        unredeemed pairing code) currently carrying the old name, in the same
        transaction. Renaming onto an existing name returns 409
        `tag_name_exists` unless `merge: true`, in which case the source tag
        is merged into the existing survivor (sites are rewritten to the
        survivor's name, deduplicated; the survivor's color is kept unless
        this request also sets `color`).
      tags: [sites]
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteTagUpdate"
      responses:
        "200":
          description: The updated (or merge-survivor) tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteTag"
        "404":
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A tag with this exact-case name already exists (and merge was not requested)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed (invalid_tag / invalid_color)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTag
      summary: Delete a tag fleet-wide
      description: |
        Removes the tag from the registry AND from every site (and every
        unexpired, unredeemed pairing code) currently carrying it, in one
        transaction.
      tags: [sites]
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Tag deleted
        "404":
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tags/bulk-apply:
    post:
      operationId: bulkApplyTags
      summary: Add and/or remove tags across many sites
      description: |
        Applies `add`/`remove` tag deltas to each site in `site_ids`. Each
        site id is checked against the caller's collaborator allowlist
        independently; sites the caller cannot access (or that don't exist in
        this tenant) are returned with `ok: false` rather than failing the
        whole call. `add` names are registered into the tag registry in the
        same transaction. Requires the `site.write` permission.
      tags: [sites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTagApplyRequest"
      responses:
        "200":
          description: Per-site apply results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultList"
        "422":
          description: Validation failed (e.g. neither add nor remove supplied)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/media/assets:
    get:
      operationId: listMediaAssets
      summary: List a site's media assets (Media Optimizer, ADR-043)
      description: |
        Cursor-paginated media library mirror with a summary rollup. Gated on
        site:read + per-site access. DTOs are hand-rolled (c.JSON), not ogen.
      tags: [media]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of media assets + summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAssetList" }
  /api/v1/sites/{siteId}/media/sync:
    post:
      operationId: syncMedia
      summary: Tell the agent to enumerate the media library
      tags: [media]
      parameters: [{ $ref: "#/components/parameters/SiteId" }]
      responses:
        "202":
          description: Sync dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  started_at: { type: string, format: date-time }
  /api/v1/sites/{siteId}/media/optimize:
    post:
      operationId: optimizeMedia
      summary: Start an optimize batch (fans out one job per attachment)
      tags: [media]
      parameters: [{ $ref: "#/components/parameters/SiteId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaOptimizeRequest" }
      responses:
        "202":
          description: Optimize batch queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaBatchResult" }
  /api/v1/sites/{siteId}/media/restore:
    post:
      operationId: restoreMedia
      summary: Restore selected attachments to their pre-optimization state
      tags: [media]
      parameters: [{ $ref: "#/components/parameters/SiteId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaAssetSelection" }
      responses:
        "202":
          description: Restore batch queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaBatchResult" }
  /api/v1/sites/{siteId}/media/delete-originals:
    post:
      operationId: deleteMediaOriginals
      summary: Irreversibly delete archived originals (admin+)
      description: Gated on the media:delete_originals permission (RoleAdmin minimum).
      tags: [media]
      parameters: [{ $ref: "#/components/parameters/SiteId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaAssetSelection" }
      responses:
        "202":
          description: Delete-originals batch queued (irreversible)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MediaBatchResult"
                  - type: object
                    properties: { irreversible: { type: boolean } }
  /api/v1/sites/{siteId}/media/cancel:
    post:
      operationId: cancelMedia
      summary: Cancel all in-flight media jobs for a site
      tags: [media]
      parameters: [{ $ref: "#/components/parameters/SiteId" }]
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cancelled_count: { type: integer }
  /api/v1/sites/{siteId}/media/jobs:
    get:
      operationId: listMediaJobs
      summary: List media optimization jobs for a site
      tags: [media]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of media jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaJobList" }
  /api/v1/sites/{siteId}/media/jobs/{jobId}:
    get:
      operationId: getMediaJob
      summary: Get a media job + its variant results
      tags: [media]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaJobDetail" }
  /api/v1/sites/{siteId}/media/settings:
    get:
      operationId: getMediaSettings
      summary: Get the auto-optimize settings for a site (ADR-044)
      tags: [media]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Current auto-optimize settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaSettings" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateMediaSettings
      summary: Update the auto-optimize settings for a site
      description: |
        On a successful store but failed agent push, returns `200` with the
        stored settings and an `X-Agent-Push-Warning` header.
      tags: [media]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaSettings" }
      responses:
        "200":
          description: Updated settings (see `X-Agent-Push-Warning` header for a non-fatal push failure)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaSettings" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/sites/events:
    get:
      operationId: streamSiteEvents
      summary: Connection-lifecycle SSE stream (tenant-scoped)
      description: |
        M21 / ADR-038 — a single tenant-scoped Server-Sent Events stream of
        connection-lifecycle events (site.created, site.state_changed,
        site.revoked, site.disconnected, site.archived, site.restored). The
        client filters by site_id in the browser. Supports `?since=<event_id>`
        (or the `Last-Event-ID` header) to replay missed events from the durable
        journal (~5 min retention) on reconnect; each frame carries an `id:`
        (ULID) line. 15s keepalive comments; session-auth, requires site:read.
      tags: [sites]
      parameters:
        - name: since
          in: query
          required: false
          description: Replay events strictly after this event_id (ULID cursor).
          schema:
            type: string
      responses:
        "200":
          description: An event stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/sites/{siteId}/enrollment-codes:
    post:
      operationId: beginReEnrollment
      summary: Begin re-enrollment (fresh enrollment code)
      description: |
        M21 / ADR-041 — moves an existing revoked/disconnected/archived site back
        to `pending_enrollment` (bumping connection_generation) and mints a fresh
        site-bound enrollment code under the SAME site_id (preserving backup/scan
        history). Returns the once-shown code. Requires operator+.
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "201":
          description: Re-enrollment code minted (plaintext shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteEnrollmentCode"
        "409":
          description: Site is in a state from which re-enrollment is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/revoke:
    post:
      operationId: revokeSite
      summary: Revoke a site's agent connection
      description: |
        M21 / ADR-041 — operator action. Transitions the site to `revoked` and
        queues a `revoke` instruction returned on the agent's next heartbeat,
        accompanied by a short-lived signed token (`revoke_token`) the agent
        verifies before it wipes its keys + self-deactivates (ADR-040 addendum).
        The agent_public_key is KEPT (not nulled) so the agent can still
        authenticate the heartbeat that delivers the revoke; a later re-enroll
        overwrites the key on the same row (partial unique index). Requires
        operator+ and org scope (a site-scoped collaborator cannot revoke).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteLifecycleReason"
      responses:
        "200":
          description: The updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "409":
          description: Illegal transition from the site's current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/archive:
    post:
      operationId: archiveSite
      summary: Archive a site (terminal soft-delete)
      description: |
        M21 / ADR-041 — operator action. Transitions the site to `archived`
        (terminal soft-delete); hidden from the default sites list. History is
        preserved. Requires operator+.
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteLifecycleReason"
      responses:
        "204":
          description: Site archived
        "409":
          description: Illegal transition from the site's current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/restore:
    post:
      operationId: restoreSite
      summary: Restore (un-archive) a site
      description: |
        M21 / ADR-041 — operator action. Un-archives a site back to
        `disconnected`. Only valid from `archived`. Requires operator+.
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: The updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "409":
          description: Site is not archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/cancel:
    post:
      operationId: cancelEnrollment
      summary: Cancel a pending enrollment (hard-delete)
      description: |
        Hard-deletes a site that is in `pending_enrollment` AND has **never
        connected** (`enrolled_at` is NULL and `agent_public_key` is absent).
        This is the "Cancel" action in the enrollment modal — it frees the URL
        so the operator can immediately re-add the same site.

        The never-connected guard is enforced server-side (NOT by the caller):
        `connection_state == pending_enrollment` AND `enrolled_at IS NULL` AND
        `agent_public_key == ""` must all hold. If the site has ever connected
        (enrolled at least once) the request is rejected with
        `code: "not_cancellable"` — use `archive` or `revoke` instead.

        On success a `site.deleted` SSE event is published to the tenant stream
        so open dashboards can remove the row without a poll.

        Requires `site:write` + org scope + site access (same chain as
        `archive`/`revoke`).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "204":
          description: Site hard-deleted; URL is now free.
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Site cannot be cancelled because it has connected at least once
            (`not_cancellable`). Use `archive` or `revoke` instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /enroll:
    post:
      operationId: enroll
      summary: Agent enrollment (public)
      description: |
        Called by an agent (NOT an authenticated control-plane user) to enroll a
        site using a pairing code. The tenant is derived entirely from the code.
        On success the site is created (or, if the URL already exists for the
        tenant, its agent key is rotated) and the control-plane PUBLIC signing
        key is returned so the agent can verify CP->agent commands. The code is
        consumed (single-use).
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
        "401":
          description: Invalid or expired pairing code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Pairing code already used, or agent key already bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Public, unauthenticated endpoints ---------------------------------------
  /rum/ingest:
    post:
      operationId: ingestRumBeacon
      summary: Ingest one Real User Monitoring (Core Web Vitals) beacon (public)
      description: |
        Mounted on the root engine — no session, no tenant gate. The
        `key` field (a per-site beacon key) is the sole access credential.
        Every failure mode (unknown key, RUM disabled, sampled out, rate
        limited, a storage write failure) responds `204 No Content` so a
        `navigator.sendBeacon()` call — which never reads the response — never
        surfaces a distinguishing status to the page. Only a malformed body
        yields `400`, and only an oversized body yields `413`.
      tags: [rum]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RumBeacon"
      responses:
        "204":
          description: Accepted, discarded, sampled out, or ingested (indistinguishable by design)
        "400":
          description: Malformed body or unrecognised metric
        "401":
          description: Missing or unparseable beacon key
        "413":
          description: Body exceeds the 8 KiB cap
        "429":
          description: Per-IP or per-site rate limit exceeded
    options:
      operationId: rumIngestPreflight
      summary: CORS preflight for the beacon endpoint
      tags: [rum]
      responses:
        "204":
          description: No content
  /webhooks/email/{provider}/{routeToken}:
    post:
      operationId: handleEmailProviderWebhook
      summary: Inbound bounce/complaint/delivery webhook from an email provider (public)
      description: |
        Mounted on the root engine — no session, no tenant gate. `routeToken`
        is a per-config-row opaque random value; its SHA-256 hash resolves
        the owning tenant + site, and the corresponding per-row signing key
        (not an instance-wide key) verifies the provider's signature.
        `provider` is one of `ses`, `sendgrid`, `mailgun`, `postmark`. An
        unknown `routeToken` or `provider` responds `404` with no body (no
        existence leak). The request body shape is entirely provider-defined
        (SNS notification envelope, SendGrid event array, Mailgun form POST,
        or Postmark JSON) so it is not modeled as a fixed schema here.
      tags: [email]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [ses, sendgrid, mailgun, postmark]
        - name: routeToken
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Provider-defined envelope (SNS notification, SendGrid event
                array, or Postmark JSON). Mailgun's form-urlencoded POST is
                accepted on the wire too but is not separately modeled here
                (single-content-type schema keeps codegen well-formed).
      responses:
        "200":
          description: Event processed
        "401":
          description: Provider signature verification failed
        "404":
          description: Unknown routeToken or provider
        "500":
          description: Internal processing error
  /webhooks/billing/{provider}:
    post:
      operationId: handleBillingProviderWebhook
      summary: Inbound payment-provider webhook (public)
      description: |
        Mounted on the root engine — no session, no tenant gate. The
        provider's own request signature (verified inside
        `Service.ProcessWebhook`) is the entire authentication boundary. An
        unrecognised `provider` value 404s.
      tags: [billing]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [stripe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Event processed
        "401":
          description: Signature verification failed
        "404":
          description: Unknown provider
  /api/v1/pricing:
    get:
      operationId: getPublicPricing
      summary: Live hosted pricing (public, hosted-only)
      description: |
        Mounted directly on the root engine (no session, no tenant gate)
        despite sharing the `/api/v1` path prefix — the marketing site's
        price source. Registered only when hosted billing is enabled;
        self-host installs 404 here. Response is `Cache-Control:
        public, max-age=3600` and resolves from a warm cache when possible,
        falling back to a static in-Go price table when no payment provider
        is configured.
      tags: [billing]
      responses:
        "200":
          description: Current pricing table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPricing"
        "404":
          description: Hosted billing is not enabled on this instance

  /api/v1/sites/{siteId}/autologin:
    post:
      operationId: createAutologin
      summary: Mint a one-click login URL into a managed WordPress site
      description: |
        Mints a single-use, ~60-second nonce + Ed25519 JWT (ADR-031) and
        returns a redirect URL of the form
        `{site.url}/wp-json/wpmgr/v1/autologin?token=<jwt>&redirect_to=<urlencoded>`
        the operator's browser should follow. The WordPress agent verifies the
        JWT and POSTs back to `/agent/v1/autologin/consume` to atomically
        consume the nonce, then establishes a wp-admin session as the requested
        user (or the first administrator when `target_wp_user_login` is empty).

        Authorization: requires the `site:autologin` permission (owner+admin).
        Operator and viewer roles are explicitly denied.

        Rate-limited per `(initiator_user_id, site_id)` (10/min) and per
        `site_id` (30/min). A 429 response carries `retry_after_seconds` in the
        body and a `Retry-After` header in seconds.

        2FA step-up (HTTP 409 `2fa_required`) is feature-flagged off in V0;
        the 409 path is unreachable until both `WPMGR_AUTOLOGIN_REQUIRE_2FA_STEP_UP`
        and the per-site `require_2fa_step_up` policy are true AND a future
        2FA enrollment system is in place.

        The minted JWT is NEVER returned in the response body apart from
        being embedded in `redirect_url`; it is NEVER recorded in the audit
        trail — the audit row stores only the nonce id and outcome.
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutologinCreate"
      responses:
        "200":
          description: Autologin minted; follow `redirect_url` to land in wp-admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutologinResponse"
        "403":
          description: |
            RBAC denied (`rbac_denied`) or autologin disabled by policy
            (`policy_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Site not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            A two-factor step-up is required (`2fa_required`). Unreachable
            today; feature-flagged off until the 2FA system ships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            Rate-limited per `(initiator_user_id, site_id)` or per `site_id`.
            Carries `retry_after_seconds` and a `Retry-After` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutologinRateLimited"
  /api/v1/sites/{siteId}/autologin-policy:
    get:
      operationId: getSiteAutologinPolicy
      summary: Get the one-click login policy for a site
      description: |
        Returns the per-site autologin policy (GH #286), auto-creating the
        default row on first read when none exists yet (mirrors the mint
        endpoint's own auto-create behaviour, so GET and mint never disagree
        about what "no policy yet" means).

        `allowed_wp_roles` is READ-ONLY and informational; it is reported
        here but is never accepted on the PUT body. The role ceiling can only
        be widened by a manual database operation.

        Authorization: requires the `site:autologin` permission (owner+admin,
        the same floor as minting a login URL). Operator and viewer roles are
        denied.
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Current autologin policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAutologinPolicy"
        "403":
          description: RBAC denied (`insufficient_permission`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            Site not found, or `siteId` does not belong to the caller's
            tenant (`site_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putSiteAutologinPolicy
      summary: Save the one-click login policy for a site
      description: |
        Stores `{enabled, default_wp_user_login}` for the site (GH #286).
        `default_wp_user_login` is the WordPress login the mint endpoint
        injects when an operator's mint request omits `target_wp_user_login`;
        an explicit choice on mint always overrides it. An empty string
        clears the default, reverting to the agent's built-in "first
        administrator" fallback.

        `allowed_wp_roles` is NOT accepted on this body; it is read-only via
        the API. Unknown fields (including an attempt to send
        `allowed_wp_roles`) are rejected with 422 rather than silently
        ignored.

        **Validation**:
          - `default_wp_user_login` must be at most 60 characters (WordPress's
            `users.user_login` column is `varchar(60)`).
          - `default_wp_user_login` may contain only letters, numbers, and
            the characters `_ . - @` (WordPress usernames may be an email
            address).

        Authorization: requires the `site:autologin` permission (owner+admin).
        Operator and viewer roles are explicitly denied.
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteAutologinPolicyUpdate"
      responses:
        "200":
          description: Stored autologin policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAutologinPolicy"
        "403":
          description: RBAC denied (`insufficient_permission`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            Site not found, or `siteId` does not belong to the caller's
            tenant (`site_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Validation failed (`default_wp_user_login_too_long`,
            `default_wp_user_login_invalid`, or an unknown field such as
            `allowed_wp_roles`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/app-health-settings:
    get:
      operationId: getSiteAppHealthSettings
      summary: Get a site's application-health settings
      description: |
        Returns the per-site application-health settings (GH #291 Phase 3):
        the B3 override path for the application-health probe, and the
        per-site app-health alerting opt-out. Every site has these settings
        (empty path / alerts not disabled are the defaults) - this never
        auto-creates a row, it reads the `sites` columns directly.
      tags: [uptime]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Current app-health settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppHealthSettings"
        "404":
          description: |
            Site not found, or `siteId` does not belong to the caller's
            tenant (`site_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putSiteAppHealthSettings
      summary: Save a site's application-health settings
      description: |
        Stores `{app_probe_path, app_alerts_disabled}` for the site (GH #291
        Phase 3). `app_probe_path` must be a site-relative path (starts with
        `/`, no scheme, no host, no `..` traversal) - validation failures
        return 422. An empty `app_probe_path` clears the override back to
        auto-detect. `app_alerts_disabled` excludes the site from app-health
        alerting entirely (both the individual alert and the fleet circuit
        breaker's eligible-site count) while the probe keeps running.
      tags: [uptime]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppHealthSettingsUpdate"
      responses:
        "200":
          description: Saved app-health settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppHealthSettings"
        "404":
          description: |
            Site not found, or `siteId` does not belong to the caller's
            tenant (`site_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Validation failed (`app_probe_path_invalid`,
            `app_probe_path_too_long`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent/v1/autologin/consume:
    post:
      operationId: agentAutologinConsume
      summary: Consume a one-click login nonce (agent-authenticated)
      description: |
        Called by the WordPress agent after it has verified the operator's
        JWT, to atomically consume the nonce and learn the WP login + the
        allowed WP roles. The control plane consults Redis (GETDEL) first as
        the sub-millisecond hot path and falls back to a single
        `UPDATE autologin_tokens ... RETURNING` in Postgres. Exactly one
        agent wins the race per nonce.

        The agent is authenticated by the M2 Ed25519 signed-request scheme
        (see AgentSignature); the verified site identity is compared to the
        body's `site_id` — a mismatch returns 403 `site_mismatch`. A nonce
        that never existed, was already consumed, or has expired returns 410
        `nonce_unavailable` (the three cases are intentionally indistinguishable
        so the table cannot be probed).
      tags: [agent]
      security:
        - AgentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutologinConsumeRequest"
      responses:
        "200":
          description: Nonce consumed; agent may now establish the wp-admin session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutologinConsumeResponse"
        "401":
          description: Agent authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The body's `site_id` does not match the agent's verified identity
            (`site_mismatch`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: |
            Nonce is unknown, already consumed, or expired (`nonce_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent/v1/metadata:
    post:
      operationId: agentMetadata
      summary: Push site metadata (agent-authenticated)
      description: |
        Authenticated via the Ed25519 signed-request scheme (see the AgentSignature
        security scheme). The site + tenant are resolved from the verified agent
        identity, never from a header. Updates last_seen_at and marks the site
        healthy.
      tags: [agent]
      security:
        - AgentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentMetadata"
      responses:
        "200":
          description: Metadata stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          description: Agent authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent/v1/heartbeat:
    post:
      operationId: agentHeartbeat
      summary: Liveness heartbeat (agent-authenticated)
      description: |
        The 60s agent heartbeat (ADR-039). Authenticated via the Ed25519
        signed-request scheme; refreshes last_seen_at for the resolved site,
        recovers a degraded/disconnected site to `connected`, and returns any
        pending agent instructions (e.g. `["revoke"]` for a revoked site). The
        body may carry light metadata (status, versions, pending-update count);
        it is accepted best-effort. Pre-M21 control planes return 204 with no
        body.
      tags: [agent]
      security:
        - AgentSignature: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentHeartbeat"
      responses:
        "200":
          description: Heartbeat recorded; optional pending instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHeartbeatResult"
        "204":
          description: Heartbeat recorded (legacy liveness-only path)
        "401":
          description: Agent authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent/v1/disconnect:
    post:
      operationId: agentDisconnect
      summary: Signed last-will disconnect (agent-authenticated)
      description: |
        M21 / ADR-040 — the agent's signed last-will. Fired by the WordPress
        deactivation/uninstall hooks (best-effort, 3s timeout). Authenticated via
        the SAME Ed25519 signed-request scheme as every agent route: the
        signature is verified and bound to the calling site BEFORE any write, so
        possession of a site_id alone cannot disconnect a site. Transitions the
        site connected/degraded → `disconnected` with the supplied reason. Does
        NOT archive (archive stays an explicit operator action).
      tags: [agent]
      security:
        - AgentSignature: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDisconnect"
      responses:
        "200":
          description: Disconnect recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          description: Agent authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
