openapi: 3.1.0
info:
  title: WPMgr API
  version: 0.0.0
  description: |
    Control-plane REST API for WPMgr. This is the single source of truth for
    both the Go server types and the generated TypeScript client. Real paths
    and schemas are filled in during Phase 4 (skeleton) and Phase 5 (features).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.txt
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [system]
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: Returns 200 when the service can serve traffic (DB reachable).
      tags: [system]
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /auth/register:
    post:
      operationId: register
      summary: Register (first-run bootstrap or invited)
      description: |
        On first run (zero users) this creates the first user, a tenant, and an
        owner membership. Once any user exists, open registration is closed and
        this returns 403; new users are added via the authenticated invite flow.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered and session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "403":
          description: Open registration is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      summary: Email + password login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Destroy the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: Current user, memberships, and active tenant
      tags: [auth]
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/oidc/login:
    get:
      operationId: oidcLogin
      summary: Begin OIDC login (redirect to provider)
      description: Redirects (302) to the OIDC provider. Returns 501 if OIDC is disabled.
      tags: [auth]
      responses:
        "302":
          description: Redirect to the OIDC provider
        "501":
          description: OIDC is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC redirect callback
      tags: [auth]
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Authenticated via OIDC; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: OIDC verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: OIDC is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/members:
    get:
      operationId: listMembers
      summary: List members of the active tenant
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: inviteMember
      summary: Invite/create a member in the active tenant (admin+)
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys for the active tenant (admin+)
      tags: [api-keys]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of API keys (no secrets)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createApiKey
      summary: Create an API key (admin+); the secret is shown once
      tags: [api-keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
      responses:
        "201":
          description: API key created; token returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/api-keys/{apiKeyId}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key (admin+)
      tags: [api-keys]
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "204":
          description: API key revoked
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: API key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/destinations:
    get:
      operationId: listSiteDestinations
      summary: List configured backup destinations for a site
      description: |
        ADR-036 P1 storage adapter. Returns every destination configured on the
        site (`cp` / `local` / `s3_compat`). The encrypted S3 secret is NEVER
        returned; `has_secret` reports whether one is stored.
      tags: [destinations]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: A list of destinations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDestinationList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createSiteDestination
      summary: Add a backup destination to a site
      tags: [destinations]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteDestinationCreate"
      responses:
        "201":
          description: Destination created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDestination"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/destinations/test:
    post:
      operationId: testSiteDestination
      summary: Verify credentials for a destination without persisting them
      description: |
        Returns 200 with `{ok, message}` regardless of success/failure so the
        UI can render the operator-readable diagnostic inline. S3-compat
        kinds run a HeadBucket + PutObject + DeleteObject probe against the
        target bucket; cp/local kinds return ok=true trivially.
      tags: [destinations]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteDestinationTest"
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDestinationTestResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/destinations/{destinationId}:
    get:
      operationId: getSiteDestination
      summary: Read one configured destination
      tags: [destinations]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/DestinationId"
      responses:
        "200":
          description: The destination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDestination"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Destination not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateSiteDestination
      summary: Update a configured destination (omit secret_key to keep it)
      tags: [destinations]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/DestinationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteDestinationUpdate"
      responses:
        "200":
          description: The updated destination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDestination"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Destination not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSiteDestination
      summary: Remove a configured destination
      tags: [destinations]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/DestinationId"
      responses:
        "204":
          description: Destination deleted.
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Destination not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: List the active tenant's audit log (admin+)
      tags: [audit]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/audit/verify:
    get:
      operationId: verifyAudit
      summary: Verify the integrity of the audit hash-chain (admin+)
      tags: [audit]
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerify"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tenants:
    post:
      operationId: createTenant
      summary: Create a tenant
      tags: [tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreate"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "409":
          description: Tenant slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listTenants
      summary: List tenants
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantList"
  /api/v1/tenants/{tenantId}:
    get:
      operationId: getTenant
      summary: Get a tenant by ID
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites:
    post:
      operationId: createSite
      summary: Create a site
      description: Creates a site belonging to the tenant in the request context.
      tags: [sites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreate"
      responses:
        "201":
          description: Site created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "409":
          description: Site URL already exists for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listSites
      summary: List sites for the current tenant
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: tag
          in: query
          required: false
          description: Filter to sites carrying this tag.
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: A page of sites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
  /api/v1/sites/pairing-codes:
    post:
      operationId: createPairingCode
      summary: Generate a one-time agent pairing code
      description: |
        Generates a short-lived, single-use, high-entropy pairing code for the
        current tenant. The plaintext code is returned ONCE in this response and
        is never retrievable again. An agent presents it to POST /enroll. Requires
        operator+.
      tags: [sites]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingCodeCreate"
      responses:
        "201":
          description: Pairing code created (plaintext shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/tags:
    put:
      operationId: setSiteTags
      summary: Replace the tag set on a site
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteTags"
      responses:
        "200":
          description: The updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /enroll:
    post:
      operationId: enroll
      summary: Agent enrollment (public)
      description: |
        Called by an agent (NOT an authenticated control-plane user) to enroll a
        site using a pairing code. The tenant is derived entirely from the code.
        On success the site is created (or, if the URL already exists for the
        tenant, its agent key is rotated) and the control-plane PUBLIC signing
        key is returned so the agent can verify CP->agent commands. The code is
        consumed (single-use).
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
        "401":
          description: Invalid or expired pairing code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Pairing code already used, or agent key already bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/autologin:
    post:
      operationId: createAutologin
      summary: Mint a one-click login URL into a managed WordPress site
      description: |
        Mints a single-use, ~60-second nonce + Ed25519 JWT (ADR-031) and
        returns a redirect URL of the form
        `{site.url}/wp-json/wpmgr/v1/autologin?token=<jwt>&redirect_to=<urlencoded>`
        the operator's browser should follow. The WordPress agent verifies the
        JWT and POSTs back to `/agent/v1/autologin/consume` to atomically
        consume the nonce, then establishes a wp-admin session as the requested
        user (or the first administrator when `target_wp_user_login` is empty).

        Authorization: requires the `site:autologin` permission (owner+admin).
        Operator and viewer roles are explicitly denied.

        Rate-limited per `(initiator_user_id, site_id)` (10/min) and per
        `site_id` (30/min). A 429 response carries `retry_after_seconds` in the
        body and a `Retry-After` header in seconds.

        2FA step-up (HTTP 409 `2fa_required`) is feature-flagged off in V0;
        the 409 path is unreachable until both `WPMGR_AUTOLOGIN_REQUIRE_2FA_STEP_UP`
        and the per-site `require_2fa_step_up` policy are true AND a future
        2FA enrollment system is in place.

        The minted JWT is NEVER returned in the response body apart from
        being embedded in `redirect_url`; it is NEVER recorded in the audit
        trail — the audit row stores only the nonce id and outcome.
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutologinCreate"
      responses:
        "200":
          description: Autologin minted; follow `redirect_url` to land in wp-admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutologinResponse"
        "403":
          description: |
            RBAC denied (`rbac_denied`) or autologin disabled by policy
            (`policy_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Site not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            A two-factor step-up is required (`2fa_required`). Unreachable
            today; feature-flagged off until the 2FA system ships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            Rate-limited per `(initiator_user_id, site_id)` or per `site_id`.
            Carries `retry_after_seconds` and a `Retry-After` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutologinRateLimited"
  /agent/v1/autologin/consume:
    post:
      operationId: agentAutologinConsume
      summary: Consume a one-click login nonce (agent-authenticated)
      description: |
        Called by the WordPress agent after it has verified the operator's
        JWT, to atomically consume the nonce and learn the WP login + the
        allowed WP roles. The control plane consults Redis (GETDEL) first as
        the sub-millisecond hot path and falls back to a single
        `UPDATE autologin_tokens ... RETURNING` in Postgres. Exactly one
        agent wins the race per nonce.

        The agent is authenticated by the M2 Ed25519 signed-request scheme
        (see AgentSignature); the verified site identity is compared to the
        body's `site_id` — a mismatch returns 403 `site_mismatch`. A nonce
        that never existed, was already consumed, or has expired returns 410
        `nonce_unavailable` (the three cases are intentionally indistinguishable
        so the table cannot be probed).
      tags: [agent]
      security:
        - AgentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutologinConsumeRequest"
      responses:
        "200":
          description: Nonce consumed; agent may now establish the wp-admin session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutologinConsumeResponse"
        "401":
          description: Agent authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The body's `site_id` does not match the agent's verified identity
            (`site_mismatch`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: |
            Nonce is unknown, already consumed, or expired (`nonce_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent/v1/metadata:
    post:
      operationId: agentMetadata
      summary: Push site metadata (agent-authenticated)
      description: |
        Authenticated via the Ed25519 signed-request scheme (see the AgentSignature
        security scheme). The site + tenant are resolved from the verified agent
        identity, never from a header. Updates last_seen_at and marks the site
        healthy.
      tags: [agent]
      security:
        - AgentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentMetadata"
      responses:
        "200":
          description: Metadata stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          description: Agent authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent/v1/heartbeat:
    post:
      operationId: agentHeartbeat
      summary: Liveness heartbeat (agent-authenticated)
      description: |
        Lightweight liveness ping. Authenticated via the Ed25519 signed-request
        scheme; updates last_seen_at for the resolved site.
      tags: [agent]
      security:
        - AgentSignature: []
      responses:
        "204":
          description: Heartbeat recorded
        "401":
          description: Agent authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}:
    get:
      operationId: getSite
      summary: Get a site by ID
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: The site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSite
      summary: Delete a site
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "204":
          description: Site deleted
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/updates:
    post:
      operationId: createUpdateRun
      summary: Start a bulk update run
      description: |
        Creates an update run targeting a selection of sites (by site_ids OR by
        tag) and a set of items (plugins/themes/core, each with a desired version
        or "latest"). One task is created per (site, item) and a background job is
        enqueued per task (respecting a per-tenant parallelism limit). When
        dry_run is true the agent is asked what WOULD change and the site is not
        mutated. Requires operator+.
      tags: [updates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRunCreate"
      responses:
        "201":
          description: Update run created (tasks enqueued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRun"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listUpdateRuns
      summary: List update runs for the current tenant
      tags: [updates]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of update runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRunList"
  /api/v1/updates/{runId}:
    get:
      operationId: getUpdateRun
      summary: Get an update run with its tasks
      tags: [updates]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The update run and its per-(site,item) tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRun"
        "404":
          description: Update run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/updates/{runId}/events:
    get:
      operationId: streamUpdateRunEvents
      summary: Stream live update-task status changes (SSE)
      description: |
        Server-Sent Events stream (text/event-stream) of task status transitions
        for a run, for live progress. Each `data:` line is a JSON UpdateEvent.
        The stream emits periodic heartbeat comment lines (":\n") and ends when
        the run reaches a terminal state or the client disconnects. Requires
        viewer+.
      tags: [updates]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: |
            An event stream. Media type text/event-stream; each event payload is
            an UpdateEvent JSON object. Documented here as the UpdateEvent schema
            for clients/codegen even though the transport is SSE, not JSON.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/UpdateEvent"
        "404":
          description: Update run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/backups:
    post:
      operationId: createBackup
      summary: Start a backup of a site
      description: |
        Records a pending backup snapshot for the site and enqueues a background
        job that dispatches a signed `backup` command to the site's agent. The
        agent chunks, encrypts (client-side, age, to the site's PUBLIC recipient)
        and uploads ciphertext directly to object storage via presigned URLs,
        then submits the manifest. Incremental: a chunk whose content hash is
        already stored is not re-uploaded. Requires operator+.
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupCreate"
      responses:
        "201":
          description: Backup snapshot created (job enqueued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSnapshot"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listBackups
      summary: List a site's backup snapshots
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of backup snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSnapshotList"
  /api/v1/backups/{snapshotId}:
    get:
      operationId: getBackup
      summary: Get a backup snapshot with its manifest summary
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/SnapshotId"
      responses:
        "200":
          description: The backup snapshot and its manifest entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSnapshotDetail"
        "404":
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/backups/{snapshotId}/events:
    get:
      operationId: streamBackupSnapshotEvents
      summary: Stream live backup snapshot progress (SSE)
      description: |
        Server-Sent Events stream (text/event-stream) of progress transitions for
        a backup snapshot, for live UI updates. Each `data:` line is a JSON
        BackupEvent. The stream emits periodic heartbeat comment lines (":\n")
        and ends when the snapshot reaches a terminal state (completed/failed)
        or the client disconnects. Requires viewer+.
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/SnapshotId"
      responses:
        "200":
          description: |
            An event stream. Media type text/event-stream; each event payload is
            a BackupEvent JSON object. Documented here as the BackupEvent schema
            for clients/codegen even though the transport is SSE, not JSON.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/BackupEvent"
        "404":
          description: Backup snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/backups/{snapshotId}/sql-inspection:
    get:
      operationId: getBackupSqlInspection
      summary: Inspect the SQL dump contained in a backup snapshot
      description: |
        Returns a structured report on the SQL dump artifact of a backup
        snapshot: table inventory, row/byte estimates, charset, table prefix,
        and (when the dump looks like a WordPress install) the canonical
        siteurl/home/db_version probed from wp_options. Resolution order:
        1. If the snapshot manifest carries an agent-generated inspection
           artifact, that JSON is returned (source="agent"). This is the cheap,
           always-correct path because the agent has the SQL plaintext locally.
        2. Otherwise the control plane streams the dump artifact, parses it
           with the legacy scanner, and caches the result for subsequent calls
           (source="cp-legacy"). The first request returns 202 Accepted while
           the inspection job runs; the client polls until it gets 200.
        Requires viewer+.
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/SnapshotId"
      responses:
        "200":
          description: The parsed SQL inspection report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SqlInspection"
        "202":
          description: |
            The legacy inspection job has been enqueued; the client should poll
            the same URL until the report is ready. The Location header echoes
            the polling URL for clients that follow it transparently.
          headers:
            Location:
              description: URL to poll for the ready report.
              schema:
                type: string
        "404":
          description: Snapshot not found, or has no DB artifact to inspect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/backups/{snapshotId}/restore:
    post:
      operationId: createRestore
      summary: Restore from a backup snapshot (full or partial)
      description: |
        Enqueues a restore job. The control plane resolves the (possibly partial)
        selection into ordered chunks, issues presigned GET URLs, and dispatches
        a signed `restore` command. The agent downloads ciphertext, verifies the
        BLAKE3 of each chunk, decrypts with the age identity it alone holds, and
        reassembles. Supports full, by-path, and by-db-table partial restore.
        Requires operator+.
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/SnapshotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreCreate"
      responses:
        "202":
          description: Restore job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSnapshot"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/backup-schedule:
    get:
      operationId: getBackupSchedule
      summary: Get a site's backup schedule
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: The site's backup schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSchedule"
        "404":
          description: No schedule configured for the site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putBackupSchedule
      summary: Create or update a site's backup schedule
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupScheduleUpdate"
      responses:
        "200":
          description: The saved backup schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSchedule"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/updates/refresh:
    post:
      operationId: refreshSiteUpdates
      summary: Trigger an immediate inventory + available-updates refresh
      description: |
        Enqueues a CP->agent refresh-inventory command for the site. The agent
        re-reads its plugin/theme inventory and `update_*` transients and pushes
        them back over /agent/v1/metadata. Returns 202 immediately. Requires
        viewer+. Returns 409 when the site is offline or unreachable, or 404 if
        the site is not enrolled in this tenant.
      tags: [updates]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "202":
          description: Refresh queued
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Site offline or refresh already in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/updates/available:
    get:
      operationId: getSiteAvailableUpdates
      summary: Get the cached per-item available-updates list for a site
      description: |
        Returns the cached list of plugins/themes (and core) that have an update
        available, derived from the agent's last metadata sync. Items are sorted
        core -> plugins -> themes, with active before inactive. `as_of` is the
        site's last update timestamp. Requires viewer+.
      tags: [updates]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Available updates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAvailableUpdates"
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/uptime:
    get:
      operationId: getSiteUptime
      summary: Get a site's uptime status over a window
      description: |
        Returns the uptime % and average latency for a site over the requested
        window (7d/30d/90d), the current up/down state, the last check time, the
        TLS certificate expiry, and a downsampled recent check series. Metrics
        come from the ClickHouse uptime store, scoped by tenant_id + site_id; the
        site's tenant ownership is verified in Postgres first (a foreign site is
        a 404). Requires viewer+.
      tags: [uptime]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: ["7d", "30d", "90d"]
            default: "7d"
      responses:
        "200":
          description: The site's uptime status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UptimeStatus"
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/uptime/summary:
    get:
      operationId: getUptimeSummary
      summary: Current up/down status per site for the dashboard
      description: |
        Returns the current up/down status and last check for every site in the
        tenant (from the latest recorded probe). Requires viewer+.
      tags: [uptime]
      responses:
        "200":
          description: Per-site current uptime status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UptimeSummary"
  /api/v1/alert-config:
    get:
      operationId: getAlertConfig
      summary: Get the tenant's uptime alert configuration
      description: |
        Returns the tenant's downtime/recovery alert channel: email recipients,
        whether a webhook is configured, and the enabled flag. The webhook secret
        is never returned. Requires admin+.
      tags: [uptime]
      responses:
        "200":
          description: The tenant's alert configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfig"
    put:
      operationId: putAlertConfig
      summary: Create or update the tenant's uptime alert configuration
      description: |
        Sets the email recipients, webhook URL + signing secret, and enabled flag
        for downtime/recovery alerts. The webhook secret is write-only. Requires
        admin+.
      tags: [uptime]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertConfigUpdate"
      responses:
        "200":
          description: The saved alert configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfig"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # ── ADR-037 Sprint 2 — Site Health (diagnostics) + PHP error monitor ────────
  /api/v1/sites/{siteId}/diagnostics:
    get:
      operationId: getSiteDiagnostics
      summary: Latest site diagnostics by category
      description: |
        Returns one card per category (14 total) carrying the latest payload
        the agent shipped + the collection/freshness timestamps. Categories the
        agent has never reported for are returned with a null payload so the UI
        can render an "awaiting first sync" placeholder.
      tags: [diagnostics]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Site diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDiagnosticsList"
        "404":
          description: Site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/diagnostics/refresh:
    post:
      operationId: refreshSiteDiagnostics
      summary: Enqueue an on-demand diagnostics command to the agent
      description: |
        Enqueues a signed `diagnostics` command to the agent. The agent runs
        the 14-category collector immediately and pushes the result back to
        POST /agent/v1/diagnostics. Returns 202 on accept. Returns 503 with
        code `diagnostics_refresh_unwired` when the CP->agent commander has
        not yet been wired (V1).
      tags: [diagnostics]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "202":
          description: Refresh enqueued
        "503":
          description: Refresh is not yet wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sites/{siteId}/errors:
    get:
      operationId: listSitePHPErrors
      summary: List fingerprint-grouped PHP errors for a site
      description: |
        Returns the agent-captured PHP errors for the site, grouped by md5
        fingerprint. Each row carries the occurrence count, first/last seen
        timestamps, and the silenced flag.
      tags: [diagnostics]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only rows whose last_seen_at is after this timestamp.
        - name: silenced
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter by silenced state. Omit for both.
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: PHP error list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PHPErrorList"
  /api/v1/sites/{siteId}/errors/{md5}/silence:
    post:
      operationId: silenceSitePHPError
      summary: Silence (or unsilence) a fingerprint-grouped PHP error
      description: |
        Toggles the silenced flag on a (site, md5) error row. The agent
        continues to count silently on its side; the CP UI hides silenced
        rows by default.
      tags: [diagnostics]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: md5
          in: path
          required: true
          schema:
            type: string
          description: The md5 fingerprint.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PHPErrorSilence"
      responses:
        "204":
          description: Silence flag updated
        "404":
          description: Error not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # ── ADR-037 Sprint 3 — WordPress activity log (tamper-evident) ──────────────
  /api/v1/sites/{siteId}/activity:
    get:
      operationId: listSiteActivity
      summary: List WordPress activity-log events for a site
      description: |
        Returns the agent-captured WordPress activity events for the site,
        newest first. Each event carries the hash-chain fields (prev_hash,
        this_hash) and a server-verified chain_valid flag: the CP recomputes
        every event's hash at ingest and flags any tamper (a mutated, inserted,
        or deleted historical row) as chain_valid=false. Filter by event_type,
        object_type, actor_login, severity, and an occurred-at time range.
      tags: [activity]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: event_type
          in: query
          required: false
          schema: { type: string }
          description: Exact-match filter on the event type.
        - name: object_type
          in: query
          required: false
          schema: { type: string }
          description: Exact-match filter on the object type.
        - name: actor_login
          in: query
          required: false
          schema: { type: string }
          description: Exact-match filter on the actor login.
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [high, medium, low]
          description: Filter by severity.
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Only events whose occurred_at is at/after this timestamp.
        - name: until
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Only events whose occurred_at is at/before this timestamp.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Activity event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteActivityList"
  /api/v1/sites/{siteId}/activity/verify:
    get:
      operationId: verifySiteActivity
      summary: Re-verify the activity-log hash chain for a site
      description: |
        Recomputes the entire hash chain for the site server-side from genesis
        and reports whether it is intact. When a break is found, break_at_seq
        carries the seq of the first event whose recomputed hash (or prev_hash
        linkage) does not match — the tamper point. This is the integrity badge
        feeding the activity view.
      tags: [activity]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Chain verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityVerifyResult"
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DestinationId:
      name: destinationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    AgentSignature:
      type: apiKey
      in: header
      name: X-WPMgr-Signature
      description: |
        Ed25519 signed-request authentication for agent->control-plane calls. The
        agent sends four headers: X-WPMgr-Agent-Key (its base64 Ed25519 public
        key, identifying the enrolled site), X-WPMgr-Timestamp (Unix seconds),
        X-WPMgr-Nonce (a unique per-request token), and X-WPMgr-Signature (the
        base64 Ed25519 signature over the canonical message
        "METHOD\nPATH\nTIMESTAMP\nNONCE\nhex(sha256(body))"). The control plane
        rejects stale timestamps and replayed nonces. (apiKey type is the closest
        OpenAPI 3.1 primitive for this header-carried signature scheme.)
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
