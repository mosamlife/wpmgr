  /agent/v1/rucss:
    post:
      operationId: agentIngestRucss
      summary: Submit a page render for Remove Unused CSS computation (agent-authenticated)
      description: |
        `multipart/form-data` with parts `meta` (JSON: `site_id`, `url`,
        `structure_hash` required, `safelist` optional), `html` (required,
        max 10 MiB), and one-or-more `css` parts (optional, max 5 MiB total).
        Hard overall request ceiling 16 MiB. On a cache HIT the response body
        IS the used-CSS content (not a key), `Content-Encoding: gzip`, with
        `X-Rucss-Reduction-Pct` and `X-Rucss-Used-Bytes` headers. On a cache
        MISS or degraded/unavailable state, `202` with `{"status":"processing",
        "job_id":...}` or `{"status":"unavailable"}` — the agent serves full
        CSS this render and never blocks.
      tags: [agent, performance]
      security:
        - AgentSignature: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meta, html]
              properties:
                meta:
                  type: string
                  format: byte
                  description: JSON part — see description for the expected shape.
                html:
                  type: string
                  format: binary
                css:
                  type: string
                  format: binary
      responses:
        "200":
          description: Cache hit — used-CSS content (gzip-encoded)
          content:
            text/css:
              schema:
                type: string
                format: binary
        "202":
          description: Cache miss, or RUCSS degraded/unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [processing, unavailable]
                  job_id:
                    type: string
        "401":
          description: Agent authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: site_mismatch — meta.site_id does not match the authenticated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: A part (or the whole request) exceeded its size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Missing/invalid meta (no structure_hash) or missing html part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent/v1/db-clean/progress:
