  # ── M14 Login Whitelabel ────────────────────────────────────────────────────
  /api/v1/sites/{siteId}/login-brand:
    get:
      operationId: getSiteLoginBrand
      summary: Get the login brand config for a site
      description: |
        Returns the current login brand config (logo URL, logo link, message)
        for the site. When no config has been saved yet, returns the all-empty
        default (all string fields are `""`), which the agent interprets as
        "no override" (WordPress built-in login logo / no custom message).
      tags: [loginbrand]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Current login brand config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteLoginBrand"
    put:
      operationId: putSiteLoginBrand
      summary: Save (and push to agent) the login brand config
      description: |
        Stores the new login brand config and pushes it to the agent via the
        signed `sync_login_brand` command. If the agent push fails after a
        successful store, HTTP 200 is still returned with the stored config;
        the push error is surfaced in the `X-Agent-Push-Warning` response
        header so callers can surface it as a non-blocking warning.

        **Validation**:
          - `logo_url` and `logo_link` must be empty (`""`) or a valid
            `http`/`https` URL (other schemes are rejected with 422).
          - `message` must be at most 2000 characters.
          - All fields are optional; omitted or `""` fields mean "no override".
      tags: [loginbrand]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteLoginBrandUpdate"
      responses:
        "200":
          description: Stored login brand config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteLoginBrand"
        "422":
          description: Validation error (invalid URL scheme or message too long)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- S3 Malware / File-Integrity Scan ---------------------------------------
  /api/v1/sites/{siteId}/scans:
    post:
      operationId: startScanRun
      summary: Start a file-integrity scan run for a site
      description: |
        Enqueues a scan against the site's WordPress core/plugin/theme files
        (checksum comparison). `kind` defaults to `core` when the body is
        omitted. Requires the `site.write` permission.
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  default: core
      responses:
        "202":
          description: Scan run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: listScanRuns
      summary: List scan runs for a site
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
      responses:
        "200":
          description: Scan run list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScanRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sites/{siteId}/scans/{runId}:
    get:
      operationId: getScanRun
      summary: Get a scan run
      description: |
        The run is resolved by id (tenant-scoped); a site-scoped collaborator
        without access to the run's own site is rejected with 403.
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scan run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sites/{siteId}/scans/{runId}/findings:
    get:
      operationId: listScanFindings
      summary: List findings for a scan run
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        "200":
          description: Finding list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScanFinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sites/{siteId}/scans/{runId}/findings/{fid}/file:
    post:
      operationId: fetchScanFindingFile
      summary: Fetch the live file content for a scan finding (base64)
      description: |
        Dispatches a synchronous read to the site's agent and returns the
        file content base64-encoded. Requires the `site.write` permission
        (this reaches out to the live site).
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File content (or a fetch failure surfaced as `ok:false`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanFindingFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/findings/{id}/ignore:
    post:
      operationId: toggleScanFindingIgnore
      summary: Toggle the ignored flag on a scan finding
      description: |
        Global route (no `:siteId` path segment — a finding id is unique per
        tenant). The finding's own site is resolved server-side and checked
        against the caller's site allowlist. `ignored` defaults to `true`
        when omitted from the body.
      tags: [scans]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ignored:
                  type: boolean
                  default: true
