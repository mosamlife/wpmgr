openapi: 3.1.0
info:
  title: WPMgr API
  version: 0.61.124
  description: |
    Control-plane REST API for **WPMgr**, the open-source, self-hostable
    WordPress fleet management platform (AGPL-3.0). One control plane enrolls,
    monitors, updates, backs up, optimizes, and secures many WordPress sites.

    ## Authentication
    - **Dashboard / operator routes** use a session cookie established at login
      (email and password, or OIDC single sign-on). Role-based access
      (owner, admin, operator, viewer) and per-site sharing are enforced
      server-side by Postgres row-level security.
    - **Agent routes** (`/agent/v1/*`, `/enroll`) use Ed25519 signed requests:
      each site's agent plugin signs its calls with a per-site key the control
      plane verifies. The control plane never holds a site secret.
    - **API keys** (`wpmgr_<prefix>_<secret>`) carry the same role matrix as a
      user session, for programmatic access.

    Endpoints declared as `text/event-stream` are live Server-Sent Event
    streams. Documentation tools render them but cannot exercise them from the
    in-page "try it" client.
  contact:
    name: WPMgr
    url: https://github.com/mosamlife/wpmgr
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.txt
servers:
  - url: https://manage.wpmgr.app
    description: Production
  - url: http://localhost:8080
    description: Local development
tags:
  - name: system
    description: Liveness, readiness, and version probes.
  - name: auth
    description: Login, logout, session, and first-run owner bootstrap.
  - name: tenants
    description: Tenant (organization) lifecycle and settings.
  - name: orgs
    description: Organization configuration and membership.
  - name: members
    description: Organization members and their roles (owner, admin, operator, viewer).
  - name: invitations
    description: Tokenized, single-use invitations to join an organization.
  - name: sites
    description: WordPress site enrollment, the connection-state machine, tags, and one-click autologin.
  - name: diagnostics
    description: Per-site Site Health diagnostics (14 categories) and PHP error monitoring.
  - name: backups
    description: Scheduled and on-demand backups, snapshots, restore, and SQL inspection.
  - name: destinations
    description: Backup destinations (control-plane bucket, customer S3, or a local folder).
  - name: updates
    description: WordPress core, plugin, and theme updates with dry-run preview and automatic rollback.
  - name: media
    description: Image optimization to AVIF and WebP, library sync, and savings metrics.
  - name: uptime
    description: Active uptime monitoring, latency reports, TLS certificate tracking, and alerts.
  - name: activity
    description: Hash-chained WordPress activity log and the filtered activity feed.
  - name: audit
    description: Tamper-evident, hash-chained organization audit log.
  - name: billing
    description: >-
      Hosted-billing plan, payment-provider checkout, and billing-management
      portal (owner-only; mounted only when the control plane runs with
      hosted billing enabled).
  - name: admin-billing
    description: >-
      Superadmin instance-wide billing console: the accounts list, one
      account's full detail page, the revenue dashboard, and manual
      overrides (comp, override limits, extend grace, suspend/restore, force
      state). Every route requires is_superadmin=true. These handlers are
      hand-rolled Gin (ADR-047 — ogen's own server is not mounted for this
      area because the routes need requireSuperadmin/RLS middleware); this
      contract documents the wire shape so the TypeScript client is
      generated and a backend test can enforce conformance.
  - name: security
    description: Core file-integrity scans, brute-force protection, and the IP firewall.
  - name: two-factor-auth
    description: Dashboard operator two-factor authentication (TOTP, WebAuthn/passkeys, recovery codes, trusted devices).
  - name: scans
    description: Per-site malware and file-integrity scan runs and their findings.
  - name: vulnerabilities
    description: Known-vulnerability detection for installed core/plugins/themes, sourced from the Wordfence Intelligence feed.
  - name: files
    description: Per-site read/write File Manager (browse, edit, upload, archive, search, and version history), off by default per site.
  - name: email
    description: Per-site and org-level outgoing email logging, deliverability, suppression lists, and provider webhooks.
  - name: clients
    description: Agency client records, client members/invitations, and bulk site assignment.
  - name: portal
    description: Read-only client portal (site status, uptime, backups, updates, vitals, and report downloads).
  - name: rum
    description: Public Real User Monitoring beacon ingest.
  - name: admin
    description: >-
      Superadmin instance-management console (instance stats, user
      management, tenancy diagnostics, and the vulnerability feed API key).
      Every route requires is_superadmin=true. Distinct from the admin-billing
      tag, which covers the billing-specific superadmin console.
  - name: api-keys
    description: Role-scoped, hashed, revocable API keys.
  - name: shares
    description: Per-site sharing with outside collaborators.
  - name: agent
    description: Ed25519 signed agent-to-control-plane endpoints (metadata, heartbeat, diagnostics, backups).
  - name: loginbrand
    description: Per-site wp-login whitelabeling (logo, link, message).
  - name: performance
    description: Per-site Performance Suite (page cache, CSS/JS optimization, RUCSS, CDN, database cleanup) plus portfolio-wide bulk cache actions.
  - name: object-cache
    description: Per-site object (Redis/Memcached) cache management — config, test, enable/disable, flush, and stats history.
  - name: settings
    description: Instance-wide operator settings (currently outgoing SMTP configuration).
  - name: agent-releases
    description: >-
      Operator-facing, read-only visibility into the currently published
      WPMgr agent release version and each site's update freshness. Distinct
      from the agent tag, which covers agent-to-control-plane endpoints.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [system]
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: Returns 200 when the service can serve traffic (DB reachable).
      tags: [system]
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /auth/register:
    post:
      operationId: register
      summary: Register (first-run bootstrap or self-serve)
      description: |
        On first run (zero users in the database) this bootstraps the instance:
        creates the first user verified and active, creates their tenant, and
        establishes an immediate session (201 + Me). After the first user exists,
        registration is open self-serve: the account is created in a pending
        state, a verification email is sent, and the response is 200
        {ok: true, pending: true}. The user must verify their email via
        POST /auth/verify-email before they can log in.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: First-run bootstrap — user registered, session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "200":
          description: Self-serve signup accepted; verification email sent
          content:
            application/json:
              schema:
                type: object
                required: [ok, pending]
                properties:
                  ok:
                    type: boolean
                  pending:
                    type: boolean
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Request a password-reset email
      description: |
        Always returns 200 {ok: true} whether or not the email maps to an
        account (enumeration-safe). A reset-link email is sent when the account
        exists and is active.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Request accepted (enumeration-safe)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Consume a password-reset token and set a new password
      description: |
        Validates the one-time reset token and replaces the user's password.
        Does not establish a session; the user must log in separately. Returns
        410 when the token is expired, already used, or not found.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "410":
          description: Token expired, already used, or not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed (e.g. password too weak)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify a self-serve signup email and establish a session
      description: |
        Consumes the one-time verification token sent during self-serve
        registration, activates the account, and establishes a session so the
        user lands logged in. Returns 410 when the token is expired or already
        consumed.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Email verified; session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "410":
          description: Token expired or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/verification/resend:
    post:
      operationId: resendVerification
      summary: Re-send the email verification link
      description: |
        Always returns 200 {ok: true} whether or not the email maps to a
        pending account (enumeration-safe). A new verification email is sent
        when the account exists and is still pending verification.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Request accepted (enumeration-safe)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /auth/login:
    post:
      operationId: login
      summary: Email + password login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Destroy the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: Current user, memberships, and active tenant
      tags: [auth]
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateMe
      summary: Update the authenticated user's display name
      description: |
        Updates the caller's display name. Email is intentionally not
        editable here.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Updated user, memberships, and active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/me/password:
    post:
      operationId: changeMyPassword
      summary: Change the authenticated user's password
      description: |
        Verifies `current_password`, then sets `new_password`. This session
        stays alive (its `auth_at` is refreshed so it does not predate the new
        `password_changed_at`); every other session for this user is invalidated.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
      responses:
        "204":
          description: Password changed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ---------------------------------------------------------------------------
  # ADR-056 Phase 3 — dashboard two-factor authentication
  # ---------------------------------------------------------------------------

  /auth/2fa/status:
    get:
      operationId: getTwoFactorStatus
      summary: Current 2FA configuration summary for the authenticated user
      tags: [two-factor-auth]
      responses:
        "200":
          description: 2FA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/2fa/totp/begin:
    post:
      operationId: beginTotpEnrollment
      summary: Start TOTP enrollment
      description: |
        Returns the `otpauth://` URI and the base32 secret for the enrollment
        wizard (e.g. to render a QR code). This is the ONLY response that ever
        returns the raw secret.
      tags: [two-factor-auth]
      responses:
        "200":
          description: TOTP provisional secret
          content:
            application/json:
              schema:
                type: object
                required: [otpauth_uri, secret]
                properties:
                  otpauth_uri:
                    type: string
                  secret:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/2fa/totp/confirm:
    post:
      operationId: confirmTotpEnrollment
      summary: Confirm TOTP enrollment with a live code
      description: |
        Validates `code` against the provisional secret from
        `POST /auth/2fa/totp/begin`, persists the confirmed secret, and
        returns 10 recovery codes shown exactly once.
      tags: [two-factor-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: TOTP confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/2fa/totp/disable:
    post:
      operationId: disableTotp
      summary: Disable TOTP
      description: |
        Requires `current_password` re-authentication. On success: clears
        TOTP, recomputes `two_factor_enabled`, revokes every trusted device
        for this user, and clears the trusted-device cookie on this response.
      tags: [two-factor-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password:
                  type: string
                  format: password
      responses:
        "204":
          description: TOTP disabled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/2fa/totp:
    post:
      operationId: completeTotpChallenge
      summary: Complete a login 2FA challenge with a TOTP code (unauthenticated)
      description: |
        Verifies `code` against the active challenge minted at login (the
        `challenge` nonce returned by `POST /auth/login`'s 202 response) and,
        on success, issues a full session. `remember_device` optionally issues
        a trusted-device cookie so future logins skip the challenge.
      tags: [two-factor-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorChallengeCompleteRequest"
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                type: object
                required: [me]
                properties:
                  me:
                    $ref: "#/components/schemas/Me"
                  recovery_codes_remaining:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/2fa/recovery:
    post:
      operationId: completeRecoveryChallenge
      summary: Complete a login 2FA challenge with a single-use recovery code (unauthenticated)
      tags: [two-factor-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorChallengeCompleteRequest"
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                type: object
                required: [me]
                properties:
                  me:
                    $ref: "#/components/schemas/Me"
                  recovery_codes_remaining:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/2fa/recovery-codes/regenerate:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery-code batch
      description: |
        Requires `current_password` re-authentication. Replaces the existing
        10-code batch with 10 new ones, returned once.
      tags: [two-factor-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password:
                  type: string
                  format: password
      responses:
        "200":
          description: New recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/2fa/webauthn/begin:
    post:
      operationId: beginWebAuthnChallenge
      summary: Start the WebAuthn assertion ceremony for a login challenge (unauthenticated)
      description: |
        Returns the raw `CredentialAssertion` options JSON so the browser can
        pass them directly to `navigator.credentials.get()`.
      tags: [two-factor-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge]
              properties:
                challenge:
                  type: string
                  format: uuid
      responses:
        "200":
          description: WebAuthn CredentialAssertion options (raw, provider-defined shape)
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/2fa/webauthn/finish:
    post:
      operationId: finishWebAuthnChallenge
      summary: Complete a login 2FA challenge with a WebAuthn assertion (unauthenticated)
      tags: [two-factor-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, assertion]
              properties:
                challenge:
                  type: string
                  format: uuid
                assertion:
                  type: string
                  format: byte
                  description: Base64-encoded WebAuthn assertion response.
                remember_device:
                  type: boolean
                  default: false
                device_label:
                  type: string
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/2fa/webauthn/begin-registration:
    post:
      operationId: beginWebAuthnEnrollment
      summary: Start the WebAuthn registration ceremony for the authenticated user
      description: |
        Returns the raw `CredentialCreation` options JSON so the browser can
        pass them directly to `navigator.credentials.create()`.
      tags: [two-factor-auth]
      responses:
        "200":
          description: WebAuthn CredentialCreation options (raw, provider-defined shape)
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/2fa/webauthn/finish-registration:
    post:
      operationId: finishWebAuthnEnrollment
      summary: Complete WebAuthn credential registration
      tags: [two-factor-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, attestation]
              properties:
                name:
                  type: string
                  description: Operator-chosen label for this credential (e.g. "YubiKey").
                attestation:
                  type: string
                  format: byte
                  description: Base64-encoded WebAuthn attestation response.
      responses:
        "201":
          description: Credential registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/2fa/webauthn/credentials:
    get:
      operationId: listWebAuthnCredentials
      summary: List the authenticated user's WebAuthn credentials
      tags: [two-factor-auth]
      responses:
        "200":
          description: Credentials
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebAuthnCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/2fa/webauthn/credentials/{id}:
    delete:
      operationId: deleteWebAuthnCredential
      summary: Delete a WebAuthn credential
      description: Requires `current_password` re-authentication.
      tags: [two-factor-auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password:
                  type: string
                  format: password
      responses:
        "204":
          description: Credential deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/2fa/trusted-devices:
    get:
      operationId: listTrustedDevices
      summary: List the authenticated user's trusted devices
      tags: [two-factor-auth]
      responses:
        "200":
          description: Trusted devices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrustedDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/2fa/trusted-devices/{id}:
    delete:
      operationId: revokeTrustedDevice
      summary: Revoke one trusted device
      tags: [two-factor-auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Device revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/2fa/trusted-devices/revoke-all:
    post:
      operationId: revokeAllTrustedDevices
      summary: Revoke every trusted device for the authenticated user
      description: Also clears the trusted-device cookie on this response.
      tags: [two-factor-auth]
      responses:
        "204":
          description: All devices revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/oidc/login:
    get:
      operationId: oidcLogin
