          application/json:
            schema:
              $ref: "#/components/schemas/ClientReportScheduleUpdate"
      responses:
        "200":
          description: The saved report schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientReportSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{clientId}/reports:
    get:
      operationId: listClientReports
      summary: List generated reports for a client
      description: Returns generated reports in reverse chronological order (newest first). Supports keyset cursor pagination.
      tags: [clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          description: Opaque keyset cursor returned by a previous call.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of items to return (1–100, default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated list of generated reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientReportList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: generateClientReport
      summary: Trigger an on-demand report for a client
      description: Enqueues a report generation job. Returns 202 Accepted immediately; poll GET /reports/{reportId} for status. When notify=true and the schedule has recipients, an email is sent on completion.
      tags: [clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateClientReportRequest"
      responses:
        "202":
          description: Report job accepted — poll the returned report for status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{clientId}/reports/{reportId}:
    get:
      operationId: getClientReport
      summary: Get a generated report by ID
      description: Returns the report record. When status is `completed`, `html_url` and `pdf_url` are pre-signed download links (valid 7 days).
      tags: [clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The report record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteClientReport
      summary: Delete a generated report
      description: Deletes the report record and its stored blobs (HTML + PDF) from object storage.
      tags: [clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # m66 — Client portal member management (agency side)
  # ---------------------------------------------------------------------------

  /api/v1/clients/{clientId}/members:
    get:
      operationId: listClientMembers
      summary: List portal members for a client
      description: Returns the roster of portal users granted access to this client.
      tags: [clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addClientMember
      summary: Add or invite a portal member
      description: >
        If the email belongs to a known user, grants portal access immediately
        and returns `201` with the member record. If the email is unknown, creates
        a client-scope invitation and returns `201` with `invited: true` and an
        `accept_link` (always present as a copyable fallback when SMTP is
        unconfigured).
      tags: [clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientMemberCreateRequest"
      responses:
        "201":
          description: Member added or invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMemberInviteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/clients/{clientId}/members/{userId}:
    delete:
      operationId: removeClientMember
      summary: Revoke portal access for a member
      description: Immediately removes the client_members row. The user's session remains valid but subsequent portal requests resolve no tenant.
      tags: [clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{clientId}/invitations:
    get:
      operationId: listClientInvitations
      summary: List portal invitations for a client
      description: Returns all client-scope invitations (pending, accepted, expired, revoked).
      tags: [clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientInvitationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{clientId}/invitations/{invitationId}:
    delete:
      operationId: revokeClientInvitation
      summary: Revoke a pending portal invitation
      description: Soft-revokes the invitation. The accept link becomes inert.
      tags: [clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{clientId}/invitations/{invitationId}/regenerate:
    post:
      operationId: regenerateClientInvitation
      summary: Regenerate a portal invitation token
      description: Rotates the token (kills the old link), resets expiry and attempt counter, and clears any prior revocation.
      tags: [clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Regenerated invitation with new accept_link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMemberInviteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # m66 — Client portal endpoints (portal side; RequireClientPortal gating)
  # ---------------------------------------------------------------------------

  /api/v1/portal/overview:
    get:
      operationId: getPortalOverview
      summary: Portal overview (client branding + site count)
      description: Returns identity and branding for the portal principal's primary client.
      tags: [portal]
      responses:
        "200":
          description: Portal overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/portal/sites:
    get:
      operationId: listPortalSites
      summary: List sites accessible to the portal principal
      description: Returns a summary of each site the portal user can see (their client's sites only).
      tags: [portal]
      responses:
        "200":
          description: Site list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSiteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/portal/sites/{siteId}/uptime:
    get:
      operationId: getPortalSiteUptime
      summary: Uptime summary for a portal site
      description: Returns windowed uptime percentage, average latency, TLS expiry, and incident history.
      tags: [portal]
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d, 90d]
            default: 30d
      responses:
        "200":
          description: Uptime summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUptimeSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/portal/sites/{siteId}/backups:
    get:
      operationId: listPortalSiteBackups
      summary: Backup inventory for a portal site
      description: Returns completed backups only. No blob keys, destinations, or download links are included.
      tags: [portal]
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 20
            default: 10
      responses:
        "200":
          description: Backup list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalBackupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/portal/sites/{siteId}/updates:
    get:
      operationId: listPortalSiteUpdates
      summary: Applied updates log for a portal site
      description: Returns successfully applied update tasks only.
      tags: [portal]
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 50
            default: 20
      responses:
        "200":
          description: Update list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUpdateList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/portal/sites/{siteId}/vitals:
    get:
      operationId: getPortalSiteVitals
      summary: Core Web Vitals p75 summary for a portal site
      description: Returns all-devices aggregate p75 field data for LCP, INP, and CLS.
      tags: [portal]
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: range
          in: query
          schema:
            type: string
            enum: [28d]
            default: 28d
      responses:
        "200":
          description: Vitals summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalVitalsSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/portal/summary:
    get:
      operationId: getPortalSummary
      summary: Portal dashboard summary (rolling window)
      description: >
        Returns the full portal dashboard payload: KPI totals, per-site uptime
        and vitals, recent work feed, and latest report reference.
        Data is derived from report.BuildReportData with the email source
        disabled. Only sites in the principal's AllowedSiteIDs are returned.
        The ?range parameter accepts 7d, 30d, or 90d; other values are clamped
        to 30d. In v2 only 30d is fully supported.
      tags: [portal]
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            default: 30d
            enum: [7d, 30d, 90d]
      responses:
        "200":
          description: Portal summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/portal/reports:
    get:
      operationId: listPortalReports
      summary: List completed reports for the portal principal
      description: >
        Returns completed white-label reports for all of the principal's clients.
        The client_id = ANY(principal.ClientIDs) filter is enforced in the query.
      tags: [portal]
      responses:
        "200":
          description: Report list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalReportList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/portal/reports/{reportId}/download:
    get:
      operationId: downloadPortalReport
      summary: Get a presigned download URL for a portal report
      description: >
        Returns a presigned URL for the HTML or PDF version of a completed report.
        The report must belong to one of the principal's clients; otherwise 404 is
        returned (not 403, to avoid confirming report existence).
      tags: [portal]
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [html, pdf]
      responses:
        "200":
          description: Presigned download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalReportDownload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # m82 — File Manager (P1 settings + read-only)
  # ---------------------------------------------------------------------------

  /api/v1/sites/{siteId}/files/settings:
    get:
      operationId: getSiteFilesSettings
      summary: Get file manager settings for a site
      description: |
        Returns the current file manager settings for a site, including whether
        the feature is enabled.

        Any site member (viewer+) may call this endpoint so the UI can render
        the correct enable/disable state without an extra permission check.

        No permission beyond `RequireSiteAccess` is required.
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Current file manager settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileManagerSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateSiteFilesSettings
      summary: Enable or disable the file manager for a site
      description: |
        Enables or disables the file manager feature for a site. The feature is
        **off by default** (migration m82); an explicit enable is required before
        any file browse/read/download endpoint will work.

        `root_jail` is read-only in P1 (always `""`) — the agent defaults to the
        site's `ABSPATH`. Any `root_jail` field in the request body is ignored.

        An audit entry (`site.files.settings.changed`) is recorded on every call,
        capturing the resulting `enabled` and `write_enabled` state.

        `root_jail` is read-only in P1/P2 (always `""`) — the agent defaults to
        the site's `ABSPATH`. Any `root_jail` field in the request body is ignored.

        Requires `site.files.manage` permission (admin+).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFileManagerSettingsRequest"
      responses:
        "200":
          description: Updated file manager settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileManagerSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sites/{siteId}/files:
    get:
      operationId: listSiteFiles
      summary: List a directory on a managed site
      description: |
        Issues a `file_list` command to the site's agent and returns one page
        of directory entries for the given path.

        The feature must be **explicitly enabled per site** (off by default).
        Returns `403 files_not_enabled` when the site has not opted in.

        Requires the `site.files.read` permission (admin+).

        Pagination is cursor-based: when `truncated=true` the response carries
        an opaque `cursor` that the caller passes on the next request.
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: path
          in: query
          required: false
          schema:
            type: string
            default: "/"
          description: Site-relative directory path to list (forward-slash separated).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >
            Opaque resume cursor from a prior response with `truncated=true`.
            Absent means start from the beginning of the directory.
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sites/{siteId}/files/content:
    get:
      operationId: readSiteFileContent
      summary: Read a small file inline (base64, ≤ 256 KiB)
      description: |
        Issues a `file_read` command to the site's agent and returns the
        base64-encoded content of a file up to 256 KiB. When the file is
        larger than the cap, `truncated=true` is returned; use the download
        endpoint for the full file.

        **Sensitive-path gate (T6):** paths matching `wp-config.php`, `.env*`,
        `*.pem`, `*.key`, `id_rsa*`, `.git/`, `.htpasswd`, or `auth.json`
        require **both**:
        - `confirm_sensitive=true` query parameter, and
        - Owner-level permission (`site.files.read_sensitive`).

        Both the successful read AND any denied attempt are recorded in the
        tamper-evident audit log with the full path.

        The feature must be explicitly enabled per site. Returns
        `403 files_not_enabled` when not opted in.

        Requires the `site.files.read` permission (admin+). Sensitive-path
        reads additionally require `site.files.read_sensitive` (owner only).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Site-relative file path to read.
        - name: confirm_sensitive
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            Must be `true` when reading a sensitive path (wp-config.php, .env*,
            *.pem, *.key, id_rsa*, .git/, .htpasswd, auth.json). Absent or
            false causes a 403 for sensitive paths regardless of role.
      responses:
        "200":
          description: File content (base64-encoded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileReadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: >
            File is too large for inline read. Use the download endpoint
            (`POST /sites/{siteId}/files/download`) for files > 256 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: writeSiteFileContent
      summary: Write (create or overwrite) a small text file (≤ 256 KiB)
      description: |
        Issues a `file_write` command to the site's agent. The agent writes the
        content atomically (temp-write → rename swap) to the resolved path.

        **Write-enabled gate:** The site must have both `enabled=true` AND
        `write_enabled=true` in its file manager settings. Returns
        `403 files_write_not_enabled` when write mode is off.

        **Executable-write gate (T1):** When `confirm_executable_write=true` is
        set in the request body, the caller must additionally hold
        `site.files.write_code` (owner). If an admin-level caller passes
        `confirm_executable_write=true`, the request is rejected with
        `403 insufficient_permission` and the denial is audited at elevated
        severity. The agent independently enforces its executable deny-list
        regardless.

        **Sensitive-file gate (T6):** Same as above for `confirm_sensitive=true`, requires owner (`site.files.write_code`) and is audited at elevated
        severity on both success and denial.

        Requires `site.files.write` permission (admin+).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteFileContentRequest"
      responses:
        "200":
          description: File written successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteFileResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/sites/{siteId}/files/mkdir:
    post:
      operationId: createSiteDirectory
      summary: Create a directory on a managed site
      description: |
        Issues a `file_mkdir` command to the site's agent.

        **Write-enabled gate:** Both `enabled` and `write_enabled` must be true.
        Returns `403 files_write_not_enabled` when write mode is off.

        Requires `site.files.write` permission (admin+).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileMkdirRequest"
      responses:
        "200":
          description: Directory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMkdirResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/sites/{siteId}/files/rename:
    post:
      operationId: renameSiteFile
      summary: Rename or move a file/directory within the jail
      description: |
        Issues a `file_rename` command to the site's agent. Both `src` and `dst`
        are containment-checked by the agent; escaping the jail on either path
        returns `400 outside_root`.

        **Write-enabled gate:** Both `enabled` and `write_enabled` must be true.

        **Executable/sensitive gate:** Same as `writeSiteFileContent` — if
        `confirm_executable_write` or `confirm_sensitive` is set, owner
        permission (`site.files.write_code`) is required.

        Requires `site.files.write` permission (admin+).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileRenameRequest"
      responses:
        "200":
          description: Rename succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRenameResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/sites/{siteId}/files/delete:
    post:
      operationId: deleteSiteFile
      summary: Delete a file or directory on a managed site
      description: |
        Issues a `file_delete` command to the site's agent after verifying
        three layered gates (T12/T13):

        1. **PermSiteFilesWrite** (admin+) — inherited from route middleware.
        2. **PermSiteFilesDelete** (owner) — checked in the handler; denial is
           audited with action `site.files.delete.denied`.
        3. **Typed confirm token** — `confirm` in the request body must be the
           string `"DELETE"` exactly. Missing or wrong value returns
           `400 confirm_required`.

        The agent independently enforces its protected-root guard (`wp-admin`,
        `wp-includes`).

        **Write-enabled gate:** Both `enabled` and `write_enabled` must be true.

        Requires `site.files.write` + `site.files.delete` (owner only).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileDeleteRequest"
      responses:
        "200":
          description: Delete succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDeleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sites/{siteId}/files/chmod:
    post:
      operationId: chmodSiteFile
      summary: Change file/directory permissions on a managed site
      description: |
        Issues a `file_chmod` command to the site's agent. The agent validates
        the mode against a safe allowlist — no setuid (4xxx), no setgid (2xxx),
        no world-write; returns `400 mode_denied` for unsafe modes.

        **Write-enabled gate:** Both `enabled` and `write_enabled` must be true.

        Requires `site.files.write` permission (admin+).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileChmodRequest"
      responses:
        "200":
          description: Chmod succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileChmodResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sites/{siteId}/files/upload:
    post:
      operationId: prepareSiteFileUpload
      summary: Stage an upload — mint presigned S3 PUT URLs for the browser
      description: |
        Step 1 of 2 for browser file upload. The CP mints short-lived presigned
        S3 PUT URLs in the tenant-namespaced staging area and returns them to
        the browser. The browser PUTs each chunk directly to S3 (never through
        the CP). After all chunks are staged, the caller invokes
        `POST /files/upload/apply` to have the agent fetch, reassemble,
        validate (SHA-256), and atomic-swap the file into place.

        Presigned PUT URLs are **never logged** (T8). TTL is ≤ 5 minutes.

        **Write-enabled gate:** Both `enabled` and `write_enabled` must be true.

        **Executable/sensitive gate:** Same as `writeSiteFileContent` — if
        `confirm_executable_write` or `confirm_sensitive` is set, owner
        permission (`site.files.write_code`) is required.

        Returns `503 storage_not_configured` on self-hosted deployments without
        object storage.

        Requires `site.files.write` permission (admin+).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareUploadRequest"
      responses:
        "200":
          description: Presigned PUT URLs and transfer metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepareUploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Object storage is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/sites/{siteId}/files/upload/apply:
    post:
      operationId: applySiteFileUpload
      summary: Apply a staged upload — agent fetches chunks and atomic-swaps
      description: |
        Step 2 of 2 for browser file upload. After the browser has PUT all
        chunks to the presigned S3 URLs returned by `prepareSiteFileUpload`,
        this endpoint:

        1. Mints presigned S3 GET URLs for each staged chunk.
        2. Issues `file_upload_apply` to the agent, which fetches all chunks,
           reassembles them in order, validates the SHA-256 digest, and
           atomic-swaps the assembled file into the target path (same
           FilesRestorer swap primitive used by restore).

        The agent returns `400 write_failed` when the SHA-256 digest does not
        match. The caller should retry the full upload in that case.

        **Write-enabled gate:** Both `enabled` and `write_enabled` must be true.

        **Executable/sensitive gate:** Same as `prepareSiteFileUpload`.

        Requires `site.files.write` permission (admin+).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyUploadRequest"
      responses:
        "200":
          description: Upload applied successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyUploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Object storage is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/sites/{siteId}/files/download:
    post:
      operationId: prepareSiteFileDownload
      summary: Stage a file for browser download (presigned URL)
      description: |
        Prepares a file for large-file download in three steps:
        1. CP mints presigned S3 PUT URLs in a tenant-namespaced staging area.
        2. CP issues `file_download_prepare` to the agent, which uploads the
           file in chunks directly to S3 (never through the CP).
        3. CP mints a short-lived presigned GET URL (≤ 5 min TTL) for the
           browser to fetch the staged file directly from object storage.

        Large files bypass the CP's response path entirely — only the
        presigned URL is returned in the 200 body.

        A `file_transfers` row is persisted for audit and GC tracking.

        **Sensitive-path gate (T6):** same rules as `readSiteFileContent`, owner-level permission required; the attempt is always audited.

        Returns `503 storage_not_configured` when object storage is not
        configured (self-hosted deployments without S3).

        The feature must be explicitly enabled per site. Returns
        `403 files_not_enabled` when not opted in.

        Requires the `site.files.read` permission (admin+). Sensitive-path
        downloads additionally require `site.files.read_sensitive` (owner only).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileDownloadRequest"
      responses:
        "200":
          description: Presigned download URL and transfer metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDownloadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Object storage is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # P3: archive / extract / search / version history + restore
  # ---------------------------------------------------------------------------

  /api/v1/sites/{siteId}/files/archive:
    post:
      operationId: createSiteFileArchive
      summary: Create a ZIP archive of site paths and return a presigned download URL
      description: |
        Issues a `file_archive_create` command to the site's agent. The agent
        zips the specified paths (all containment-checked within the jail) and
        uploads the archive directly to a CP-minted S3 staging area. The CP
        then mints a short-lived presigned GET URL for the browser to download
        the archive.

        This is a **read** operation — it does not require write mode.

        **Sensitive-path gate (F1):** If any path in `paths` matches the
        sensitive-file deny-list (wp-config.php, .env*, *.pem, …), the caller
        must set `confirm_sensitive=true` AND hold `site.files.read_sensitive`
        (owner). Both checks must pass — a missing flag or insufficient
        permission returns `403`. The denial is audited at elevated severity.
        The agent independently re-checks every path and returns
        `sensitive_denied` when the flag is absent. The CP audit carries the
        full path list.

        Returns `503 storage_not_configured` on deployments without object storage.

        The feature must be explicitly enabled. Returns `403 files_not_enabled`
        when not opted in.

        Requires `site.files.read` permission (admin+).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileArchiveCreateRequest"
      responses:
        "200":
          description: Archive created and presigned download URL returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileArchiveCreateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Object storage is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/sites/{siteId}/files/extract:
    post:
      operationId: extractSiteFileArchive
      summary: Extract a ZIP archive on a managed site
      description: |
        Issues a `file_extract` command to the site's agent. The agent opens
        the archive at `archive_path`, validates every entry against the
        containment guard (zip-slip / zip-bomb / symlink / absolute-path
        guards all enforced agent-side), and extracts into `dest_path`.

        **Write-enabled gate:** Both `enabled` and `write_enabled` must be
        `true`. Returns `403 files_write_not_enabled` when write mode is off.

        **Zip-slip / zip-bomb (422):** If any archive entry would resolve
        outside `dest_path` or the archive exceeds the uncompressed-size /
        entry-count guard, the agent returns `zip_slip` or `zip_bomb`
        respectively. The CP maps these to `422 Unprocessable Entity`.

        **Bad/unknown archive (400):** `bad_archive` (file is corrupted) and
        `not_archive` (path is not a recognised archive) map to `400`.

        **Executable/sensitive gate (T1/T6):** When `confirm_executable_write`
        or `confirm_sensitive` is set in the request body:
        - The caller must additionally hold `site.files.write_code` (owner).
        - A non-owner caller is rejected at the CP handler — the agent is
          **never called** — and the denial is audited at elevated severity.
        - The agent independently enforces its executable deny-list and
          sensitive-path deny-list regardless of the confirm flags.

        Requires `site.files.write` permission (admin+).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileExtractRequest"
      responses:
        "200":
          description: Archive extracted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileExtractResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            Archive is structurally valid but contains unsafe entries
            (`zip_slip`, path traversal outside destination, or `zip_bomb`, exceeds uncompressed-size / entry-count guard).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/sites/{siteId}/files/search:
    get:
      operationId: searchSiteFiles
      summary: Search files by name or content within the jail
      description: |
        Issues a `file_search` command to the site's agent. Supports two modes:
        - `name` — match filenames against the query string.
        - `content` — grep file contents for the query string (line + snippet returned).

        Results are cursor-paginated: when `truncated=true` the response carries
        an opaque `cursor` for the next page.

        This is a **read** operation. The agent never exposes the content of
        sensitive paths (wp-config.php, .env*, *.pem, …) in search snippets.

        The feature must be explicitly enabled. Returns `403 files_not_enabled`
        when not opted in.

        Requires `site.files.read` permission (admin+).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: path
          in: query
          required: false
          schema:
            type: string
            default: "/"
          description: Site-relative root directory to search under.
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search term (filename substring for `name` mode; grep pattern for `content` mode).
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [name, content]
            default: name
          description: >
            Search mode. `name` matches filenames; `content` greps file
            contents and returns line number + surrounding snippet.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque resume cursor from a prior truncated response.
      responses:
        "200":
          description: Search results (possibly paginated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileSearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sites/{siteId}/files/versions:
    get:
      operationId: listSiteFileVersions
      summary: List version history for a file
      description: |
        Issues a `file_versions_list` command to the site's agent. Returns the
        version history for a single file, ordered newest-first. Each version
        carries an opaque `version_id` that can be passed to
        `POST /files/versions/restore` to restore that version.

        **Sensitive-path gate (F3):** If `path` matches the sensitive-file
        deny-list (wp-config.php, .env*, *.pem, …), the caller must hold
        `site.files.read_sensitive` (owner). A non-owner is denied `403` and
        the denial is audited at elevated severity. This prevents leaking that
        sensitive backups exist to non-owner collaborators.

        Version history availability depends on the agent-side implementation
        (e.g. the host's filesystem snapshot, the pre-write backup mechanism,
        or WP's own revision system). When no history is available for a path,
        the agent returns an empty `versions` list.

        This is a **read** operation.

        The feature must be explicitly enabled. Returns `403 files_not_enabled`
        when not opted in.

        Requires `site.files.read` permission (admin+).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Site-relative file path to retrieve version history for.
      responses:
        "200":
          description: Version history for the file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileVersionsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sites/{siteId}/files/versions/restore:
    post:
      operationId: restoreSiteFileVersion
      summary: Restore a file to a prior version
      description: |
        Issues a `file_version_restore` command to the site's agent, which
        overwrites the file at `path` with the content of the specified
        `version_id`. The version identifier is opaque — retrieve valid IDs
        from `GET /files/versions?path=…`.

        Returns `404 no_such_version` when the version ID does not exist for
        the given path.

        **Write-enabled gate:** Both `enabled` and `write_enabled` must be
        `true`. Returns `403 files_write_not_enabled` when write mode is off.

        **Sensitive-path gate (F3):** If `path` matches the sensitive-file
        deny-list (wp-config.php, .env*, *.pem, …), the caller must set
        `confirm_sensitive=true` AND hold `site.files.write_code` (owner).
        Both checks must pass — a missing flag or insufficient permission
        returns `403`. The denial is audited at elevated severity. The agent
        independently re-checks and returns `sensitive_denied` when the flag
        is absent.

        Every restore is audited with the full `path` and `version_id`.

        Requires `site.files.write` permission (admin+).
      tags: [sites]
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileVersionRestoreRequest"
      responses:
        "200":
          description: File restored to the specified version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileVersionRestoreResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict — resource is referenced and cannot be deleted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RestoreId:
      name: restoreId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DestinationId:
      name: destinationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    AgentSignature:
      type: apiKey
      in: header
      name: X-WPMgr-Signature
      description: |
        Ed25519 signed-request authentication for agent->control-plane calls. The
        agent sends four headers: X-WPMgr-Agent-Key (its base64 Ed25519 public
        key, identifying the enrolled site), X-WPMgr-Timestamp (Unix seconds),
        X-WPMgr-Nonce (a unique per-request token), and X-WPMgr-Signature (the
        base64 Ed25519 signature over the canonical message
        "METHOD\nPATH\nTIMESTAMP\nNONCE\nhex(sha256(body))"). The control plane
        rejects stale timestamps and replayed nonces. (apiKey type is the closest
        OpenAPI 3.1 primitive for this header-carried signature scheme.)
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable error description.
        details:
          type: object
          additionalProperties: true
    Tenant:
      type: object
      required: [id, name, slug, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantCreate:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    TenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
    Site:
      type: object
      required:
        [id, tenant_id, url, name, status, wp_version, php_version, health_status, multisite, tags, page_cache_enabled, object_cache_enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        name:
          type: string
        status:
          type: string
          enum: [pending, active, error, disabled]
        wp_version:
          type: string
        php_version:
          type: string
        health_status:
          type: string
          enum: [unknown, healthy, unreachable]
        connection_state:
          type: string
          description: |
            M21 / ADR-041 — the single source of truth for the agent connection
            lifecycle. Surfaced live on the /api/v1/sites/events SSE `site`
            payload; surfacing it on this strict REST Site shape is a Phase 4
            follow-up (the legacy status/health_status remain in sync meanwhile).
          enum: [pending_enrollment, connected, degraded, disconnected, revoked, archived]
        connection_generation:
          type: integer
          format: int32
          description: M21 — bumps on each re-enrollment under the same site_id.
        disconnected_reason:
          type: string
          description: M21 — reason recorded on the last down transition.
        server_info:
          type: string
        multisite:
          type: boolean
        active_theme:
          type: string
        tags:
          type: array
          items:
            type: string
        enrolled:
          type: boolean
          description: Whether an agent has enrolled this site.
        enrolled_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        components:
          $ref: "#/components/schemas/SiteComponents"
        agent_version:
          type: string
          description: Current WPMgr agent plugin version (last-synced via metadata push). Empty/absent until the site re-syncs on a newer agent.
        host_provider:
          type: string
          description: Inferred hosting/infrastructure provider (e.g. DigitalOcean, Hetzner, AWS), derived control-plane-side from the agent's observed public egress IP via an offline ASN lookup. Best-effort hint shown only when no managed-host flag matched. Empty/absent until inferred.
        host_provider_org:
          type: string
          description: Raw Autonomous System organization for the inferred network (e.g. "Hetzner Online GmbH"). Display fallback when host_provider (the canonical name) is empty but the network is known. Empty/absent until inferred.
        host_provider_ip:
          type: string
          description: The public egress IP the host inference used (the agent's observed or reported IP). Surfaced to the site's own operators for debugging. Empty/absent until inferred.
        updates_available:
          type: integer
          format: int32
          description: Count of plugins + themes + core with an available update (last-synced).
        last_backup_at:
          type: string
          format: date-time
          description: Time of the most recent backup snapshot (finished_at, falling back to created_at).
        last_backup_status:
          type: string
          enum: [success, running, failed]
          description: Normalized status of the most recent backup snapshot (DB 'completed'→'success', 'pending'→'running').
        client_id:
          type: string
          format: uuid
          description: UUID of the agency client this site is grouped under (m63). Absent when the site has no client.
        client_name:
          type: string
          description: Display name of the agency client this site is grouped under (m63). Absent when the site has no client.
        screenshot_url:
          type: string
          format: uri
          description: |
            M72 — Presigned GCS GET URL for the site's 1x WebP screenshot thumbnail (640×400 effective).
            Absent/null when the screenshot has never been captured or is pending.
            The URL is time-bounded (1 h); clients must NOT cache it past the TTL and should
            refetch on reconnect. NEVER put the raw WordPress site URL here; this is always a
            CP-presigned storage URL.
        screenshot_url_2x:
          type: string
          format: uri
          description: |
            M72 — Presigned GCS GET URL for the site's 2x WebP screenshot thumbnail (1280×800 effective).
            Absent/null when not captured or pending.
        screenshot_status:
          type: string
          enum: [pending, ready, failed]
          description: |
            M72 — Current screenshot capture status. Absent/null means "never captured" (treat as no screenshot).
            pending = capture job is enqueued or running.
            ready   = last capture completed; screenshot_url is valid.
            failed  = last capture failed; screenshot_failed_reason explains why.
        screenshot_captured_at:
          type: string
          format: date-time
          description: M72 — When the current screenshot was captured. Absent/null when pending or never captured.
        screenshot_failed_reason:
          type: string
          description: M72 — Human-readable reason for the last failed capture. Absent/null when not failed.
        up:
          type: boolean
          description: |
            Current up/down from the most-recent uptime probe. Absent/null when the site has never been probed.
            true = last probe received a non-error 2xx response; false = last probe failed or timed out.
        uptime_pct:
          type: number
          format: double
          description: |
            Uptime percentage over the trailing 30 days, rounded to 2 decimal places (e.g. 99.98).
            Absent/null when the site has no probes in the 30-day window.
        avg_latency_ms:
          type: integer
          format: int32
          description: |
            Average total response latency in milliseconds over successful (up=true) probes in the
            trailing 30 days, rounded to the nearest millisecond.
            Absent/null when there are no successful probes in the window.
        tls_expires_at:
          type: string
          format: date-time
          description: |
            RFC 3339 timestamp of the TLS certificate expiry captured on the most-recent uptime probe.
            Absent/null when the site is non-HTTPS or has never been probed.
        page_cache_enabled:
          type: boolean
          description: |
            GH #243 — the real Page Cache drop-in state (site_perf_config.cache_enabled),
            not an inference from an installed-plugin slug (the feature ships as a
            drop-in, not a plugin, so no such slug can ever exist). false both when
            caching is off AND when the site has no performance config yet.
        object_cache_enabled:
          type: boolean
          description: |
            GH #243 — the real Object Cache drop-in state (site_object_cache_config.enabled),
            not an inference from an installed-plugin slug (the feature ships as a
            drop-in, not a plugin, so no such slug can ever exist). false both when
            object caching is off AND when the site has no object cache config yet.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SiteComponents:
      type: object
      description: Installed plugin/theme inventory pushed by the agent.
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/SiteComponent"
        themes:
          type: array
          items:
            $ref: "#/components/schemas/SiteComponent"
        core_update:
          type: object
          nullable: true
          description: When set, WordPress core has an update available.
          required: [new_version, current_version]
          properties:
            new_version:
              type: string
            current_version:
              type: string
    SiteComponent:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
        name:
          type: string
        version:
          type: string
        active:
          type: boolean
        plugin_uri:
          type: string
          description: PluginURI from the plugin header. Optional; older agents omit it.
        update_uri:
          type: string
          description: UpdateURI from the plugin header. Optional; older agents omit it.
        author_uri:
          type: string
          description: AuthorURI from the plugin header. Optional; older agents omit it.
        network:
          type: boolean
          description: Whether the plugin is network-activated. Optional; older agents omit it.
        available_update:
          type: object
          nullable: true
          description: When set, an update is available for this plugin/theme.
          required: [new_version]
          properties:
            new_version:
              type: string
            package:
              type: string
              nullable: true
            tested:
              type: string
              nullable: true
            requires_php:
              type: string
              nullable: true
    SiteAvailableUpdates:
      type: object
      description: Per-site cached list of items with updates available.
      required: [site_id, items]
      properties:
        site_id:
          type: string
          format: uuid
        core_update:
          type: object
          nullable: true
          required: [new_version, current_version]
          properties:
            new_version:
              type: string
            current_version:
              type: string
        items:
          type: array
          items:
            type: object
            required: [type, slug, name, version, new_version, active]
            properties:
              type:
                type: string
                enum: [plugin, theme]
              slug:
                type: string
              name:
                type: string
              version:
                type: string
              new_version:
                type: string
              active:
                type: boolean
              package:
                type: string
                nullable: true
              tested:
                type: string
                nullable: true
              requires_php:
                type: string
                nullable: true
        as_of:
          type: string
          format: date-time
          nullable: true
    SiteTags:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
    SiteTag:
      type: object
      description: |
        A tenant-level tag registry entry (GH #230 "rich tags", m100). Owns
        existence/color/canonical name; sites.tags (the site's own text[])
        remains the assignment store.
      required: [id, name, color, usage_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        color:
          type: string
          description: Lowercase "#rrggbb" hex code, or "" for auto (client derives a deterministic color from the name).
        usage_count:
          type: integer
          format: int64
          description: Number of sites in the tenant currently carrying this tag. 0 is a legitimate, unused tag.
        created_at:
          type: string
          format: date-time
    SiteTagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteTag"
    SiteTagCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          description: Optional lowercase "#rrggbb" hex code. Omitted or "" = auto.
    SiteTagUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: When present, renames the tag (propagated to every site + unredeemed pairing code carrying the old name).
        color:
          type: string
          description: When present, sets the tag's color ("" resets to auto).
        merge:
          type: boolean
          default: false
          description: |
            When the new `name` collides with an existing tag, merge the
            source tag INTO that existing survivor instead of returning 409
            tag_name_exists.
    BulkTagApplyRequest:
      type: object
      required: [site_ids]
      properties:
        site_ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
        add:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
        remove:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
    PairingCodeCreate:
      type: object
      properties:
        site_name:
          type: string
          maxLength: 200
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
    PairingCode:
      type: object
      required: [id, tenant_id, code, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        code:
          type: string
          description: The one-time plaintext pairing code. Shown ONCE; never stored.
        site_name:
          type: string
        tags:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    EnrollRequest:
      type: object
      required: [pairing_code, site_url, agent_public_key]
      properties:
        pairing_code:
          type: string
          maxLength: 128
        site_url:
          type: string
          format: uri
          maxLength: 2048
        agent_public_key:
          type: string
          description: The agent's own Ed25519 public key, base64 (std) encoded.
        name:
          type: string
          maxLength: 200
        wp_version:
          type: string
          maxLength: 32
        php_version:
          type: string
          maxLength: 32
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
    EnrollResponse:
      type: object
      required: [site_id, tenant_id, control_plane_public_key]
      properties:
        site_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        control_plane_public_key:
          type: string
          description: |
            The control plane's Ed25519 PUBLIC signing key (base64 std). The agent
            uses it to verify control-plane->agent commands.
    SiteEnrollmentCode:
      type: object
      description: |
        M21 — the once-shown enrollment code returned by the site-first create
        and the begin-re-enrollment endpoints. The plaintext code is never
        retrievable again.
      required: [site_id, enrollment_code, expires_at]
      properties:
        site_id:
          type: string
          format: uuid
        enrollment_code:
          type: string
          description: The single-use, site-bound pairing code (shown once).
        expires_at:
          type: string
          format: date-time
    SiteLifecycleReason:
      type: object
      description: Optional reason recorded in connection history + audit.
      properties:
        reason:
          type: string
          maxLength: 200
    AgentHeartbeat:
      type: object
      description: |
        M21 / ADR-039 — the light 60s heartbeat body the WordPress agent sends.
        All fields are optional and accepted best-effort: the beat is about
        liveness, not the payload. Forward-compatible (additive) so a future CP
        can render drift without a separate metadata pull.
      properties:
        site_id:
          type: string
          description: The enrolled site UUID (echoed for convenience; auth binds the real identity).
        ts:
          type: integer
          format: int64
          description: Unix seconds at send time.
        status:
          type: string
          description: Agent self-reported status, currently always "ok".
        wp_version:
          type: string
          maxLength: 32
        php_memory:
          type: string
          maxLength: 32
          description: PHP memory_limit (ini_get).
        plugin_versions:
          type: object
          additionalProperties:
            type: string
          description: Compact plugin-file => version map.
        installed_updates_count:
          type: integer
          description: Count of available plugin + theme + core updates (from cached transients).
        multisite:
          type: boolean
    AgentHeartbeatResult:
      type: object
      description: M21 — heartbeat acknowledgement with optional pending instructions.
      required: [ok]
      properties:
        ok:
          type: boolean
        instructions:
          type: array
          description: Pending agent instructions, e.g. ["revoke"].
          items:
            type: string
        revoke_token:
          type: string
          description: |
            Present with a `["revoke"]` instruction: a short-lived signed Ed25519
            JWT (aud=site_id, cmd="revoke") the agent MUST verify with the CP
            public key before any self-teardown (ADR-040 addendum). Fail-closed, an absent/invalid token must be a no-op.
    AgentDisconnect:
      type: object
      description: M21 — the signed last-will body.
      properties:
        site_id:
          type: string
          description: The enrolled site UUID (echoed for convenience; auth binds the real identity).
        reason:
          type: string
          maxLength: 64
          description: deactivated | uninstalled | user_initiated
    AgentMediaSyncBatch:
      type: object
      description: |
        ADR-043 — one page (≤200) of enumerated media attachments. Every page
        also carries the sync `job_id` so the CP can scope the enumeration and so
        the matching `/agent/v1/media/sync-finalize` call (sent only after a clean
        full enumeration) can reconcile offline deletions against this run's pages.
      required: [attachments]
      properties:
        job_id: { type: string }
        attachments:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              wp_attachment_id: { type: integer, format: int64 }
              title: { type: string }
              original_path: { type: string }
              original_url: { type: string }
              original_mime: { type: string }
              original_width: { type: integer, nullable: true }
              original_height: { type: integer, nullable: true }
              original_size_bytes: { type: integer, format: int64 }
              variant_count:
                type: integer
                description: 1 (full) plus generated sub-sizes.
              saved_bytes:
                type: integer
                format: int64
                description: >-
                  All-variant savings, re-reported at sync so already-optimized
                  rows heal.
    AgentMediaPresign:
      type: object
      description: ADR-043 — request presigned PUT URLs (presign) or signal sources uploaded (encode-ready).
      required: [job_id, variants]
      properties:
        job_id: { type: string }
        variants:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              name: { type: string }
              source_size: { type: integer, format: int64 }
              source_mime: { type: string }
    AgentMediaJobStatus:
      type: object
      description: ADR-043 — apply / delete-originals result reported to the CP.
      required: [job_id]
      properties:
        job_id: { type: string }
        applied_variants:
          type: array
          items: { type: string }
        sizes_unoptimized:
          type: object
          additionalProperties: { type: string }
        current_format: { type: string }
        current_size_bytes: { type: integer, format: int64 }
        bytes_before: { type: integer, format: int64, nullable: true }
        bytes_after: { type: integer, format: int64, nullable: true }
        saved_bytes:
          type: integer
          format: int64
          nullable: true
          description: >-
            All-variant savings (summed original-minus-optimized over every
            optimized variant). Drives the dashboard "Bytes saved" rollup.
        compression_level: { type: string }
        target_format: { type: string }
        rewrite_stats:
          type: object
          additionalProperties: true
        error: { type: string }
    AgentMediaRestoreStatus:
      type: object
      description: ADR-043 — restore result reported to the CP.
      required: [job_id, restored]
      properties:
        job_id: { type: string }
        restored: { type: boolean }
        error: { type: string }
    AgentMediaAssetDeleted:
      type: object
      description: |
        ADR-043 — the agent's `delete_attachment` hook fired: a WP attachment was
        deleted (wp-admin, programmatic, WP-CLI, or REST). The agent has already
        removed its own untracked originals from disk (the *.wpmgr-original.<ext>
        archive in replace mode, the original-ext twin in coexist mode); this
        signals the CP to reconcile the site_media_assets row. Best-effort from
        the agent — the sync sweep is the backstop.
      required: [wp_attachment_id]
      properties:
        wp_attachment_id: { type: integer, format: int64 }
    AgentMediaSyncFinalize:
      type: object
      description: |
        ADR-043 — a FULL paged media enumeration completed cleanly. Sent ONLY
        after every sync-batch page succeeded (a partial/errored run must NOT
        finalize — the blast-radius guard against a transiently-empty WP wiping
        the asset list). The CP marks any site_media_assets row NOT seen in this
        job's pages as deleted (offline-deletion reconciliation).
      required: [job_id]
      properties:
        job_id: { type: string }
    FontTranscodeRequest:
      type: object
      description: |
        M54 Phase 1 — body the agent POSTs to /agent/v1/fonts/transcode when
        it encounters a self-hosted font that needs WOFF2 encoding.
        The agent MUST NOT supply a storage key; the CP derives all keys
        server-side from the verified tenant identity + source_hash.
      required: [source_hash, source_size]
      properties:
        source_hash:
          type: string
          description: |
            Hex-encoded BLAKE3 content hash of the raw source font bytes.
            Must be exactly 64 lowercase hex characters. The CP validates this
            strictly before deriving any storage keys — malformed values are
            rejected with 422.
          pattern: "^[0-9a-f]{64}$"
          example: "abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
        source_size:
          type: integer
          format: int64
          description: Byte length of the source font. Must be > 0. Capped at 10 MiB.
          minimum: 1
        source_ext:
          type: string
          description: >
            File extension hint: "ttf", "otf", or "woff". Informational only;
            the CP detects the real format from the magic bytes on the uploaded
            object. Omit for WOFF2 (transcoding is a no-op for WOFF2).
          enum: [ttf, otf, woff]

    FontTranscodeResponse:
      type: object
      description: |
        M54 Phase 1 — CP's reply to a FontTranscodeRequest.
      required: [state]
      properties:
        state:
          type: string
          enum: [pending, ready, negative]
          description: |
            "pending"  — a job is enqueued or in flight. `source_put_url` is
                         present on the first-enqueue response; absent on polls.
            "ready"    — WOFF2 is available. `woff2_get_url` and `woff2_key`
                         are present.
            "negative" — permanent failure; serve the original font forever.
        source_put_url:
          type: string
          description: |
            Presigned S3 PUT URL (15-min TTL) for the raw source font bytes.
            Present ONLY when state=="pending" AND the job was just freshly
            enqueued. The agent MUST PUT the source bytes here (Content-Type:
            application/octet-stream) before the encoder can run.
            Absent on subsequent polls (source already uploaded).
        woff2_key:
          type: string
          description: |
            Server-derived object-storage key for the WOFF2 output.
            Present only when state=="ready". Informational — the agent MUST
            NOT presign this key itself; use woff2_get_url instead.
        woff2_get_url:
          type: string
          description: |
            Short-TTL presigned GET URL for the WOFF2 object, minted by the
            CP using the server-derived, GuardStorageKey-validated,
            tenant-scoped key. Present ONLY when state=="ready". The agent
            fetches the WOFF2 bytes from this URL. The agent MUST NOT
            presign or construct any storage key itself — that would
            reintroduce the path-traversal risk this design prevents.
        error_detail:
          type: string
          description: Short diagnostic string. Present only when state=="negative".

    AgentMetadata:
      type: object
      description: |
        The agent's metadata push. Every field is optional and tolerantly
        decoded (booleans and numbers are accepted as strings), so an older
        agent that omits any of them still syncs successfully.
      properties:
        wp_version:
          type: string
          maxLength: 32
        php_version:
          type: string
          maxLength: 32
        server_info:
          type: string
          maxLength: 512
        multisite:
          type: boolean
        active_theme:
          type: string
          maxLength: 200
        agent_version:
          type: string
          description: The WPMgr agent plugin version.
        age_recipient:
          type: string
          description: |
            The agent's per-site age PUBLIC recipient ("age1..."), stored so
            backups can be triggered without a separate registration call.
            Empty or missing leaves the stored recipient unchanged.
        user_count:
          type: integer
        admin_count:
          type: integer
        core_update:
          type: object
          nullable: true
          description: Present only when WordPress core has an update available.
          properties:
            new_version: { type: string }
            current_version: { type: string }
        host_flags:
          type: object
          nullable: true
          description: The agent's defined()-based hosting fingerprint.
          properties:
            is_pressable: { type: boolean }
            is_gridpane: { type: boolean }
            is_wpengine: { type: boolean }
            is_atomic: { type: boolean }
            is_kinsta: { type: boolean }
            is_flywheel: { type: boolean }
            is_runcloud: { type: boolean }
            is_cloudways: { type: boolean }
        disk:
          type: object
          nullable: true
          description: |
            Sampled disk usage in bytes. The wp-content and uploads walks are
            time-capped, so a field may be absent on a very large tree.
          properties:
            wp_content_bytes: { type: integer, format: int64 }
            uploads_bytes: { type: integer, format: int64 }
            free_bytes: { type: integer, format: int64 }
        agent_self_update:
          type: object
          nullable: true
          description: |
            The outcome of the agent's last self-update apply, replayed on the
            next metadata push. This is the only channel by which a FAILED
            apply reaches the control plane: the apply runs inside a cron
            request with no response to ride on.
          properties:
            status: { type: string }
            from_version: { type: string }
            to_version: { type: string }
            detail: { type: string }
            at:
              type: integer
              format: int64
              description: Unix timestamp the agent stamped the record with.
            apply_id:
              type: string
              description: |
                Opaque per-apply identifier the agent mints when it takes its
                apply and stamps into this record. Additive: absent from every
                agent that predates it. The control plane compares it whole
                against the apply id it carried on the arm command it sent, so
                a version movement can only be credited to the run that caused
                it rather than to some other event that happened to move the
                site's version.
            rung:
              type: string
              description: |
                Connection-release rung the apply actually ran on: fpm or
                litespeed released the response before the swap, the portable
                fallback held the caller's connection for its whole duration.
                Diagnostic only, it gates nothing. It exists so a fleet-wide
                read can tell which sites upgrade on an attached connection,
                which is what keeps that decision evidence-based. Absent from
                every agent before 0.61.110.
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/SiteComponent"
        themes:
          type: array
          items:
            $ref: "#/components/schemas/SiteComponent"
    SiteCreate:
      type: object
      required: [url, name]
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [pending, active, error, disabled]
          default: pending
        wp_version:
          type: string
          maxLength: 32
        php_version:
          type: string
          maxLength: 32
        tags:
          type: array
          description: M21 — optional tags applied to the pending site.
          items:
            type: string
            maxLength: 64
    SiteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Site"
    Role:
      type: string
      enum: [owner, admin, operator, viewer]
    User:
      type: object
      required: [id, email, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
        is_superadmin:
          type: boolean
        two_factor_enabled:
          type: boolean
          description: Whether the user has an active second factor (TOTP or WebAuthn) enrolled.
    Membership:
      type: object
      required: [user_id, tenant_id, role]
      properties:
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
    MembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    Me:
      type: object
      required: [user, memberships]
      properties:
        user:
          $ref: "#/components/schemas/User"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        active_tenant_id:
          type: string
          format: uuid
        scope:
          type: string
          description: "Principal scope: org for full members, site for collaborators/portal principals, empty for unauthenticated."
          enum: [org, site, ""]
        role:
          $ref: "#/components/schemas/PrincipalRole"
        portal:
          $ref: "#/components/schemas/MePortal"
        hosted:
          type: boolean
          description: >
            Whether this instance runs with hosted-billing entitlements
            (WPMGR_HOSTED) turned on. False on every self-hosted deployment and
            on any hosted instance before M16 Phase B billing ships. The
            frontend uses this to gate billing/plan UI.
        managed_storage_allowed:
          type: boolean
          description: >
            Whether the active tenant's plan currently permits routing a NEW
            backup to CP-managed storage (M16 Phase B). Always true on a
            self-hosted or hosted-billing-disabled instance, and true for
            every paid plan; false only for a free-plan tenant under
            WPMGR_HOSTED. This is a coarse, role-safe display signal for the
            operator-facing /destinations page (which any operator can view,
            unlike the owner-only /billing summary) — it is NOT the
            authoritative gate; the backup-run endpoints enforce the real
            check server-side and return 402 byo_destination_required when
            denied. Restoring/downloading an existing backup is never gated
            by this or any other check.
        desired_plan:
          type: string
          enum: [starter, agency, scale]
          description: >-
            The M16 Phase 0 "sign up into a plan" hint captured at
            registration (RegisterRequest.plan), single-use: present ONLY in
            the direct response to POST /auth/verify-email (read off the
            just-consumed verification token) or the first-run bootstrap
            response of POST /auth/register — never on GET /auth/me or any
            other Me-returning response. The frontend uses this to
            auto-start checkout right after the account is verified. Absent
            means no intent was captured (free signup, self-hosted instance,
            or a resend/login/OIDC path that never carries one).

    PrincipalRole:
      type: string
      description: >
        Effective role of the authenticated principal. Extends the member Role
        enum with "client" for portal principals. The existing Role enum
        (owner/admin/operator/viewer) is unchanged; this standalone enum is used
        only in Me responses.
      enum: [owner, admin, operator, viewer, client, ""]

    MePortal:
      type: object
      description: Portal branding context. Present only when role == "client".
      required: [client_id, client_name, agency_name]
      properties:
        client_id:
          type: string
          format: uuid
        client_name:
          type: string
        logo_url:
          type: string
          format: uri
        color:
          type: string
          description: "Hex color for portal accent (e.g. #0E7C8B). Web layer validates before applying."
        agency_name:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 200
        name:
          type: string
          maxLength: 200
        tenant_name:
          type: string
          maxLength: 200
        tenant_slug:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        plan:
          type: string
          enum: [starter, agency, scale]
          description: >-
            OPTIONAL "sign up into a plan" hint (M16 Phase 0, hosted billing
            only). Omit for an ordinary free-tier signup. Persisted against
            the email-verification token and surfaced back as
            Me.desired_plan once the account is verified (or immediately, on
            the first-run bootstrap path), so the frontend can auto-start
            checkout. A self-hosted instance, or any value that does not name
            a real paid tier, is silently treated as no intent — this field
            can never fail registration on its own.
    InviteRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 200
        name:
          type: string
          maxLength: 200
        role:
          $ref: "#/components/schemas/Role"
    ApiKey:
      type: object
      required: [id, tenant_id, name, prefix, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: "#/components/schemas/Role"
    ApiKeyCreated:
      type: object
      required: [api_key, token]
      properties:
        api_key:
          $ref: "#/components/schemas/ApiKey"
        token:
          type: string
          description: The full API key, shown only once at creation.
    SiteDestinationKind:
      type: string
      enum: [cp, local, s3_compat]
      description: |
        ADR-036 P1 destination backend type. `cp` is the WPMgr-managed bucket,
        `local` writes to wp-content/wpmgr-backups on the agent host, and
        `s3_compat` targets a customer-owned S3-compatible bucket.
    SiteDestination:
      type: object
      required:
        [id, tenant_id, site_id, kind, label, endpoint, region, bucket,
         path_prefix, access_key_id, has_secret, force_path_style, is_default,
         created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SiteDestinationKind"
        label:
          type: string
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        path_prefix:
          type: string
        access_key_id:
          type: string
        has_secret:
          type: boolean
          description: |
            True iff a secret key is stored. The encrypted bytes never cross
            the wire; the UI uses this to render a "Re-enter to save changes"
            hint on the secret_key field.
        force_path_style:
          type: boolean
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SiteDestinationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteDestination"
    SiteDestinationCreate:
      type: object
      required: [kind, label]
      properties:
        kind:
          $ref: "#/components/schemas/SiteDestinationKind"
        label:
          type: string
          minLength: 1
          maxLength: 200
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        path_prefix:
          type: string
        access_key_id:
          type: string
        secret_key:
          type: string
          description: |
            PLAINTEXT secret. The CP age-encrypts it at rest before persisting;
            it is NEVER stored in clear nor read back over the API.
        force_path_style:
          type: boolean
        is_default:
          type: boolean
    SiteDestinationUpdate:
      type: object
      properties:
        label:
          type: string
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        path_prefix:
          type: string
        access_key_id:
          type: string
        secret_key:
          type: string
          description: |
            Omit to keep the existing secret; non-empty replaces it.
        force_path_style:
          type: boolean
        is_default:
          type: boolean
    SiteDestinationTest:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/SiteDestinationKind"
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        path_prefix:
          type: string
        access_key_id:
          type: string
        secret_key:
          type: string
        force_path_style:
          type: boolean
    SiteDestinationTestResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
    AuditEntry:
      type: object
      required:
        [id, tenant_id, actor_type, actor_id, action, target_type, target_id, hash, prev_hash, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        actor_type:
          type: string
        actor_id:
          type: string
        actor_name:
          type: string
          nullable: true
          description: |
            Display name of the acting user (users.name), or the API key's
            label (api_keys.name) when the actor is an api_key, resolved
            server-side. Null for system events and for any actor row that no
            longer exists.
        actor_email:
          type: string
          nullable: true
          description: |
            Email of the acting user, resolved server-side. Null for
            api_key/system actors and for any actor row that no longer
            exists.
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
        prev_hash:
          type: string
        hash:
          type: string
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
    AuditVerify:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        broken_at:
          type: string
          format: uuid
    AuditRebaselineRequest:
      type: object
      properties:
        broken_at:
          type: string
          format: uuid
          description: >
            The `broken_at` id from a prior `verifyAudit` ok=false response
            that this re-baseline acknowledges. Optional — recorded in the
            `audit.integrity.rebaselined` event's metadata for forensic
            context only; it is never used to locate or alter any row.
    BillingSiteMeter:
      type: object
      required: [used, limit]
      properties:
        used:
          type: integer
          description: Current non-archived site count.
        limit:
          type: integer
          description: The effective (status-gated) site cap for this tenant's plan.
    BillingMeters:
      type: object
      required: [sites]
      properties:
        sites:
          $ref: "#/components/schemas/BillingSiteMeter"
    BillingSummary:
      type: object
      required: [plan, plan_status, meters, portal_available]
      properties:
        plan:
          type: string
          enum: [free, starter, agency, scale]
          description: >-
            The tenant's SUBSCRIBED tier (tenants.plan). A canceled
            subscription resolves this to "free" (non-destructive downgrade, see plan_status).
        plan_status:
          type: string
          enum: [none, trialing, active, past_due, canceled, paused, comped]
        current_period_end:
          type: string
          format: date-time
        provider:
          type: string
          description: >-
            The tenant's payment provider (e.g. "stripe"). Empty until the
            tenant's first checkout.
        grace_until:
          type: string
          format: date-time
          description: >-
            Set only while plan_status is past_due: paid limits continue
            until this instant, after which the tenant falls back to free.
        meters:
          $ref: "#/components/schemas/BillingMeters"
        portal_available:
          type: boolean
          description: >-
            True once the tenant has a payment-provider customer id — i.e.
            POST /billing/portal will succeed rather than 409.
    BillingCheckoutRequest:
      type: object
      required: [tier]
      properties:
        tier:
          type: string
          enum: [starter, agency, scale]
          description: >-
            The only caller-supplied PRICE selector. The server resolves this to
            a payment-provider price server-side; a request can never name a
            price directly.
        provider:
          type: string
          description: >-
            Preferred payment provider. Consulted only on a tenant's first-ever
            checkout: once a tenant is pinned to a provider that pinning always
            wins, so a returning customer can never split a subscription across
            two providers. An unknown name is rejected. Omit to use the
            instance default.
        currency:
          type: string
          description: >-
            Preferred billing currency, passed to the provider when it creates
            the checkout. Selects among the prices the server already knows for
            the requested tier; it can never set an amount. Omit for the
            provider default.
    BillingCheckoutResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Redirect the browser here to complete checkout.
    BillingPortalResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Redirect the browser here to the billing-management portal.
    # -------------------------------------------------------------------------
    # Superadmin billing-admin panel (admin-billing tag). The wire shapes below
    # transcribe apps/api/internal/admin/billing_dto.go field-for-field — that
    # file remains the source of truth for the Go struct tags; this is the
    # generated-client/conformance-test source of truth for everything else.
    # -------------------------------------------------------------------------
    AdminAccountTiles:
      type: object
      description: Instance-wide accounts-page header tiles — unaffected by the current list filter.
      required: [mrr_cents, active_subs, past_due_count, accounts_total]
      properties:
        mrr_cents: { type: integer, format: int64 }
        active_subs: { type: integer, format: int64 }
        past_due_count: { type: integer, format: int64 }
        accounts_total: { type: integer, format: int64 }
    AdminAccountListItem:
      type: object
      description: One row of GET /api/v1/admin/accounts.
      required:
        - tenant_id
        - org_name
        - org_slug
        - plan
        - plan_status
        - has_overrides
        - mrr_cents
        - sites_used
        - sites_cap
        - storage_used_bytes_approx
        - storage_cap_bytes
        - near_limit
        - created_at
      properties:
        tenant_id: { type: string, format: uuid }
        org_name: { type: string }
        org_slug: { type: string }
        owner_email: { type: string }
        plan:
          type: string
          enum: [free, starter, agency, scale]
        plan_status:
          type: string
          enum: [none, trialing, active, past_due, canceled, paused, comped]
        suspended_at: { type: string, format: date-time }
        has_overrides: { type: boolean }
        mrr_cents: { type: integer, format: int64 }
        sites_used: { type: integer }
        sites_cap: { type: integer }
        storage_used_bytes_approx:
          type: integer
          format: int64
          description: >-
            A v1 APPROXIMATION (SUM of backup_chunks.size for the tenant), does not yet distinguish CP-managed from BYO-storage
            destinations.
        storage_cap_bytes:
          type: integer
          format: int64
          description: 0 for the free tier (BYO-storage only; no CP-managed cap to approach).
        near_limit: { type: boolean }
        created_at: { type: string, format: date-time }
        last_activity: { type: string, format: date-time }
    AdminAccountsResponse:
      type: object
      description: The full GET /api/v1/admin/accounts body.
      required: [tiles, items, total, limit, offset]
      properties:
        tiles:
          $ref: "#/components/schemas/AdminAccountTiles"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccountListItem"
        total:
          type: integer
          description: Count AFTER filtering (before limit/offset).
        limit: { type: integer }
        offset: { type: integer }
    AdminAccountUsageMeter:
      type: object
      required: [used, cap]
      properties:
        used: { type: integer, format: int64 }
        cap: { type: integer, format: int64 }
    AdminAccountEntitlementValues:
      type: object
      description: >-
        Display-only reference values for the account-detail "what this plan
        includes" rows — not enforced anywhere.
      required:
        - probe_interval_floor_sec
        - backup_cadence_floor_seconds
        - incremental_backups
        - client_portal
      properties:
        probe_interval_floor_sec: { type: integer }
        backup_cadence_floor_seconds: { type: integer }
        incremental_backups: { type: boolean }
        client_portal: { type: boolean }
    AdminAccountUsage:
      type: object
      description: The account-detail usage-vs-limits block.
      required: [sites, storage_bytes_approx, seats_used, restore_volume_bytes_approx, entitlements]
      properties:
        sites:
          $ref: "#/components/schemas/AdminAccountUsageMeter"
        storage_bytes_approx:
          $ref: "#/components/schemas/AdminAccountUsageMeter"
        seats_used: { type: integer, format: int64 }
        restore_volume_bytes_approx:
          type: integer
          format: int64
          description: >-
            An APPROXIMATION: SUM of restore_runs' snapshot sizes for this
            tenant since the current billing period started (or the last 30
            days, when no period is on record yet).
        entitlements:
          $ref: "#/components/schemas/AdminAccountEntitlementValues"
    AdminAccountSubscription:
      type: object
      description: The account-detail subscription card.
      required: [cancel_at_period_end, stale]
      properties:
        provider: { type: string }
        provider_customer_id: { type: string }
        provider_subscription_id: { type: string }
        dashboard_url:
          type: string
          description: >-
            A Stripe-dashboard deep link. Empty when the provider is not
            Stripe, or there is no subscription id yet.
        current_period_end: { type: string, format: date-time }
        cancel_at_period_end: { type: boolean }
        grace_until: { type: string, format: date-time }
        comp_reason: { type: string }
        last_billing_event_at: { type: string, format: date-time }
        stale:
          type: boolean
          description: >-
            True when plan_status=="past_due" and last_billing_event_at is
            either unset or more than 25 hours old — a signal the webhook
            pipe may itself be stuck rather than the customer's card.
    AdminAccountTimelineEntry:
      type: object
      description: >-
        One merged row in the account-detail timeline (billing_events +
        audit_log admin.billing.*/billing.* actions), newest first.
      required: [source, occurred_at, kind]
      properties:
        source:
          type: string
          enum: [billing_event, audit]
        occurred_at: { type: string, format: date-time }
        kind:
          type: string
          description: billing_events.kind, or audit_log.action.
        actor_type: { type: string }
        actor_id: { type: string }
        metadata:
          type: object
          additionalProperties: true
    AdminAccountMember:
      type: object
      description: One row in the account-detail member roster.
      required: [id, email, name, role, status, email_verified, member_since]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        status: { type: string }
        email_verified: { type: boolean }
        last_login_at: { type: string, format: date-time }
        member_since: { type: string, format: date-time }
    AdminAccountSite:
      type: object
      description: One compact row in the account-detail site list.
      required: [id, url, connection_state, created_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        connection_state: { type: string }
        created_at: { type: string, format: date-time }
    AdminAccountDetail:
      type: object
      description: The full GET /api/v1/admin/accounts/{id} body.
      required:
        - tenant_id
        - org_name
        - org_slug
        - plan
        - plan_status
        - mrr_cents
        - created_at
        - usage
        - subscription
        - timeline
        - members
        - sites
      properties:
        tenant_id: { type: string, format: uuid }
        org_name: { type: string }
        org_slug: { type: string }
        owner_email: { type: string }
        plan:
          type: string
          enum: [free, starter, agency, scale]
        plan_status:
          type: string
          enum: [none, trialing, active, past_due, canceled, paused, comped]
        mrr_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        suspended_at: { type: string, format: date-time }
        suspended_reason: { type: string }
        usage:
          $ref: "#/components/schemas/AdminAccountUsage"
        subscription:
          $ref: "#/components/schemas/AdminAccountSubscription"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccountTimelineEntry"
        members:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccountMember"
        sites:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccountSite"
    AdminRevenueTiles:
      type: object
      description: The revenue-page header tiles.
      required:
        - mrr_cents
        - mrr_past_due_cents
        - active_subs
        - trialing_subs
        - past_due_count
        - past_due_at_risk_cents
        - new_this_month
        - canceled_this_month
      properties:
        mrr_cents: { type: integer, format: int64 }
        mrr_past_due_cents: { type: integer, format: int64 }
        active_subs: { type: integer, format: int64 }
        trialing_subs: { type: integer, format: int64 }
        past_due_count: { type: integer, format: int64 }
        past_due_at_risk_cents: { type: integer, format: int64 }
        new_this_month: { type: integer, format: int64 }
        canceled_this_month: { type: integer, format: int64 }
    AdminPlanDistributionRow:
      type: object
      description: One row of the revenue page's plan-distribution table.
      required: [plan, count, mrr_cents]
      properties:
        plan: { type: string }
        count: { type: integer, format: int64 }
        mrr_cents: { type: integer, format: int64 }
    AdminCompedRow:
      type: object
      description: >-
        The revenue page's "comped value" summary row — a hypothetical
        figure (what these tenants WOULD pay), never real revenue.
      required: [count, hypothetical_value_cents]
      properties:
        count: { type: integer, format: int64 }
        hypothetical_value_cents: { type: integer, format: int64 }
    AdminPastDueRow:
      type: object
      description: One row of the revenue page's past-due list.
      required: [tenant_id, org_name, org_slug, amount_cents, days_past_due]
      properties:
        tenant_id: { type: string, format: uuid }
        org_name: { type: string }
        org_slug: { type: string }
        owner_email: { type: string }
        amount_cents: { type: integer, format: int64 }
        days_past_due: { type: integer }
        grace_until: { type: string, format: date-time }
        last_payment_failed_at: { type: string, format: date-time }
    AdminRecentBillingEvent:
      type: object
      description: One row of the revenue page's recent-activity feed.
      required: [id, occurred_at, kind, provider]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        org_name: { type: string }
        org_slug: { type: string }
        tenant_id: { type: string, format: uuid }
        kind: { type: string }
        provider: { type: string }
    AdminRevenueResponse:
      type: object
      description: The full GET /api/v1/admin/revenue body.
      required: [tiles, plan_distribution, comped, past_due, recent_events]
      properties:
        tiles:
          $ref: "#/components/schemas/AdminRevenueTiles"
        plan_distribution:
          type: array
          items:
            $ref: "#/components/schemas/AdminPlanDistributionRow"
        comped:
          $ref: "#/components/schemas/AdminCompedRow"
        past_due:
          type: array
          items:
            $ref: "#/components/schemas/AdminPastDueRow"
        recent_events:
          type: array
          items:
            $ref: "#/components/schemas/AdminRecentBillingEvent"
        last_webhook_received_at: { type: string, format: date-time }
    AdminBillingAck:
      type: object
      description: Shared success acknowledgement for the admin-billing manual controls.
      required: [ok]
      properties:
        ok: { type: boolean }
    AdminCompAccountRequest:
      type: object
      required: [tier, reason]
      properties:
        tier:
          type: string
          enum: [free, starter, agency, scale]
        reason: { type: string }
    AdminReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    AdminSetOverridesRequest:
      type: object
      description: >-
        Each of sites/storage_gb/seats is a signed delta on top of the
        tenant's current plan's ladder base. An omitted key leaves that
        limit untouched; `null` (or `0`) clears it.
      required: [reason]
      properties:
        sites: { type: integer, nullable: true }
        storage_gb: { type: integer, nullable: true }
        seats: { type: integer, nullable: true }
        reason: { type: string }
    AdminExtendGraceRequest:
      type: object
      required: [until, reason]
      properties:
        until:
          type: string
          format: date-time
        reason: { type: string }
    AdminForceStateRequest:
      type: object
      required: [plan, plan_status, reason]
      properties:
        plan:
          type: string
          enum: [free, starter, agency, scale]
        plan_status:
          type: string
          enum: [none, trialing, active, past_due, canceled, paused, comped]
        reason: { type: string }
    UpdateItem:
      type: object
      required: [type]
      description: One thing to update on a site.
      properties:
        type:
          type: string
          enum: [plugin, theme, core, agent]
          description: |
            What to update. `agent` upgrades the WPMgr agent itself over its own
            dedicated signed channel and behaves differently from the others: it
            must be the ONLY item in its run (its staged-wave rollout is defined
            over the whole run), it takes no slug and no version pin, and it has
            no dry run. Success is established only when the upgraded agent
            reports its new version back; a scheduled acknowledgement is not
            success. The channel is off unless the control plane enables it.
        slug:
          type: string
          maxLength: 200
          description: Plugin/theme slug. Ignored (forced to "core") when type is core; must be omitted when type is agent.
        version:
          type: string
          maxLength: 64
          description: |
            Desired version, "latest" or an explicit pin. Defaults to latest.
            A pin is REJECTED when type is agent: the agent's release manifest
            only ever points at the published build and the agent refuses to
            install an older one, so a pin could not be honoured.
    UpdateRunCreate:
      type: object
      required: [items]
      description: |
        Request to start a bulk update run. Provide EITHER site_ids OR tag to
        select target sites (not both).
      properties:
        site_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Explicit target site IDs.
        tag:
          type: string
          maxLength: 64
          description: Target all enrolled sites carrying this tag.
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/UpdateItem"
        dry_run:
          type: boolean
          default: false
          description: When true, do not mutate sites; report what would change.
        schedule_at:
          type: string
          format: date-time
          description: Optional time to run; omitted/now means immediately.
    UpdateTask:
      type: object
      # retryable/retry_class are REQUIRED on purpose: they are the server's
      # answer to "may this be retried, and what happened to it", and a client
      # that had to cope with their absence would need a fallback rule, which is
      # exactly the client-side guessing this pair exists to delete.
      required: [id, run_id, tenant_id, site_id, target_type, target_slug, status, retryable, retry_class, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        site_name:
          type: string
          description: |
            The site's display name, resolved by the server on the run DETAIL
            read (GET /api/v1/updates/{runId}). Present so a client never has to
            join a task list against a separately-fetched site list to say which
            site a task belongs to: every site list in this API is paginated, so
            that join silently loses site identity on any run wider than one
            page, for display AND for selection. Empty only if the site row
            could not be read.
        target_type:
          type: string
          enum: [plugin, theme, core, agent]
        target_slug:
          type: string
        desired_version:
          type: string
        from_version:
          type: string
        to_version:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed, rolled_back, skipped, cancelled]
          description: |
            `cancelled` means the task was never dispatched because its run was
            halted first; nothing was sent to the site. Only agent self-update
            runs can halt.
        retryable:
          type: boolean
          description: |
            Whether this task may be named in a retry request
            (POST /api/v1/updates/runs/{id}/retry). Computed by the server from
            the task's own terminal-state predicate, so the affordance a client
            offers and the decision the server makes cannot disagree. A client
            MUST NOT infer this from `detail` or `error`: those carry
            agent-authored prose that no client contract covers.
        retry_class:
          type: string
          enum: [never_ran, failed, reverted, skipped, not_applicable]
          description: |
            What happened to this task, on the axis a retry decision turns on.
            The server computes it; the client renders it.

            * `never_ran` - terminal, but nothing was ever sent to the site
              (today: `cancelled`, collateral of a halted run). Nothing on the
              site changed, so this is the lowest-risk task to retry.
            * `failed` - the site was contacted and the update did not succeed.
            * `reverted` - the update applied and was then rolled back, so a
              retry walks the identical path and may reproduce the identical
              break.
            * `skipped` - the control plane declined this target (already up to
              date, site busy, agent build not upgradeable by this channel).
              Usually correct, but a stale WordPress transient can report
              "already current" wrongly, so it stays selectable.
            * `not_applicable` - `succeeded` (retrying re-touches a working
              site for nothing) or not finished yet (`pending`/`running`).

            The intended client default selection is `failed` + `never_ran`:
            both mean "this never succeeded", and `never_ran` additionally means
            "and nothing was attempted". `reverted` and `skipped` are
            selectable but never default-on. `not_applicable` is never
            selectable.
        detail:
          type: string
        error:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateRun:
      type: object
      required: [id, tenant_id, status, dry_run, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, halted]
          description: |
            `halted` is terminal and specific to an agent self-update run: a
            staged-rollout wave failed to prove itself, so every task the run
            had not already dispatched was cancelled. It is distinct from
            `completed`, which would hide the fact that the run was stopped.
        dry_run:
          type: boolean
        scheduled_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        task_count:
          type: integer
          format: int64
          description: Total number of tasks in this run. Populated on list responses; absent on the detail GET (tasks array is returned instead).
        succeeded_count:
          type: integer
          format: int64
          description: Number of tasks that reached `succeeded` status.
        failed_count:
          type: integer
          format: int64
          description: Number of tasks that reached `failed` or `rolled_back` status.
        site_count:
          type: integer
          format: int64
          description: Number of distinct sites targeted by this run.
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/UpdateTask"
    UpdateRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UpdateRun"
    UpdateRunRetryRequest:
      type: object
      required: [task_ids]
      description: |
        The tasks to retry, named explicitly. There is no implicit server-side
        default set: the client already knows every task's `retry_class` from
        the run detail response, so it names the ones it means. A second policy
        on the server could disagree with the checkboxes the operator saw.
      properties:
        task_ids:
          type: array
          minItems: 1
          maxItems: 5000
          description: |
            Task ids from the run being retried. Repeats are collapsed, so
            `requested` in the response counts DISTINCT ids. An id that is not a
            task of this run is reported in `excluded` rather than rejecting the
            whole request.
          items:
            type: string
            format: uuid
    UpdateRunRetryExclusion:
      type: object
      required: [task_id, reason, message]
      description: One requested task that produced no work, and why.
      properties:
        task_id:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - not_in_run
            - not_retryable
            - site_not_found
            - site_not_enrolled
            - agent_current
            - agent_ineligible
            - agent_version_unknown
            - target_in_flight
            - duplicate_target
          description: |
            The machine value, stable and safe to group or count on.

            * `not_in_run` - the id is not a task of this run.
            * `not_retryable` - the task succeeded, or has not finished yet.
            * `site_not_found` - the site no longer resolves.
            * `site_not_enrolled` - the site is no longer enrolled, so no signed
              command can be delivered to it.
            * `agent_current` - the site already runs the published agent build.
              This is what fires when the release was reverted mid-incident.
            * `agent_ineligible` - the site runs the plugin-directory build,
              which has no self-updater.
            * `agent_version_unknown` - a version could not be compared, and an
              unreadable version must never become an upgrade.
            * `target_in_flight` - this (site, target) already has a pending or
              running task in another run.
            * `duplicate_target` - another selected task already retries the
              same (site, target).
        message:
          type: string
          description: |
            The server-authored sentence for this exclusion, including the
            specifics (which versions, which status). Rendered as-is; a client
            does not need its own copy table to explain an exclusion.
    UpdateRunRetryResult:
      type: object
      required: [requested, created, excluded]
      description: |
        Accounts for every requested task: `created` + `len(excluded)` always
        equals `requested`. If `created` is lower than `requested`, the
        difference is fully itemised in `excluded` and MUST be surfaced to the
        operator; a partial commit that looks like a complete one is the failure
        mode this shape exists to prevent.
      properties:
        run_id:
          type: string
          format: uuid
          description: |
            The NEW run. Absent when nothing was created (every requested task
            was excluded), which is a legitimate outcome and not an error.
        requested:
          type: integer
          description: Number of DISTINCT task ids in the request.
        created:
          type: integer
          description: Number of tasks in the new run.
        excluded:
          type: array
          description: Every requested task that produced no task in the new run.
          items:
            $ref: "#/components/schemas/UpdateRunRetryExclusion"
        warning:
          type: string
          description: |
            Set when the run exists but a best-effort step after the commit did
            not go to plan (today: a background job could not be scheduled, so
            some tasks sit pending until the reaper terminalises them). The run
            and its tasks are real and visible; surface this alongside them
            rather than treating the retry as failed.
    UpdateEvent:
      type: object
      description: One task-status transition streamed over SSE.
      required: [run_id, task_id, site_id, target_type, target_slug, status, run_status]
      properties:
        run_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        target_type:
          type: string
          enum: [plugin, theme, core, agent]
        target_slug:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed, rolled_back, skipped, cancelled]
        from_version:
          type: string
        to_version:
          type: string
        detail:
          type: string
        run_status:
          type: string
          enum: [pending, running, completed, halted]
    BackupEvent:
      type: object
      description: |
        One snapshot-progress transition streamed over SSE. Status mirrors the
        parent snapshot's status at publish time so a subscriber can detect a
        terminal state (completed/failed) and close the EventSource. Phase
        values come from the closed `allowedProgressPhases` set on the CP.
      required: [snapshot_id, phase, status, ts]
      properties:
        snapshot_id:
          type: string
          format: uuid
        phase:
          type: string
          # Closed set matching TaskRunner::PHASE_* constants and CP allowedProgressPhases.
          # The legacy phases compressing_files / encrypting / uploading were retired with
          # the phpbu pipeline (ADR-033); encrypting_uploading is the single unified phase.
          enum:
            - queued
            - dumping_db
            - archiving_files
            - encrypting_uploading
            - submitting_manifest
            - completed
            - failed
            - stalled
            - resumed
        phase_detail:
          type: object
          additionalProperties: true
          description: Pass-through of the agent's POST /progress payload (e.g. chunk counters).
        status:
          type: string
          enum: [pending, running, completed, failed]
        ts:
          type: string
          format: date-time
    BackupCreate:
      type: object
      description: Request to start a backup of a site.
      properties:
        kind:
          type: string
          enum: [files, db, full]
          default: full
          description: What to back up. Defaults to full (files + database).
    BackupSnapshot:
      type: object
      required: [id, tenant_id, site_id, kind, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        kind:
          type: string
          enum: [files, db, full]
        status:
          type: string
          enum: [pending, running, completed, failed]
        age_recipient:
          type: string
          description: |
            The age PUBLIC recipient the chunks were encrypted to (provenance).
            NEVER a private key; the control plane cannot decrypt backups.
        total_size:
          type: integer
          format: int64
        chunk_count:
          type: integer
          format: int64
        archived:
          type: boolean
          description: Kept by the monthly-archive retention rule.
        error:
          type: string
        progress:
          type: object
          additionalProperties: true
          description: |
            M5.6 / ADR-032 phpbu runner progress. Empty `{}` until the runner posts
            its first phase. Shape:
              { "phase": "uploading", "phase_detail": {"chunks_done": 17, "chunks_total": 42, ...} }
            Phases form a closed set (see backup.allowedProgressPhases on the CP).
        progress_updated_at:
          type: string
          format: date-time
          description: |
            Server timestamp of the last progress POST from the runner. Used by
            the CP's two-tier watchdog (soft stall stamps stalled_at below; hard
            stall fails the run) and by the frontend to detect a silent runner.
        stalled_at:
          type: string
          format: date-time
          description: |
            Set by the CP watchdog when a running backup has gone quiet past the
            soft threshold but is not yet failed. Cleared on the next proof of
            life (a presign, manifest submit, or progress POST). Drives the
            "taking longer than expected" hint; null means healthy.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        is_incremental:
          type: boolean
          description: |
            ADR-048 incremental backup. True if this snapshot only stores files
            changed since its parent; false for full-base snapshots and all
            pre-m44 rows.
        generation:
          type: integer
          description: |
            Position of this snapshot within its incremental chain. 0 is the
            full base; 1+ are successive incrementals.
        chain_id:
          type: string
          format: uuid
          description: Groups a full base and its incrementals into one chain. Null for legacy/full-base rows.
        parent_snapshot_id:
          type: string
          format: uuid
          description: The snapshot this incremental was diffed against. Null for full-base rows.
        base_snapshot_id:
          type: string
          format: uuid
          description: The full-base snapshot at the root of this chain. Null for legacy/full-base rows.
        locked:
          type: boolean
          description: |
            Track C (m49). When true the retention GC will never auto-prune this
            snapshot. Unlock via DELETE /backups/{snapshotId}/lock to restore
            normal GC eligibility.
    BackupSnapshotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupSnapshot"
    BackupFleetList:
      type: object
      required: [items]
      description: Paginated fleet snapshot list.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupSnapshot"
        next_offset:
          type: integer
          format: int64
          nullable: true
          description: Offset to pass for the next page; null when no further pages.
    BackupHealthItem:
      type: object
      required: [site_id, site_name, site_url, status, in_flight_count, latest_size_bytes]
      properties:
        site_id:
          type: string
          format: uuid
        site_name:
          type: string
        site_url:
          type: string
        status:
          type: string
          enum: [unprotected, failed, stale, in_flight, protected]
        last_completed_at:
          type: string
          format: date-time
        last_failed_at:
          type: string
          format: date-time
        latest_size_bytes:
          type: integer
          format: int64
        in_flight_count:
          type: integer
          format: int64
        schedule_cadence:
          type: string
        next_run_at:
          type: string
          format: date-time
    BackupHealthList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupHealthItem"
    BackupManifestEntry:
      type: object
      required: [path, entry_kind, size, chunk_count]
      description: One file (or db dump) in a snapshot, summarized.
      properties:
        path:
          type: string
        entry_kind:
          type: string
          # file = legacy lumped wp-content part; plugin/theme/upload/wp-content
          # are the Track-5 per-component archive parts; db = the SQL dump. The
          # ADR-051 archive-delta bookkeeping kinds (files-list, tombstones) are
          # internal and never surfaced in this operator-facing detail.
          enum: [file, db, plugin, theme, upload, wp-content]
        table_name:
          type: string
          description: Set for db entries (partial restore-by-table).
        size:
          type: integer
          format: int64
        mode:
          type: integer
          format: int32
        chunk_count:
          type: integer
          format: int32
          description: Number of ordered ciphertext chunks reassembling the path.
    BackupSnapshotDetail:
      type: object
      required: [snapshot, entries]
      properties:
        snapshot:
          $ref: "#/components/schemas/BackupSnapshot"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/BackupManifestEntry"
    BulkDeleteBackupsRequest:
      type: object
      required: [ids]
      description: |
        Chain-aware bulk delete request (issue #115). Every requested id is
        processed independently — a locked, in-flight, dependent, or
        actively-restoring snapshot in the batch is reported as a skipped
        result row rather than aborting the whole request.
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
          description: |
            Snapshot IDs to delete. 1-100 unique ids per call; duplicates are
            silently deduplicated before the count is checked. Empty (after
            dedup) or over 100 is rejected with 400.
        dry_run:
          type: boolean
          default: false
          description: When true, compute the plan but write nothing (no deletes, no GC, no audit).
    BulkDeleteBackupsResultItem:
      type: object
      required: [id, outcome]
      properties:
        id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [deleted, skipped]
          description: |
            "deleted" — the snapshot was removed (or, in dry_run, WOULD be
            removed). "skipped" — the snapshot was left in place; see code.
        code:
          type: string
          nullable: true
          enum:
            [
              snapshot_not_found,
              snapshot_in_progress,
              snapshot_locked,
              chain_has_dependents,
              restore_in_progress,
            ]
          description: Null when outcome=deleted; the skip reason otherwise.
        message:
          type: string
          nullable: true
          description: Human-readable explanation of code; null when outcome=deleted.
    BulkDeleteBackupsCounts:
      type: object
      required: [requested, deleted, skipped]
      properties:
        requested:
          type: integer
          format: int64
        deleted:
          type: integer
          format: int64
        skipped:
          type: integer
          format: int64
    BulkDeleteBackupsResponse:
      type: object
      required: [dry_run, counts, results, reclaimed_bytes_estimate]
      properties:
        dry_run:
          type: boolean
        counts:
          $ref: "#/components/schemas/BulkDeleteBackupsCounts"
        results:
          type: array
          items:
            $ref: "#/components/schemas/BulkDeleteBackupsResultItem"
        reclaimed_bytes_estimate:
          type: integer
          format: int64
          description: |
            Sum of total_size over deleted (or, in dry_run, would-be-deleted)
            rows. An estimate only — actual space is freed asynchronously by
            the next retention GC sweep.
    RestoreCreate:
      type: object
      description: |
        Restore selection. Omit both arrays (or set full=true) for a full
        restore; provide paths for partial file restore, or db_tables for partial
        db restore. `components` further restricts the operation to specific
        backup components ("files" and/or "db"); see field doc below.
      properties:
        full:
          type: boolean
          default: false
        paths:
          type: array
          items:
            type: string
          description: Site-relative file paths to restore.
        db_tables:
          type: array
          items:
            type: string
          description: Database table names to restore.
        components:
          type: array
          description: >
            Which backup components to restore. When omitted, restores all
            components in the snapshot. Valid values:

              - "files"      — broad-strokes alias for ALL file components
                               (plugin + theme + upload + wp-content). Use
                               this for "restore everything except the DB".
              - "db"         — the database dump.
              - "plugin"     — wp-content/plugins/* only (Track 5).
              - "theme"      — wp-content/themes/* only (Track 5).
              - "upload"     — wp-content/uploads/* only (Track 5).
              - "wp-content" — everything ELSE under wp-content (mu-plugins,
                               languages, drop-ins, custom dirs — NOT
                               plugins/themes/uploads) (Track 5).

            Examples — to restore only the database, pass ["db"]. To restore
            only files, pass ["files"]. To restore both, pass ["files","db"]
            or omit. To restore only plugins, pass ["plugin"]. To restore
            plugins + uploads, pass ["plugin","upload"].
          items:
            type: string
            enum: [files, db, plugin, theme, upload, wp-content]
          uniqueItems: true
        keep_old_files:
          type: boolean
          description: >
            When true, the agent keeps the pre-restore wp-content tree at
            .wpmgr-old-files-<id>/ for 24 hours as a manual rollback affordance.
            When false (default), the agent cleans it up immediately after a
            successful restore.
          default: false
        target_site_url:
          type: string
          format: uri
          nullable: true
          description: >
            When set, the agent will rewrite `siteurl` and `home` references
            from the snapshot's source URLs to this target. When unset, the
            agent uses the current site's URL (no-op when restoring to the
            same environment). Required for cross-environment restores
            (dev->prod, staging->prod). The control plane derives this from
            the destination Site.URL when the restore is dispatched, so
            callers typically don't need to set it.
    SqlInspection:
      type: object
      description: |
        Structured projection of a backup snapshot's SQL dump. Produced either
        by the agent at backup time (preferred; "source": "agent") or by the
        control plane's legacy streaming parser (fallback; "source":
        "cp-legacy"). `truncated: true` indicates the parser hit its CPU/time
        budget; tables/totals may be incomplete.
      required: [schema_version, source, is_wordpress, tables, generated_at]
      properties:
        schema_version:
          type: integer
          description: Report wire-shape version; bump when the JSON shape changes.
        dump_bytes:
          type: integer
          format: int64
          description: Total plaintext bytes scanned from the dump.
        charset:
          type: string
          description: Connection-level charset from SET NAMES (e.g. utf8mb4).
        collation:
          type: string
          description: Default collation declared in CREATE TABLE trailers, if any.
        table_prefix:
          type: string
          description: |
            Most common table-name prefix (chars up to the first underscore);
            empty when no consistent prefix could be determined.
        wp_version:
          type: string
          nullable: true
          description: WordPress db_version from wp_options, when detectable.
        siteurl:
          type: string
          nullable: true
          description: WordPress siteurl from wp_options, when detectable.
        home:
          type: string
          nullable: true
          description: WordPress home from wp_options, when detectable.
        is_wordpress:
          type: boolean
          description: True when a {prefix}options table is present in the dump.
        truncated:
          type: boolean
          description: True when the parser hit its budget before finishing.
        source:
          type: string
          enum: [agent, cp-legacy]
          description: |
            "agent" — the JSON was produced by the agent at backup time and
            stored as a snapshot artifact. "cp-legacy" — the CP streamed the
            dump artifact through its own parser as a fallback.
        parser_warnings:
          type: array
          items:
            type: string
          description: Non-fatal scanner warnings (oversized rows, regex anomalies).
        tables:
          type: array
          description: Per-table inventory; row/byte estimates are best-effort.
          items:
            type: object
            required: [name, rows_estimate]
            properties:
              name:
                type: string
              rows_estimate:
                type: integer
                format: int64
              bytes_estimate:
                type: integer
                format: int64
              auto_increment:
                type: integer
                format: int64
                nullable: true
              charset:
                type: string
              has_fk:
                type: boolean
        generated_at:
          type: string
          format: date-time
          description: When the report was assembled (agent or CP wall clock).
    BackupSchedule:
      type: object
      required: [id, tenant_id, site_id, cadence, kind, enabled, retention_days, monthly_archive_keep, run_hour, run_minute, keep_last, incremental_enabled, timezone, gmt_offset, next_run_at, next_runs, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        cadence:
          type: string
          enum: [hourly, every_n_hours, daily, weekly, monthly]
        kind:
          type: string
          enum: [files, db, full]
        enabled:
          type: boolean
        retention_days:
          type: integer
          format: int32
        monthly_archive_keep:
          type: integer
          format: int32
        run_hour:
          type: integer
          format: int32
          minimum: 0
          maximum: 23
          description: Hour of day (0-23) in the site timezone at which the backup fires.
        run_minute:
          type: integer
          format: int32
          minimum: 0
          maximum: 59
          description: Minute (0-59) within the hour at which the backup fires.
        day_of_week:
          type: integer
          format: int32
          minimum: 0
          maximum: 6
          nullable: true
          description: "Day of week (0=Sun..6=Sat) for weekly cadence; null otherwise."
        day_of_month:
          type: integer
          format: int32
          minimum: 1
          maximum: 28
          nullable: true
          description: "Day of month (1-28, capped) for monthly cadence; null otherwise."
        frequency_hours:
          type: integer
          format: int32
          minimum: 1
          maximum: 24
          nullable: true
          description: "Interval in hours for every_n_hours cadence; null otherwise."
        keep_last:
          type: integer
          format: int32
          description: Minimum number of snapshots to retain regardless of age.
        incremental_enabled:
          type: boolean
          description: "Beta. When true, scheduled and run-now backups for this site may take incremental snapshots (the control plane auto-decides full base vs increment per ADR-048)."
        base_window_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          nullable: true
          description: "Optional override of the default incremental base window (7 days). null means use the default."
        timezone:
          type: string
          description: "Read-only. IANA timezone name (or fixed-offset label) resolved from the site's WordPress timezone. Used by the UI to display run times."
        gmt_offset:
          type: number
          description: "Read-only. GMT offset in hours (e.g. 5.5 for +05:30) from the site's WordPress settings."
        next_run_at:
          type: string
          format: date-time
        next_runs:
          type: array
          description: "Read-only. The next ~3 scheduled occurrence times (RFC 3339 UTC) for the upcoming-preview strip in the UI."
          items:
            type: string
            format: date-time
        last_run_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BackupScheduleUpdate:
      type: object
      description: Create or update a site's backup schedule (daily default).
      properties:
        cadence:
          type: string
          enum: [hourly, every_n_hours, daily, weekly, monthly]
          default: daily
        kind:
          type: string
          enum: [files, db, full]
          default: full
        enabled:
          type: boolean
          default: true
        retention_days:
          type: integer
          format: int32
          description: Rolling-window retention in days. Defaults to the server policy.
        monthly_archive_keep:
          type: integer
          format: int32
          description: Number of monthly-archive snapshots to keep beyond the window.
        run_hour:
          type: integer
          format: int32
          minimum: 0
          maximum: 23
          description: Hour of day (0-23) in the site timezone at which the backup fires.
        run_minute:
          type: integer
          format: int32
          minimum: 0
          maximum: 59
          description: Minute (0-59) within the hour at which the backup fires.
        day_of_week:
          type: integer
          format: int32
          minimum: 0
          maximum: 6
          nullable: true
          description: "Day of week (0=Sun..6=Sat) for weekly cadence; null otherwise."
        day_of_month:
          type: integer
          format: int32
          minimum: 1
          maximum: 28
          nullable: true
          description: "Day of month (1-28, capped) for monthly cadence; null otherwise."
        frequency_hours:
          type: integer
          format: int32
          minimum: 1
          maximum: 24
          nullable: true
          description: "Interval in hours for every_n_hours cadence; null otherwise."
        keep_last:
          type: integer
          format: int32
          description: Minimum number of snapshots to retain regardless of age.
        incremental_enabled:
          type: boolean
          default: false
          description: "Beta. Take incremental backups on this schedule (and via run-now). The control plane auto-decides full base vs increment."
        base_window_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          nullable: true
          description: "Optional override of the default incremental base window (7 days). Omit/null to use the default."
    SiteBackupSettingsContents:
      type: object
      description: |
        Track-A backup scope/exclusion settings for a site (m50). A 404 means
        no settings row exists — safe defaults apply (all components, no exclusions).
      required: [site_id, updated_at]
      properties:
        site_id:
          type: string
          format: uuid
        backup_components:
          type: array
          items:
            type: string
            enum: [plugin, theme, upload, wp-content, db, core]
          nullable: true
          description: |
            Subset of archive components to include. Null/absent means all components (full backup).
            Singular vocabulary matching manifest entry_kind:
            "plugin" (wp-content/plugins/*), "theme" (wp-content/themes/*),
            "upload" (wp-content/uploads/*), "wp-content" (catch-all), "db" (database dump),
            "core" (ABSPATH: wp-admin, wp-includes, root PHP files).
          uniqueItems: true
        include_core:
          type: boolean
          default: false
          description: When true, the WordPress core source root (ABSPATH) is archived.
        exclude_paths:
          type: array
          items:
            type: string
          maxItems: 100
          nullable: true
          description: Path-segment names to exclude from file archiving.
        exclude_extensions:
          type: array
          items:
            type: string
          maxItems: 50
          nullable: true
          description: File extensions to skip (without leading dot, case-insensitive).
        exclude_file_size_mb:
          type: integer
          format: int32
          minimum: 1
          maximum: 102400
          nullable: true
          description: Skip files strictly larger than this value (MiB). 0/null = no filter.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SiteBackupSettingsContentsUpdate:
      type: object
      description: Update the Track-A backup scope/exclusion settings for a site.
      properties:
        backup_components:
          type: array
          items:
            type: string
            enum: [plugin, theme, upload, wp-content, db, core]
          nullable: true
          description: Subset of archive components. Null/absent = all components (full backup).
        include_core:
          type: boolean
        exclude_paths:
          type: array
          items:
            type: string
          maxItems: 100
          nullable: true
        exclude_extensions:
          type: array
          items:
            type: string
          maxItems: 50
          nullable: true
        exclude_file_size_mb:
          type: integer
          format: int32
          minimum: 0
          maximum: 102400
          nullable: true
          description: 0 or null clears the filter.
    SiteBackupSettingsNotifications:
      type: object
      description: |
        Track-B notification settings for a site (m50). A 404 means no settings
        row exists — safe defaults apply (never/empty). Fires for BOTH manual
        and scheduled backup completions/failures.
      required: [site_id, notify_on_completion, updated_at]
      properties:
        site_id:
          type: string
          format: uuid
        notify_on_completion:
          type: string
          enum: [always, on_failure, never]
          default: never
          description: |
            When to send a backup-event email. Fires for both manual and
            scheduled runs. "always" = every completion or failure;
            "on_failure" = only on failure; "never" = no email (default).
        notify_recipients:
          type: array
          items:
            type: string
            format: email
          maxItems: 20
          description: Email addresses to notify. Max 20.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SiteBackupSettingsNotificationsUpdate:
      type: object
      description: Update the Track-B notification settings for a site.
      properties:
        notify_on_completion:
          type: string
          enum: [always, on_failure, never]
        notify_recipients:
          type: array
          items:
            type: string
            format: email
          maxItems: 20
    RestoreRun:
      type: object
      description: |
        A single restore attempt, created when the operator calls
        `POST /backups/{snapshotId}/restore`. The run advances through
        phases as the agent executes the restore; `current_phase` reflects
        the latest phase received from the agent. `triggered_by_email` and
        `triggered_by_name` are resolved from the tenant user directory
        when the actor is a known user; they are `null` for API-key or
        system-triggered restores.
      required:
        - id
        - site_id
        - snapshot_id
        - mode
        - components
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique restore run ID.
        site_id:
          type: string
          format: uuid
          description: ID of the site being restored.
        snapshot_id:
          type: string
          format: uuid
          description: ID of the backup snapshot used as the restore source.
        mode:
          type: string
          description: |
            Restore mode. `full` means all components were requested;
            `partial` means a subset was specified.
          enum: [full, partial]
        components:
          type: array
          description: Which backup components were restored (e.g. `files`, `db`).
          items:
            type: string
            enum: [files, db]
        status:
          type: string
          description: Current status of the restore run.
          enum: [queued, running, completed, failed, rolled_back]
        current_phase:
          type: string
          description: The last phase reported by the agent runner (absent when queued).
        error:
          type: string
          description: Human-readable error message when status is `failed` or `rolled_back`.
        triggered_by:
          type: string
          description: Raw actor identifier (user UUID or `api-key:<id>` or `system`).
        triggered_by_email:
          type: string
          format: email
          nullable: true
          description: Email of the triggering user (null for non-user actors or unresolvable IDs).
        triggered_by_name:
          type: string
          nullable: true
          description: Display name of the triggering user (null for non-user actors or unresolvable IDs).
        created_at:
          type: string
          format: date-time
          description: When the restore run was created.
        started_at:
          type: string
          format: date-time
          description: When the agent began executing the restore (absent until running).
        finished_at:
          type: string
          format: date-time
          description: When the restore run reached a terminal state.
    RestoreRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RestoreRun"
    RestoreRunEvent:
      type: object
      description: A single phase-log entry emitted by the restore engine.
      required: [id, phase, status, occurred_at]
      properties:
        id:
          type: integer
          format: int64
          description: Monotonically increasing event ID (use as cursor for `?after=`).
        phase:
          type: string
          description: The restore phase that produced this event.
        status:
          type: string
          description: Outcome of the phase at the time of this event.
          enum: [started, completed, failed]
        message:
          type: string
          description: Optional human-readable detail from the agent.
        occurred_at:
          type: string
          format: date-time
          description: Wall-clock time at which the event was recorded.
    RestoreRunEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RestoreRunEvent"
    ScheduleRun:
      type: object
      description: |
        A single scheduled-backup fire. Pre-inserted as `scheduled` before
        the run window opens, then advanced to `queued` (dispatched to River),
        `running` (agent executing), and finally a terminal status
        (`completed`, `failed`, `skipped`, or `canceled`).
        `triggered_by_email` and `triggered_by_name` are resolved from the
        tenant user directory when the actor is a known user (schedule-fired
        runs carry `triggered_by="schedule"` and leave these null).
      required:
        - id
        - site_id
        - schedule_id
        - scheduled_for
        - status
        - kind
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique schedule run ID.
        site_id:
          type: string
          format: uuid
          description: ID of the site this run targets.
        schedule_id:
          type: string
          format: uuid
          description: ID of the backup schedule that generated this run.
        snapshot_id:
          type: string
          format: uuid
          description: ID of the backup snapshot created by this run (absent until the snapshot is created).
        scheduled_for:
          type: string
          format: date-time
          description: The scheduled fire time for this run.
        status:
          type: string
          description: Current status of the schedule run.
          enum: [scheduled, queued, running, completed, failed, skipped, canceled]
        kind:
          type: string
          description: Backup kind that will be (or was) created by this run.
          enum: [full, incremental]
        error:
          type: string
          description: Human-readable error message when status is `failed`.
        triggered_by:
          type: string
          description: Actor that triggered this run (`schedule` for automatic fires; user UUID for manual).
        triggered_by_email:
          type: string
          format: email
          nullable: true
          description: Email of the triggering user (null for schedule-fired or unresolvable actors).
        triggered_by_name:
          type: string
          nullable: true
          description: Display name of the triggering user (null for schedule-fired or unresolvable actors).
        created_at:
          type: string
          format: date-time
          description: When the schedule run row was created.
        started_at:
          type: string
          format: date-time
          description: When the run transitioned to `running` (absent until then).
        finished_at:
          type: string
          format: date-time
          description: When the run reached a terminal state.
    ScheduleRunList:
      type: object
      description: |
        Split view of schedule runs for a site. `upcoming` contains
        non-terminal runs (bounded to 10); `past` contains terminal runs
        (paginated). One or both lists may be empty.
      required: [upcoming, past]
      properties:
        upcoming:
          type: array
          description: Non-terminal schedule runs (scheduled/queued/running), newest-fire-time first.
          items:
            $ref: "#/components/schemas/ScheduleRun"
        past:
          type: array
          description: Terminal schedule runs (completed/failed/skipped/canceled), newest first.
          items:
            $ref: "#/components/schemas/ScheduleRun"
    UptimeStatus:
      type: object
      description: Windowed uptime status for a single site (from the metrics store).
      required: [site_id, window, uptime_pct, avg_latency_ms, checks, up, series]
      properties:
        site_id:
          type: string
          format: uuid
        window:
          type: string
          enum: ["7d", "30d", "90d"]
        uptime_pct:
          type: number
          format: double
          description: Percentage of checks in the window that were up (0-100).
        avg_latency_ms:
          type: number
          format: double
          description: Mean total request time over the window, in milliseconds.
        checks:
          type: integer
          format: int64
          description: Number of probe checks recorded in the window.
        up:
          type: boolean
          description: Whether the most recent probe classified the site as up.
        last_check:
          type: string
          format: date-time
          description: Time of the most recent probe (absent if never probed).
        tls_expiry:
          type: string
          format: date-time
          description: Leaf TLS certificate expiry from the latest probe (HTTPS only).
        series:
          type: array
          description: Downsampled per-bucket check series over the window.
          items:
            $ref: "#/components/schemas/UptimePoint"
    UptimePoint:
      type: object
      required: [bucket, checks, up_checks, avg_latency_ms]
      properties:
        bucket:
          type: string
          format: date-time
          description: Start of the time bucket.
        checks:
          type: integer
          format: int64
        up_checks:
          type: integer
          format: int64
        avg_latency_ms:
          type: number
          format: double
    UptimeSummary:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UptimeSummaryItem"
    FleetUptimeCounts:
      type: object
      required: [up, degraded, down, unknown]
      properties:
        up:
          type: integer
        degraded:
          type: integer
        down:
          type: integer
        unknown:
          type: integer
    FleetUptimeStatusItem:
      type: object
      required: [site_id, site_name, site_url, status, uptime_pct_7d, avg_latency_ms_7d, in_incident, connection_state, health_status]
      properties:
        site_id:
          type: string
          format: uuid
        site_name:
          type: string
        site_url:
          type: string
        status:
          type: string
          enum: [up, degraded, down, unknown]
        status_reason:
          type: string
          description: |
            Short machine-readable explanation for status, populated when
            status=degraded (agent_unreachable, agent_degraded, app_down, or
            slow_response). Empty/absent when the status needs no further
            explanation.
        uptime_pct_7d:
          type: number
          format: double
        avg_latency_ms_7d:
          type: number
          format: double
        latest_total_ms:
          type: number
          format: double
        last_probe_at:
          type: string
          format: date-time
        tls_expiry:
          type: string
          format: date-time
        in_incident:
          type: boolean
        connection_state:
          type: string
        health_status:
          type: string
        app_up:
          type: boolean
          nullable: true
          description: |
            GH #291 Phase 2 application-health verdict from the most recent
            app probe: true (WordPress responded), false (conclusively
            down), or absent/null (never probed, or the most recent probe
            was inconclusive; see app_probe_reason). Independent of `up`
            (the reachability signal, unchanged forever): a cached 200
            (up=true) can coexist with app_up=false when a page cache is
            masking a dead PHP backend.
        app_probe_reason:
          type: string
          description: |
            Machine-readable reason for the most recent app-health verdict
            (agent_fresh, rest_ok, rest_5xx, wp_fatal_error, cache_hit,
            rest_forbidden, rest_absent, rest_4xx, rest_non_json,
            unreachable, rest_unexpected). Empty when no app probe has run
            yet.
    FleetUptimeStatus:
      type: object
      required: [summary, items]
      properties:
        summary:
          $ref: "#/components/schemas/FleetUptimeCounts"
        items:
          type: array
          items:
            $ref: "#/components/schemas/FleetUptimeStatusItem"
    FleetIncidentItem:
      type: object
      required: [site_id, site_name, site_url, ongoing]
      description: |
        An open or recently-closed incident. NOTE: site_alert_state stores only
        current transition memory; full historical incident logs are not persisted.
        ended_at / duration_seconds are estimated from updated_at for closed
        incidents, not from a true incident-close record.
      properties:
        site_id:
          type: string
          format: uuid
        site_name:
          type: string
        site_url:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
          format: int64
        ongoing:
          type: boolean
        latest_total_ms:
          type: number
          format: double
    FleetIncidentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FleetIncidentItem"
    FleetRumMetric:
      type: object
      required: [metric, p75_ms, sample_count, suppressed, good_pct, ni_pct, poor_pct]
      properties:
        metric:
          type: string
        p75_ms:
          type: number
          format: double
        sample_count:
          type: integer
          format: int64
        rating:
          type: string
          enum: [good, needs_improvement, poor]
        suppressed:
          type: boolean
        good_pct:
          type: integer
        ni_pct:
          type: integer
        poor_pct:
          type: integer
    FleetRumWorstOffender:
      type: object
      required: [site_id, p75_ms, rating]
      properties:
        site_id:
          type: string
          format: uuid
        p75_ms:
          type: number
          format: double
        rating:
          type: string
    FleetRumAggregate:
      type: object
      required: [window_days, sites_reporting, sites_total, fleet_pass_pct, metrics, worst_offenders]
      properties:
        window_days:
          type: integer
        sites_reporting:
          type: integer
        sites_total:
          type: integer
        fleet_pass_pct:
          type: number
          format: double
          description: Percentage of sites with "good" LCP p75.
        metrics:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FleetRumMetric"
          description: Keyed by metric name (lcp, inp, cls, fcp, ttfb).
        worst_offenders:
          type: array
          items:
            $ref: "#/components/schemas/FleetRumWorstOffender"
    UptimeSummaryItem:
      type: object
      required: [site_id, up]
      properties:
        site_id:
          type: string
          format: uuid
        up:
          type: boolean
        http_status:
          type: integer
          format: int32
        last_check:
          type: string
          format: date-time
        tls_expiry:
          type: string
          format: date-time
    AlertConfig:
      type: object
      description: |
        A tenant's alert channel, shared by uptime downtime/recovery,
        high-severity security events, and vulnerability alerting (GH #247).
        The webhook secret is write-only and is never returned;
        webhook_configured indicates whether a webhook URL is set.
      required:
        [
          email_recipients,
          enabled,
          webhook_configured,
          notify_security,
          notify_vulns,
          vuln_min_severity,
          vuln_include_in_digest,
          app_alerts_enabled,
        ]
      properties:
        email_recipients:
          type: array
          items:
            type: string
            format: email
        webhook_url:
          type: string
        webhook_configured:
          type: boolean
        enabled:
          type: boolean
        notify_security:
          type: boolean
          description: |
            Routes high-severity activity-log security events into this same
            channel (email + webhook).
        notify_vulns:
          type: boolean
          description: |
            Routes new vulnerability findings into this same channel (email +
            webhook). Opt-in; default false.
        vuln_min_severity:
          type: string
          enum: [critical, high, medium, low]
          description: |
            The minimum severity that triggers a vulnerability alert. A
            finding with unknown severity (no CVSS data yet) always alerts
            regardless of this threshold.
        vuln_include_in_digest:
          type: boolean
          description: |
            Whether open vulnerabilities appear in the periodic email digest
            (see EmailNotifySettings). Default true.
        app_alerts_enabled:
          type: boolean
          description: |
            Whether the application-health alert kind (GH #291 Phase 3) is
            allowed to dispatch for this tenant, independent of `enabled`
            (the reachability channel) - a tenant that already has downtime
            alerts on does not silently start receiving app-health alerts
            too. Defaults to false on any deployment that already had sites
            when app-health alerting shipped, and true on a fresh install -
            decided once, deterministically, by migration (never re-decided
            at runtime).
    AlertConfigUpdate:
      type: object
      description: Create or update the tenant's alert channel.
      properties:
        email_recipients:
          type: array
          items:
            type: string
            format: email
        webhook_url:
          type: string
        webhook_secret:
          type: string
          description: Write-only HMAC signing secret for the webhook payload.
        enabled:
          type: boolean
          default: true
        notify_security:
          type: boolean
          description: |
            Omitted preserves the tenant's currently-stored value (all fields
            in this update body are optional and independently preservable).
        notify_vulns:
          type: boolean
          description: Omitted preserves the tenant's currently-stored value.
        vuln_min_severity:
          type: string
          enum: [critical, high, medium, low]
          description: Omitted preserves the tenant's currently-stored value.
        vuln_include_in_digest:
          type: boolean
          description: Omitted preserves the tenant's currently-stored value.
        app_alerts_enabled:
          type: boolean
          description: |
            Omitted preserves the tenant's currently-stored value (or, for a
            tenant with no alert config saved yet, the deployment's rollout
            default - see AlertConfig.app_alerts_enabled).
    AppHealthSettings:
      type: object
      description: |
        A site's application-health settings (GH #291 Phase 3): the B3
        override path for the application-health probe, and a per-site
        switch to disable app-health ALERTING for this site without
        disabling the probe itself (the dashboard stays accurate either
        way).
      required: [app_probe_path, app_alerts_disabled]
      properties:
        app_probe_path:
          type: string
          maxLength: 512
          description: |
            A site-relative path (must start with `/`; no scheme, no host,
            no `..` traversal) the application-health probe requests instead
            of auto-detecting `/wp-json/` (falling back to
            `/?rest_route=/`). Empty means auto-detect. Set this when the
            default probe reports `unknown` for this site (e.g. a WAF blocks
            the default REST route but a different health-check path is
            reachable).
        app_alerts_disabled:
          type: boolean
          description: |
            When true, this site is excluded from app-health alerting
            entirely (both the individual per-site alert and the fleet
            circuit breaker's eligible-site count) while the probe keeps
            running and the dashboard stays accurate.
    AppHealthSettingsUpdate:
      type: object
      description: Save a site's application-health settings.
      required: [app_probe_path, app_alerts_disabled]
      properties:
        app_probe_path:
          type: string
          maxLength: 512
        app_alerts_disabled:
          type: boolean
    AutologinCreate:
      type: object
      description: |
        Optional inputs for minting an autologin URL. Both fields default to
        empty: an absent `target_wp_user_login` means "agent picks the first
        administrator", and an absent `redirect_to` lands the operator on the
        wp-admin home.
      properties:
        target_wp_user_login:
          type: string
          maxLength: 60
          description: |
            The WordPress username the agent should log the operator in as.
            Empty -> the agent picks the first administrator on the site.
        redirect_to:
          type: string
          maxLength: 2048
          description: |
            Optional URL the agent forwards the operator's browser to after
            establishing the wp-admin session. The agent may rewrite it to a
            same-origin URL.
    AutologinResponse:
      type: object
      required: [redirect_url, expires_at]
      properties:
        redirect_url:
          type: string
          description: |
            The URL the operator's browser should follow. Shape:
            `{site.url}/wp-json/wpmgr/v1/autologin?token=<jwt>&redirect_to=<urlencoded>`.
            The embedded `token` is a single-use Ed25519 JWT bound to the
            target site (`aud` = site UUID, `cmd` = "autologin") with a
            ~60-second TTL. NEVER log or persist this URL — the token is a
            credential.
        expires_at:
          type: string
          format: date-time
          description: When the JWT/nonce expires (~60s from mint).
    AutologinRateLimited:
      type: object
      required: [code, message, retry_after_seconds]
      properties:
        code:
          type: string
          enum: [rate_limited]
        message:
          type: string
        retry_after_seconds:
          type: integer
          format: int32
          description: Smallest seconds to wait before retrying.
    AutologinConsumeRequest:
      type: object
      required: [nonce, site_id]
      properties:
        nonce:
          type: string
          description: |
            The base64url-no-pad nonce id from the JWT's `jti` claim. Single-use.
          minLength: 8
          maxLength: 256
        site_id:
          type: string
          format: uuid
          description: |
            The agent's claimed site_id. MUST equal the site_id derived from
            the agent's verified Ed25519 identity, else the request is
            rejected (`site_mismatch`).
        consumed_from_ip:
          type: string
          description: |
            The IP that initiated the consume (typically the operator's
            browser as seen by the agent). Optional; the control plane falls
            back to the request peer IP when absent.
    AutologinConsumeResponse:
      type: object
      required: [ok, target_wp_user_login, allowed_wp_roles, audit_id]
      properties:
        ok:
          type: boolean
        target_wp_user_login:
          type: string
          description: |
            The WP login the agent should establish a session as. Empty means
            the agent should pick the first administrator (the policy still
            constrains which roles are admissible).
        allowed_wp_roles:
          type: array
          items:
            type: string
          description: |
            The WP roles the agent is permitted to log the operator in as
            (from `autologin_policies.allowed_wp_roles`; defaults to
            ["administrator"] when no policy row exists).
        audit_id:
          type: string
          format: uuid
          description: |
            The audit entry id recorded for the consume; the agent may surface
            it for correlation but it has no security significance.
    # GH #286: per-site default "Login As User" policy.
    SiteAutologinPolicy:
      type: object
      required: [enabled, default_wp_user_login, allowed_wp_roles]
      properties:
        enabled:
          type: boolean
          description: Whether one-click login is allowed for this site.
        default_wp_user_login:
          type: string
          maxLength: 60
          pattern: "^[a-zA-Z0-9_.\\-@]*$"
          description: |
            The WordPress login the mint endpoint injects when an operator's
            mint request omits `target_wp_user_login`. Empty means the agent
            picks the first administrator (the pre-existing fallback).
        allowed_wp_roles:
          type: array
          items:
            type: string
          description: |
            READ-ONLY. The WP roles the agent is permitted to log the
            operator in as. Not writable via the PUT body; the ceiling can
            only be changed by a manual database operation.
        updated_at:
          type: string
          format: date-time
          description: When the policy was last saved. Absent for the built-in default.
    SiteAutologinPolicyUpdate:
      type: object
      required: [enabled, default_wp_user_login]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Whether one-click login is allowed for this site.
        default_wp_user_login:
          type: string
          maxLength: 60
          pattern: "^[a-zA-Z0-9_.\\-@]*$"
          description: |
            The WordPress login the mint endpoint injects when an operator's
            mint request omits `target_wp_user_login`, or `""` to clear the
            default and revert to the agent's first-administrator fallback.
    # ── ADR-037 Sprint 2 — Site Health (diagnostics) + PHP errors ──────────
    SiteDiagnosticsCard:
      type: object
      required: [category, payload, fresh]
      properties:
        category:
          type: string
          description: |
            One of: identity, php, mysql, filesystem, http, cron, themes,
            plugins, users, security, https, mail, performance, hosting,
            wp_native. The first 14 are the WPMgr-extra leapfrog collector
            (the 9-card legacy grid + the ribbon-summary entries); the 15th
            `wp_native` carries the verbatim WP_Debug_Data::debug_data()
            dump (full Site Health > Info parity) and is rendered as four
            additional cards: Directory Sizes, Media Handling, Filesystem
            Permissions, WordPress Constants.
        payload:
          description: |
            The raw JSON sub-blob the agent shipped for this category, or
            null when the agent has never shipped a payload for it yet.
            Shape is category-specific and deliberately tolerant — the UI
            parses it lazily so the agent can evolve the shape without a
            wire schema change.
        collected_at:
          type: string
          format: date-time
          description: Agent-side collection timestamp (UTC).
        received_at:
          type: string
          format: date-time
          description: CP-side ingestion timestamp (UTC).
        fresh:
          type: boolean
          description: |
            True when the agent's `collected_at` is within the freshness
            tolerance (24h + 2h slack). Card UIs render a stale warning
            badge when false.
    SiteDiagnosticsList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteDiagnosticsCard"
    PHPErrorFrame:
      type: object
      description: One frame in a PHP error backtrace (most-recent-call-first).
      required:
        - file
        - line
        - function
      properties:
        file:
          type: string
          description: Absolute path to the PHP file containing the call.
        line:
          type: integer
          description: Line number of the call site.
        function:
          type: string
          description: Function or method name at this frame (empty string for file-level code).
    PHPError:
      type: object
      required:
        - id
        - md5
        - code
        - severity
        - message
        - file
        - line
        - request_path
        - first_seen_at
        - last_seen_at
        - occurrence_count
        - silenced
        - backtrace
      properties:
        id:
          type: string
          description: The CP-side row UUID (stringified).
        md5:
          type: string
          description: The agent-side dedup fingerprint (md5(code:file:line:message)).
        code:
          type: integer
          description: PHP error code (E_* constant value).
        severity:
          type: string
          description: One of fatal, warning, notice, deprecated, bootstrap, unknown.
        message:
          type: string
        file:
          type: string
        line:
          type: integer
        request_path:
          type: string
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        occurrence_count:
          type: integer
          format: int64
        silenced:
          type: boolean
        backtrace:
          type: array
          description: >
            Up to 10 stack frames captured at the error site, most-recent-call-first.
            Always present; may be an empty array for errors captured before S1.1
            or when the agent could not produce a trace.
          items:
            $ref: "#/components/schemas/PHPErrorFrame"
    PHPErrorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PHPError"
        next_cursor: { type: string }
    PHPErrorSilence:
      type: object
      properties:
        silenced:
          type: boolean
          default: true
          description: Whether to silence (default true).
    # ── S1.2 PHP-error ignore-list + error-level config ────────────────────
    SiteErrorConfig:
      type: object
      required:
        - error_level
        - ignore_md5s
      properties:
        enabled:
          type: boolean
          description: |
            Whether PHP-error capture is active for this site.
        error_level:
          type: integer
          format: int32
          description: |
            PHP E_* bitmask the agent applies to wp_debug_log collection.
            Default 6143 = E_ALL & ~E_STRICT (WordPress default).
        ignore_md5s:
          type: array
          description: |
            Ordered list of 32-character lowercase hex md5 fingerprints
            (md5(code:file:line:message)) the agent must suppress without
            counting or reporting. An empty list clears all suppression.
          items:
            type: string
    SiteErrorConfigUpdate:
      type: object
      required:
        - error_level
        - ignore_md5s
      properties:
        enabled:
          type: boolean
          description: |
            Turns PHP-error capture on or off. OMITTING this field is treated as
            true: a client that does not know about the flag can never
            accidentally disable the mu-plugin trap, but that also means an
            update sent without it re-enables capture on a site where it was
            switched off. Send false explicitly to keep capture disabled.
        error_level:
          type: integer
          format: int32
          description: |
            PHP E_* bitmask to apply. Must be >0 and fit in int32.
        ignore_md5s:
          type: array
          description: |
            Full canonical ignore-list (replaces the stored list atomically).
            Each entry must be exactly 32 lowercase hex characters.
          items:
            type: string
    # ── ADR-037 Sprint 3 — WordPress activity log ──────────────────────────
    SiteActivityEvent:
      type: object
      required:
        - id
        - seq
        - event_type
        - object_type
        - object_id
        - object_label
        - actor_user_id
        - actor_login
        - actor_ip
        - summary
        - meta
        - severity
        - prev_hash
        - this_hash
        - chain_valid
        - occurred_at
        - received_at
      properties:
        id:
          type: string
          description: The CP-side row id (stringified BIGSERIAL).
        seq:
          type: integer
          format: int64
          description: Agent-assigned monotonic sequence within the chain.
        event_type:
          type: string
        object_type:
          type: string
        object_id:
          type: string
        object_label:
          type: string
        actor_user_id:
          type: integer
          format: int64
          description: WP user id of the actor; 0 for system events.
        actor_login:
          type: string
          description: WP login of the actor; empty for system events.
        actor_ip:
          type: string
        summary:
          type: string
        meta:
          type: object
          additionalProperties: true
          description: Agent-supplied event metadata (severity lives here).
        severity:
          type: string
          enum: [high, medium, low]
        prev_hash:
          type: string
          description: The prior link's hash (64 zero chars at genesis).
        this_hash:
          type: string
          description: sha256 over the canonical event preimage.
        chain_valid:
          type: boolean
          description: |
            Server-verified at ingest. False marks a tampered/broken link: the
            CP-recomputed hash did not match the shipped this_hash, or the
            shipped prev_hash did not match the prior stored row.
        occurred_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
    SiteActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteActivityEvent"
        next_cursor: { type: string }
    ActivityVerifyResult:
      type: object
      required: [valid, total]
      properties:
        valid:
          type: boolean
          description: True when the entire chain re-verifies intact.
        break_at_seq:
          type: integer
          format: int64
          nullable: true
          description: |
            The seq of the first broken link, or null when the chain is intact.
            Kept for backward compatibility; equals break.seq when broken.
        total:
          type: integer
          description: Total number of events folded during verification.
        break:
          nullable: true
          description: |
            Null when the chain is intact. Describes the first broken link with
            enough detail for an operator to understand and act on the failure.
          allOf:
            - $ref: "#/components/schemas/ChainBreak"
    ChainBreak:
      type: object
      required:
        - seq
        - kind
        - seq_gap
        - expected_prev_hash
        - stored_prev_hash
        - recomputed_this_hash
        - stored_this_hash
        - event
      properties:
        seq:
          type: integer
          format: int64
          description: The seq of the event where verification failed.
        kind:
          type: string
          enum:
            - missing_events
            - link_mismatch
            - content_modified
            - chain_start_missing
          description: |
            Classifies the break:
            - missing_events: one or more seq numbers are absent (log cleanup / retention / deletion).
            - link_mismatch: contiguous seq but prev_hash broken (insertion/removal/reorder/prior alteration).
            - content_modified: prev link intact but recomputed hash diverges (content edited after recording).
            - chain_start_missing: first stored event does not chain from genesis (oldest events gone / chain reset).
        prior_seq:
          type: integer
          format: int64
          nullable: true
          description: |
            The seq of the last successfully-verified row. Null when the break is
            at the first/genesis row and no prior row was verified.
        seq_gap:
          type: integer
          format: int64
          description: |
            Number of missing sequence numbers between prior_seq and seq.
            0 when contiguous or when there is no prior row.
        expected_prev_hash:
          type: string
          description: |
            The verified chain head before this row: the prior row's this_hash,
            or GenesisPrevHash (64 zero hex chars) if this is the first row.
        stored_prev_hash:
          type: string
          description: The row's own prev_hash as stored.
        recomputed_this_hash:
          type: string
          description: ComputeHashFromStored(expected_prev_hash, row).
        stored_this_hash:
          type: string
          description: The row's own this_hash as stored.
        event:
          type: object
          required: [summary, event_type, actor_login, occurred_at]
          description: The offending event fields for operator context.
          properties:
            summary:
              type: string
            event_type:
              type: string
            actor_login:
              type: string
            occurred_at:
              type: string
              format: date-time
    # ── S2 — Login Protection + IP store ───────────────────────────────────
    SecurityThresholds:
      type: object
      required:
        - captcha_limit
        - temp_block_limit
        - block_all_limit
        - failed_login_gap
        - success_login_gap
        - all_blocked_gap
      properties:
        captcha_limit:
          type: integer
          format: int32
          description: Number of failures before a CAPTCHA challenge is shown.
        temp_block_limit:
          type: integer
          format: int32
          description: Number of failures before a temporary block is applied.
        block_all_limit:
          type: integer
          format: int32
          description: Number of failures before a permanent block is applied.
        failed_login_gap:
          type: integer
          format: int32
          description: |
            Seconds of inactivity that reset the failure counter.
        success_login_gap:
          type: integer
          format: int32
          description: |
            Seconds after a successful login before a new failure series begins.
        all_blocked_gap:
          type: integer
          format: int32
          description: Seconds a permanent block remains active.
    SiteLoginProtectionConfig:
      type: object
      required:
        - mode
        - thresholds
        - ip_header
        - allow_cidrs
        - deny_cidrs
      properties:
        mode:
          type: string
          enum: [disabled, audit, protect]
          description: |
            Login protection mode:
              - `disabled` — no login protection active.
              - `audit` — record events but do not block.
              - `protect` — record events AND block based on thresholds.
        thresholds:
          $ref: "#/components/schemas/SecurityThresholds"
        ip_header:
          type: string
          description: |
            HTTP header the agent reads to extract the real client IP (e.g.
            `REMOTE_ADDR`, `HTTP_X_FORWARDED_FOR`).
        allow_cidrs:
          type: array
          description: |
            CIDRs that always bypass all checks (IPv4 or IPv6, with prefix length).
          items:
            type: string
        deny_cidrs:
          type: array
          description: |
            CIDRs that are always denied before threshold evaluation.
          items:
            type: string
        updated_at:
          type: string
          format: date-time
          description: When the config was last saved. Absent for the built-in default.
    SiteLoginProtectionConfigUpdate:
      type: object
      required:
        - mode
        - thresholds
        - ip_header
        - allow_cidrs
        - deny_cidrs
      properties:
        mode:
          type: string
          enum: [disabled, audit, protect]
          description: Login protection mode.
        thresholds:
          $ref: "#/components/schemas/SecurityThresholds"
        ip_header:
          type: string
          description: HTTP header the agent reads for the real client IP.
        allow_cidrs:
          type: array
          description: |
            CIDRs always allowed. Empty = no static allowlist. When mode=protect
            and this list is empty the CP auto-adds the operator's IP (/32 or /128).
          items:
            type: string
        deny_cidrs:
          type: array
          description: CIDRs always denied before threshold evaluation. Empty = none.
          items:
            type: string
    UnblockIPRequest:
      type: object
      required: [ip]
      properties:
        ip:
          type: string
          description: The IPv4 or IPv6 address to unblock.
    UnblockIPResult:
      type: object
      required: [ok, detail]
      properties:
        ok:
          type: boolean
          description: Whether the agent successfully removed the block.
        detail:
          type: string
          description: Short human-readable note from the agent.
    SiteLoginEvent:
      type: object
      required:
        - id
        - agent_event_id
        - ip
        - status
        - category
        - username
        - request_id
        - occurred_at
        - ingested_at
      properties:
        id:
          type: integer
          format: int64
          description: CP-side row id (BIGSERIAL).
        agent_event_id:
          type: integer
          format: int64
          description: Agent-side event id (cursor tracking).
        ip:
          type: string
          description: Client IP address.
        status:
          type: integer
          format: int32
          enum: [1, 2, 3]
          description: "1=failure, 2=success, 3=blocked."
        category:
          type: string
          description: Agent-assigned event category.
        username:
          type: string
          description: Attempted username.
        request_id:
          type: string
          description: Agent-side request id for correlation.
        occurred_at:
          type: string
          format: date-time
        ingested_at:
          type: string
          format: date-time
    SiteLoginEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteLoginEvent"
    # ── M14 Login Whitelabel ─────────────────────────────────────────────────
    SiteLoginBrand:
      type: object
      required:
        - logo_url
        - logo_link
        - message
      properties:
        logo_url:
          type: string
          description: |
            Full URL of the image shown on the WP login page. Empty string
            means no override (WordPress default logo is used).
        logo_link:
          type: string
          description: |
            URL the logo links to on the login page. Empty string means no
            override (WordPress default link is used).
        message:
          type: string
          description: |
            Text shown below the logo on the login page. Empty string means
            no custom message. Maximum 2000 characters.
        updated_at:
          type: string
          format: date-time
          description: When the config was last saved. Absent for the built-in default.
    SiteLoginBrandUpdate:
      type: object
      required:
        - logo_url
        - logo_link
        - message
      properties:
        logo_url:
          type: string
          description: |
            Full http/https URL of the login logo image, or `""` to clear.
        logo_link:
          type: string
          description: |
            http/https URL the login logo links to, or `""` to clear.
        message:
          type: string
          description: |
            Text shown below the login logo (max 2000 chars), or `""` to clear.
    # ── M5.7 — Orgs + per-site sharing + invitations ────────────────────────
    PatchMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    CreateOrgRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name of the new organisation.
        slug:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: |
            URL-safe slug. Auto-derived from name when omitted.
    Org:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    ActivateOrgResponse:
      type: object
      required: [active_tenant_id]
      properties:
        active_tenant_id:
          type: string
          format: uuid
    SiteShareRole:
      type: string
      enum: [viewer, operator, admin]
      description: |
        Role a site collaborator holds. Subset of the full org Role enum, site shares cannot be owner.
    SiteShare:
      type: object
      required: [id, site_id, user_id, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/SiteShareRole"
        granted_by:
          type: string
          format: uuid
          description: UUID of the org member who created the share.
        expires_at:
          type: string
          format: date-time
          description: |
            When the share expires (null = durable). After this time the
            RESTRICTIVE RLS policy treats the grant as absent.
        created_at:
          type: string
          format: date-time
    SiteShareList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteShare"
    CreateSiteShareRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          description: |
            Email of the collaborator to invite. If a user with this email exists
            the share is created immediately; otherwise an invitation is emailed/linked.
        role:
          $ref: "#/components/schemas/SiteShareRole"
        expires_at:
          type: string
          format: date-time
          description: |
            Optional expiry (RFC3339). Null / omitted = durable grant. Use for
            time-limited support access.
    SiteShareGrantResponse:
      type: object
      required: [invited]
      properties:
        share:
          $ref: "#/components/schemas/SiteShare"
          description: Present when the user already existed and the share is immediate.
        invited:
          type: boolean
          description: |
            true when an invitation was created because the email is not a known
            user; false when the share was applied directly.
        accept_link:
          type: string
          description: |
            The raw invitation accept URL (shown once, like an API key). Present
            when invited=true AND the notification SMTP is not configured — the
            inviter must copy and share this link manually.
    AcceptInvitationRequest:
      type: object
      required: [token, email]
      properties:
        token:
          type: string
          description: The raw token from the accept link (?token=…).
        email:
          type: string
          format: email
          description: |
            Must match the email the invitation was addressed to (prevents
            identity swap and enumeration).
        name:
          type: string
          maxLength: 200
          description: Display name to set when a new user account is created.
        password:
          type: string
          minLength: 8
          maxLength: 200
          description: |
            Password to set when a new user account is created. Required only
            when the invited email has no existing account.
    AcceptInvitationResponse:
      type: object
      required: [tenant_id, scope]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: The organisation the invitation belonged to.
        scope:
          type: string
          enum: [org, site]
          description: |
            "org" when a full membership was granted; "site" when a site-scoped
            share was created.
        site_id:
          type: string
          format: uuid
          description: Set when scope="site"; the specific site the user now has access to.

    # ----------------------------------------------------------------------
    # Media Optimizer (ADR-043, M23). DTOs are hand-rolled in the Go handler
    # (c.JSON), mirroring the scan feature; these schemas document the wire
    # shape for the generated TS client.
    # ----------------------------------------------------------------------
    MediaAsset:
      type: object
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        wp_attachment_id: { type: integer, format: int64 }
        title: { type: string }
        original_url: { type: string }
        original_mime: { type: string }
        original_size_bytes: { type: integer, format: int64 }
        current_format: { type: string, enum: [original, webp, avif] }
        current_size_bytes: { type: integer, format: int64 }
        status:
          type: string
          enum: [pending, optimizing, optimized, failed, restoring, restored, excluded, originals_deleted]
        generation: { type: integer }
        sizes_optimized: { type: array, items: { type: string } }
        sizes_unoptimized: { type: object, additionalProperties: { type: string } }
        last_optimized_at: { type: string, format: date-time }
    MediaSummary:
      type: object
      properties:
        total: { type: integer, format: int64 }
        optimized: { type: integer, format: int64 }
        pending: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        bytes_saved: { type: integer, format: int64 }
    MediaAssetList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MediaAsset" } }
        next_cursor: { type: string }
        total_count: { type: integer, format: int64 }
        summary: { $ref: "#/components/schemas/MediaSummary" }
    MediaOptimizeRequest:
      type: object
      properties:
        asset_ids: { type: array, items: { type: string, format: uuid } }
        all_pending: { type: boolean }
        target_format: { type: string, enum: [avif, webp, original] }
        target_quality: { type: string, enum: [lossy, lossless] }
    MediaAssetSelection:
      type: object
      properties:
        asset_ids: { type: array, items: { type: string, format: uuid } }
    MediaBatchResult:
      type: object
      properties:
        batch_job_id: { type: string }
        queued_count: { type: integer }
    MediaJob:
      type: object
      properties:
        id: { type: string }
        site_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        wp_attachment_id: { type: integer, format: int64 }
        kind: { type: string, enum: [optimize, restore, delete_originals, sync] }
        target_format: { type: string }
        target_quality: { type: string }
        state:
          type: string
          enum: [queued, in_progress, succeeded, partially_succeeded, failed, cancelled]
        bytes_before: { type: integer, format: int64 }
        bytes_after: { type: integer, format: int64 }
        variants_total: { type: integer }
        variants_succeeded: { type: integer }
        variants_failed: { type: integer }
        error_reason: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    MediaVariantResult:
      type: object
      properties:
        variant_name: { type: string }
        source_size_bytes: { type: integer, format: int64 }
        optimized_size_bytes: { type: integer, format: int64 }
        source_mime: { type: string }
        optimized_mime: { type: string }
        encode_ms: { type: integer }
        state: { type: string, enum: [succeeded, failed, skipped] }
        reason: { type: string }
    MediaJobList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MediaJob" } }
        next_cursor: { type: string }
    MediaJobDetail:
      allOf:
        - $ref: "#/components/schemas/MediaJob"
        - type: object
          properties:
            variants: { type: array, items: { $ref: "#/components/schemas/MediaVariantResult" } }

    # --- Performance Suite (ADR-046 / m36) ------------------------------------
    # These mirror the hand-rolled Go DTOs in apps/api/internal/perf/dto.go.
    CdnCredentials:
      type: object
      description: |
        Write-only CDN credentials. Accepted on PUT /perf/config and NEVER
        returned by GET (the control plane decrypts server-side only).
      required: [api_token]
      properties:
        api_token: { type: string }
        zone_id: { type: string }
        zone: { type: string }
    PerfConfig:
      type: object
      description: |
        The full per-site performance configuration. `cdn_credentials` is
        write-only (see CdnCredentials); `cdn_has_credentials` and the
        install-state fields (`server_software`, `dropin_installed`,
        `wp_cache_constant_set`, `htaccess_managed`) are read-only / server- or
        agent-derived.
      properties:
        # Caching
        cache_enabled: { type: boolean }
        cache_logged_in: { type: boolean }
        cache_mobile: { type: boolean }
        cache_refresh: { type: boolean }
        cache_refresh_interval: { type: string }
        cache_link_prefetch: { type: boolean }
        cache_bypass_urls: { type: array, items: { type: string } }
        cache_bypass_cookies: { type: array, items: { type: string } }
        cache_include_queries: { type: array, items: { type: string } }
        cache_include_cookies: { type: array, items: { type: string } }
        # Preload (cache-warm) throttle (M37) — operator-tunable queue drain knobs.
        preload_concurrency: { type: integer, minimum: 1, maximum: 4, default: 1 }
        preload_delay_ms: { type: integer, minimum: 0, maximum: 10000, default: 500 }
        preload_batch_size: { type: integer, minimum: 1, maximum: 500, default: 50 }
        preload_max_load: { type: number, format: float, minimum: 0, maximum: 64, default: 0 }
        # CSS / JS
        css_js_minify: { type: boolean }
        css_rucss: { type: boolean }
        css_rucss_include_selectors: { type: array, items: { type: string } }
        css_js_self_host_third_party: { type: boolean }
        js_delay: { type: boolean }
        js_delay_method: { type: string }
        js_delay_excludes: { type: array, items: { type: string } }
        js_delay_third_party: { type: boolean }
        js_delay_third_party_excludes: { type: array, items: { type: string } }
        # Fonts
        fonts_display_swap: { type: boolean }
        fonts_optimize_google: { type: boolean }
        fonts_preload: { type: boolean }
        fonts_transcode_woff2:
          type: boolean
          description: >
            Enable server-side TTF/OTF/WOFF → WOFF2 transcoding for
            self-hosted fonts. When true the agent requests transcode jobs from
            the CP; the CP enqueues a font_transcode River job which produces
            the WOFF2 in object storage. Default false.
        fonts_subset:
          type: boolean
          description: >
            Enable subset-WOFF2 production (Phase 2, experimental). When true
            the media-encoder also produces a subset WOFF2 restricted to the
            unicode range specified by fonts_subset_range. Default false (opt-in).
        fonts_subset_mode:
          type: string
          description: >
            Subsetting strategy. "range" (fixed unicode-range block) is the
            only supported mode in v1. Stored for forward compatibility.
          default: range
        fonts_subset_range:
          type: string
          description: >
            Named unicode range to subset to. "latin-ext" is the safe default
            (U+0000-024F, U+1E00-1EFF).
          default: latin-ext
        # Media / lazy-load
        lazy_load: { type: boolean }
        lazy_load_exclusions: { type: array, items: { type: string } }
        properly_size_images: { type: boolean }
        youtube_placeholder: { type: boolean }
        self_host_gravatars: { type: boolean }
        # CDN
        cdn_enabled: { type: boolean }
        cdn_url: { type: string }
        cdn_file_types: { type: string }
        cdn_provider: { type: string }
        cdn_has_credentials: { type: boolean, readOnly: true }
        cdn_credentials:
          allOf: [{ $ref: "#/components/schemas/CdnCredentials" }]
          writeOnly: true
        # Database cleanup
        db_auto_clean: { type: boolean }
        db_auto_clean_interval: { type: string }
        db_post_revisions: { type: boolean }
        db_post_auto_drafts: { type: boolean }
        db_post_trashed: { type: boolean }
        db_comments_spam: { type: boolean }
        db_comments_trashed: { type: boolean }
        db_transients_expired: { type: boolean }
        db_optimize_tables: { type: boolean }
        # Bloat removal
        bloat_disable_block_css: { type: boolean }
        bloat_disable_dashicons: { type: boolean }
        bloat_disable_emojis: { type: boolean }
        bloat_disable_jquery_migrate: { type: boolean }
        bloat_disable_xml_rpc: { type: boolean }
        bloat_disable_rss_feed: { type: boolean }
        bloat_disable_oembeds: { type: boolean }
        bloat_heartbeat_control: { type: boolean }
        bloat_post_revisions_control: { type: boolean }
        # Server / install state (read-only, agent-reported)
        server_software: { type: string, readOnly: true }
        dropin_installed: { type: boolean, readOnly: true }
        wp_cache_constant_set: { type: boolean, readOnly: true }
        htaccess_managed: { type: boolean, readOnly: true }
        # WooCommerce cacheable-session (M53 / #169)
        woo_cacheable_session:
          type: boolean
          default: false
          description: |
            When true the agent will cache the WooCommerce catalog shell for
            anonymous shoppers who have an active cart. The agent additionally
            hard-gates on its own theme probe (`woo_theme_fragments_supported`)
            before serving cached pages to cart-holding visitors, providing a
            defense-in-depth layer independent of this flag.
            The API accepts `woo_cacheable_session: true` even when
            `woo_theme_fragments_supported` is false — the agent will not act on
            it until its own probe passes. This allows operators to pre-enable the
            flag before the agent performs its first probe.
        woo_theme_fragments_supported:
          type: boolean
          nullable: true
          readOnly: true
          description: |
            Agent-reported (read-only). Tri-state: null = never probed, false =
            probed and the active theme does not expose the standard WooCommerce
            cart-fragments hook, true = probed and supported. The CP stores this
            value but never lets an operator write it via PUT. Null is the
            correct initial state (M67); the agent stamps true/false only after
            running a genuine front-end probe.
        woo_fragments_probed_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: |
            RFC3339 timestamp of the last agent probe. Null when never probed.
        # M56 / RUM: Real User Monitoring.
        rum_enabled:
          type: boolean
          description: |
            Enable Real User Monitoring collection for this site.
        rum_sample_rate:
          type: number
          format: float
          description: |
            Fraction of page views that emit a RUM beacon (0 to 1).
        min_sample_count:
          type: integer
          description: |
            Suppression floor: any RUM slice with fewer samples than this is
            reported as suppressed rather than shown, so a handful of visits
            cannot masquerade as a trend.
        max_distinct_countries:
          type: integer
          description: |
            Cap on the number of distinct countries kept in the per-country RUM
            breakdown.
        beacon_key_set:
          type: boolean
          readOnly: true
          description: |
            Whether a RUM beacon key is provisioned. The plaintext key is never
            returned; this boolean is how a client tells whether RUM is fully
            provisioned. Ignored on write.
        beacon_key_acked_present:
          type: boolean
          readOnly: true
          description: |
            Whether the agent's most recent config-ack confirmed it holds the
            beacon key. beacon_key_set true with this false means RUM is
            provisioned control-plane side but the agent has not confirmed
            receipt yet; the control plane retries automatically. Ignored on
            write.
        config_version: { type: integer, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    CacheStats:
      type: object
      description: The latest cache gauges the agent reported for a site.
      properties:
        cached_pages_count: { type: integer }
        cache_size_bytes: { type: integer, format: int64 }
        last_purged_at: { type: string, format: date-time }
        last_purge_kind: { type: string }
        last_preload_at: { type: string, format: date-time }
        preload_pending: { type: integer }
        preload_total: { type: integer }
        reported_at: { type: string, format: date-time }
    PurgeRequest:
      type: object
      description: A page-cache purge request.
      required: [scope]
      properties:
        scope:
          type: string
          enum: [all, url]
          description: Purge the whole cache (`all`) or a single URL (`url`).
        url:
          type: string
          description: The single URL to purge when `scope` is `url`.
        urls:
          type: array
          items: { type: string }
          description: Additional URLs to purge.
        delete_everything:
          type: boolean
          description: |
            With `scope: all`, also clears every cached artifact. Requires the
            `site.cache.delete-everything` permission.
    PerfActionResult:
      type: object
      description: |
        The `{ok, detail}` acknowledgement returned by the cache action
        endpoints (purge / preload / enable / disable). `ok` is false when the
        agent rejected the action (still HTTP 200).
      required: [ok]
      properties:
        ok: { type: boolean }
        detail: { type: string }
        purge_id: { type: string, format: uuid }
    RumBeaconRotateResult:
      type: object
      description: |
        The response to POST .../perf/rum/rotate-key (GH #174). Confirms the
        beacon key was rotated and pushed to the agent. The plaintext key is
        NEVER returned here, logged, or exposed by any other endpoint — only
        this confirmation boolean.
      required: [ok, beacon_key_set]
      properties:
        ok: { type: boolean }
        beacon_key_set: { type: boolean }
    DbScanTableInventoryRow:
      type: object
      description: |
        One row in the per-table inventory returned by the db_scan agent command
        (Phase 2.1). Ownership is classified locally on the agent using the WP
        core table list + active plugin/theme slugs; no cloud lookup is performed.
      required: [name, rows, size_bytes, engine, overhead_bytes, belongs_to, owner_type]
      properties:
        name:
          type: string
          description: Full table name including the wp_ prefix (e.g. "wp_posts").
        rows:
          type: integer
          format: int64
          description: |
            TABLE_ROWS from information_schema. An estimate for InnoDB tables
            (can be 40-50% off); exact for MyISAM/ARIA. Rendered with a "~"
            prefix in the UI to signal InnoDB estimate.
        size_bytes:
          type: integer
          format: int64
          description: DATA_LENGTH + INDEX_LENGTH in bytes.
        engine:
          type: string
          description: Storage engine (e.g. "InnoDB", "MyISAM").
        overhead_bytes:
          type: integer
          format: int64
          description: DATA_FREE in bytes (reclaimable fragmented space; often 0 for InnoDB).
        belongs_to:
          type: string
          description: |
            Human-readable ownership label: "WordPress core", an active plugin
            display name (e.g. "WooCommerce"), an active theme display name
            (e.g. "Astra"), or "Orphan".
        owner_type:
          type: string
          enum: [core, plugin, theme, orphan, unknown]
          description: |
            Machine-readable ownership category used for client-side filtering.
            "unknown" is reserved for forward-compat and should not appear in
            Phase 2.1 results.
    DbScanResult:
      type: object
      description: |
        The latest db_scan result for a site, as stored by the control plane
        after the agent's synchronous ACK. Includes both the per-category
        counts/bytes preview and the full per-table inventory (Phase 2.1).
      required: [job_id, db_size_bytes, table_count, scanned_at, created_at]
      properties:
        job_id:
          type: string
          description: Correlation ID for this scan run.
        categories:
          type: object
          description: Per-category count/bytes map (keyed by category id).
          additionalProperties: true
        tables:
          type: array
          description: |
            Full per-table inventory. Sorted by size_bytes DESC (largest first)
            when returned from the agent. Client-side pagination (25 rows/page)
            and filtering (All / WP Core / Plugins / Themes / Orphans) are
            applied in the browser.
          items:
            $ref: "#/components/schemas/DbScanTableInventoryRow"
        db_size_bytes:
          type: integer
          format: int64
          description: Total database size in bytes at scan time.
        table_count:
          type: integer
          description: Number of tables at scan time.
        scanned_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the agent performed the scan.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the control plane persisted this result.
    SearchReplaceRequest:
      type: object
      description: |
        Request body for the serialization-safe database search-replace command.
        Call with `dry_run: true` first to preview affected rows before applying.
      required: [search, replace, dry_run]
      properties:
        search:
          type: string
          minLength: 3
          description: |
            Exact string to find in the database. Minimum 3 bytes. Treated as a
            literal (no regex, no wildcards).
        replace:
          type: string
          description: Replacement string. May be empty to remove occurrences.
        dry_run:
          type: boolean
          description: |
            When `true` (required for the preview step) the agent scans and
            counts matching rows but writes nothing. `rows_changed` will be 0.
        tables:
          type: array
          items: { type: string }
          description: |
            Optional allowlist of full table names to scan (including the wp_
            prefix, e.g. `wp_options`). When absent every eligible table is
            scanned.
    SearchReplaceResult:
      type: object
      description: |
        Result of a serialization-safe search-replace run or dry-run preview.
      required: [ok, tables_scanned, rows_matched, rows_changed, dry_run]
      properties:
        ok: { type: boolean }
        job_id: { type: string }
        dry_run:
          type: boolean
          description: Echoes the `dry_run` flag from the request.
        tables_scanned:
          type: integer
          description: Number of tables the agent walked (after denylist filtering).
        rows_matched:
          type: integer
          description: |
            Rows where at least one column value would change (or did change on
            a live run). This is the preview count shown before applying.
        rows_changed:
          type: integer
          description: |
            Rows actually written. Always 0 when `dry_run` was true.
        backup_warning:
          type: string
          description: |
            Non-empty when no recent backup was found and `dry_run` was false.
            Advisory only — the replace still ran.
        detail:
          type: string
          description: Human-readable reason on failure (ok=false).
    DbSnapshotEntry:
      type: object
      description: One local database snapshot entry.
      required: [id, label, created_at, size, table_count]
      properties:
        id:
          type: string
          description: Unique snapshot identifier (snap_<hex>).
        label:
          type: string
          description: Operator-supplied label; may be empty.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the snapshot was created.
        size:
          type: integer
          format: int64
          description: Compressed SQL file size in bytes.
        table_count:
          type: integer
          description: Number of database tables captured.
    DbSnapshotList:
      type: object
      required: [ok, snapshots]
      properties:
        ok: { type: boolean }
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/DbSnapshotEntry"
        detail:
          type: string
          description: Present on error (ok=false).
    DbSnapshotCreate:
      type: object
      description: Request body for creating a local database snapshot.
      properties:
        label:
          type: string
          maxLength: 120
          description: Optional human-readable label for the snapshot.
        retention:
          type: integer
          minimum: 1
          maximum: 20
          description: Maximum snapshots to retain after this one (default 5).
    DbSnapshotCreateResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        snapshot:
          $ref: "#/components/schemas/DbSnapshotEntry"
        detail:
          type: string
    DbSnapshotRevert:
      type: object
      required: [confirm]
      description: |
        Request body for the DESTRUCTIVE revert operation.
        `confirm` MUST equal `"REVERT"` exactly.
      properties:
        confirm:
          type: string
          description: Must be the exact string "REVERT".
        skip_safety_snapshot:
          type: boolean
          description: |
            When true, suppresses the automatic safety snapshot taken before
            the import. Defaults to false (safety snapshot is taken).
    DbSnapshotRevertResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        detail:
          type: string
          description: Human-readable outcome.
        safety_id:
          type: string
          description: |
            ID of the auto-safety snapshot taken before the import.
            Empty string when the safety snapshot was skipped or failed.
    DbCleanResult:
      type: object
      description: The acknowledgement returned by the database-cleanup endpoint.
      required: [ok]
      properties:
        ok: { type: boolean }
        detail: { type: string }
        rows_cleaned: { type: integer }
    RucssResult:
      type: object
      description: One cached Used-CSS (RUCSS) result row.
      properties:
        id: { type: string }
        structure_hash: { type: string }
        url: { type: string }
        original_css_bytes: { type: integer }
        used_css_bytes: { type: integer }
        reduction_pct: { type: number, format: double }
        used_css_s3_key: { type: string }
        last_used_at: { type: string, format: date-time }
    RucssResultList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RucssResult" }
    RumMetricSummary:
      type: object
      description: >
        p75 summary for one (metric, device, country) slice over the requested
        window. suppressed=true when the sample count is below the site's
        min_sample_count floor; p75_ms is 0 in that case and the dashboard
        must render "insufficient samples (sample_count of min_sample_count)".
      properties:
        metric:
          type: string
          enum: [lcp, inp, cls, ttfb, fcp]
          description: The Core Web Vital metric name.
        device:
          type: string
          enum: [desktop, mobile, tablet]
          description: Device class derived from the user agent.
        country:
          type: string
          description: ISO-3166-1 alpha-2 country code or "__other__".
        p75_ms:
          type: number
          format: double
          description: Interpolated 75th-percentile value in milliseconds (0 when suppressed).
        sample_count:
          type: integer
          format: int64
          description: Raw (pre-scale) sample count used for this estimate.
        rating:
          type: string
          enum: [good, needs_improvement, poor]
          description: >
            CWV standard rating band per the official web-vitals thresholds.
            Empty when suppressed=true or when the metric has no threshold.
        suppressed:
          type: boolean
          description: >
            True when sample_count < min_sample_count. Dashboard must render
            "insufficient samples" rather than a p75.
    RumSummary:
      type: object
      description: Site-level Core Web Vitals p75 summary over a configurable window.
      properties:
        window_days:
          type: integer
          description: Number of days covered by this summary.
        min_sample_count:
          type: integer
          description: The site's configured min_sample_count floor.
        metrics:
          type: array
          items: { $ref: "#/components/schemas/RumMetricSummary" }
          description: Flat list of p75 results by (metric, device, country).
    RumResult:
      type: object
      description: >
        One per-URL/metric/device/country p75 breakdown row for the dashboard
        table. suppressed=true when sample_count < min_sample_count.
      properties:
        url_pattern:
          type: string
          description: Normalized page URL pattern (query string stripped, IDs templated).
        metric:
          type: string
          enum: [lcp, inp, cls, ttfb, fcp]
        device:
          type: string
          enum: [desktop, mobile, tablet]
        country:
          type: string
          description: ISO-3166-1 alpha-2 country code or "__other__".
        p75_ms:
          type: number
          format: double
          description: Interpolated 75th-percentile value in milliseconds (0 when suppressed).
        sample_count:
          type: integer
          format: int64
        rating:
          type: string
          enum: [good, needs_improvement, poor]
        suppressed:
          type: boolean
          description: True when sample_count < min_sample_count.
    RumResultList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RumResult" }
    FontResult:
      type: object
      description: One font_results catalog row — the dashboard view of a processed self-hosted font.
      properties:
        id: { type: string }
        source_hash: { type: string, description: "64-char lowercase hex BLAKE3 hash of the source font bytes." }
        family: { type: string }
        source_file: { type: string, description: "Basename of the original font URL (e.g. inter.woff)." }
        original_ext: { type: string, description: "Source format: ttf | otf | woff." }
        original_size: { type: integer, description: "Byte length of the source font." }
        woff2_size: { type: integer, description: "Byte length of the full WOFF2 output. 0 until ready." }
        subset_size: { type: integer, description: "Byte length of the subset WOFF2 output. 0 unless subset." }
        unicode_range: { type: string, description: "CSS unicode-range for the subset; empty unless subset." }
        state:
          type: string
          enum: [pending, ready, subset, negative]
          description: >
            pending = job enqueued, not yet complete.
            ready = full WOFF2 produced (woff2_size set).
            subset = subset WOFF2 also produced (both sizes set).
            negative = permanent failure; serve the original font forever.
        error_detail: { type: string, description: "Non-empty when state=negative." }
        savings_pct:
          type: number
          format: double
          description: "CP-derived: 1 - min(woff2_size, subset_size) / original_size. 0 when sizes unknown."
        updated_at: { type: string, format: date-time }
    FontResultList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FontResult" }
    FontResultItem:
      type: object
      description: One font result item in the agent push payload.
      required: [source_hash, state]
      properties:
        source_hash: { type: string }
        family: { type: string }
        source_file: { type: string }
        original_ext: { type: string }
        original_size: { type: integer }
        woff2_size: { type: integer }
        subset_size: { type: integer }
        unicode_range: { type: string }
        state:
          type: string
          enum: [pending, ready, subset, negative]
        error_detail: { type: string }
    AgentFontResultsRequest:
      type: object
      required: [results]
      description: Batch of font result updates pushed by the agent.
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/FontResultItem" }
    AgentFontResultsResponse:
      type: object
      required: [ok, stored, skipped]
      properties:
        ok: { type: boolean }
        stored: { type: integer, description: "Number of rows successfully upserted." }
        skipped: { type: integer, description: "Number of items skipped (invalid hash or transient error)." }
    RucssClearResult:
      type: object
      required: [ok, cleared]
      properties:
        ok: { type: boolean }
        cleared: { type: integer }
    BulkPurgeRequest:
      type: object
      required: [site_ids]
      properties:
        site_ids:
          type: array
          items: { type: string, format: uuid }
    BulkConfigRequest:
      type: object
      required: [site_ids, preset]
      properties:
        site_ids:
          type: array
          items: { type: string, format: uuid }
        preset:
          type: string
          enum: [safe, balanced, aggressive]
    BulkResult:
      type: object
      description: One per-site result in a portfolio bulk-cache response.
      required: [site_id, ok, detail]
      properties:
        site_id: { type: string }
        ok: { type: boolean }
        detail: { type: string }
        config_version: { type: integer }
    BulkResultList:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BulkResult" }
    MediaCleanCandidate:
      type: object
      description: One attachment candidate identified as potentially unused.
      required: [id, title, url, file_size, sizes_count]
      properties:
        id:
          type: integer
          format: int64
          description: WordPress attachment post ID.
        title:
          type: string
          description: Attachment post title (may be the filename when no title is set).
        url:
          type: string
          description: Public URL of the original (largest) file (guid).
        thumb:
          type: string
          nullable: true
          description: URL of the thumbnail-size variant; null when unavailable.
        file_size:
          type: integer
          format: int64
          description: Size of the original file in bytes. 0 when the file is missing from disk.
        sizes_count:
          type: integer
          description: Number of generated thumbnail/resize variants registered in attachment metadata.
    MediaCleanScanResult:
      type: object
      required: [ok, total, candidates, truncated]
      properties:
        ok:
          type: boolean
        total:
          type: integer
          description: >
            Full unused-candidate count (capped at SCAN_MAX=500). Use this value
            to drive client-side pagination of the candidates array.
        candidates:
          type: array
          items: { $ref: "#/components/schemas/MediaCleanCandidate" }
          description: >
            Unused attachment candidates sliced by the requested offset/limit.
            The client should fetch once with offset=0 and limit=SCAN_MAX and
            paginate the returned array client-side.
        truncated:
          type: boolean
          description: >
            True when the library has more unused attachments than SCAN_MAX.
            The returned candidates and total are capped at SCAN_MAX.
        detail:
          type: string
          description: Human-readable error message when ok=false.
    MediaCleanIsolateRequest:
      type: object
      required: [job_id, attachment_ids]
      properties:
        job_id:
          type: string
          description: >
            Client-minted UUID v4 for idempotency. The agent echoes it in the
            response for correlation. Generate a new UUID per request.
        attachment_ids:
          type: array
          items: { type: integer, format: int64 }
          description: >
            Attachment IDs to move to quarantine. Maximum 200 per call.
            Must be attachments that appeared in a recent scan result.
    MediaCleanIsolateResult:
      type: object
      required: [ok, job_id, moved, manifest_id]
      properties:
        ok:
          type: boolean
        job_id:
          type: string
          description: Echoed from the request for correlation.
        moved:
          type: integer
          description: Number of attachment file sets moved to quarantine.
        manifest_id:
          type: string
          description: >
            Opaque quarantine manifest identifier. Store this value and pass it
            back in quarantine_ids for restore or delete calls.
        detail:
          type: string
    MediaCleanRestoreRequest:
      type: object
      required: [job_id, quarantine_ids]
      properties:
        job_id:
          type: string
          description: Client-minted UUID v4 for idempotency.
        quarantine_ids:
          type: array
          items: { type: string }
          description: >
            Quarantine manifest IDs to restore. Each ID was returned by a prior
            isolate call as manifest_id. Maximum 200 per call.
    MediaCleanRestoreResult:
      type: object
      required: [ok, job_id, restored]
      properties:
        ok:
          type: boolean
        job_id:
          type: string
          description: Echoed from the request.
        restored:
          type: integer
          description: Number of manifest entries successfully restored to the uploads directory.
        detail:
          type: string
    MediaCleanDeleteRequest:
      type: object
      required: [job_id, quarantine_ids, confirm]
      properties:
        job_id:
          type: string
          description: Client-minted UUID v4 for idempotency.
        quarantine_ids:
          type: array
          items: { type: string }
          description: >
            Quarantine manifest IDs to permanently delete. Maximum 200 per call.
        confirm:
          type: string
          description: Must equal "DELETE" exactly. The agent enforces this independently via hash_equals.
    MediaCleanDeleteResult:
      type: object
      required: [ok, job_id, deleted]
      properties:
        ok:
          type: boolean
        job_id:
          type: string
          description: Echoed from the request.
        deleted:
          type: integer
          description: Number of manifest entries permanently removed from disk.
        detail:
          type: string
    MediaCleanQuarantineEntry:
      type: object
      description: One attachment record inside a quarantine manifest.
      required: [attachment_id, title, file_count]
      properties:
        attachment_id:
          type: integer
          format: int64
          description: WordPress attachment post ID.
        title:
          type: string
          description: Attachment post title.
        file_count:
          type: integer
          description: Number of physical files (original + generated sizes) held in quarantine.
    MediaCleanQuarantineManifest:
      type: object
      description: One quarantine manifest created by a prior isolate call.
      required: [manifest_id, job_id, isolated_at, total_files, entries]
      properties:
        manifest_id:
          type: string
          description: Opaque quarantine manifest identifier. Pass in quarantine_ids for restore/delete calls.
        job_id:
          type: string
          description: Echoed job_id from the isolate request that created this manifest.
        isolated_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the manifest was created.
        total_files:
          type: integer
          description: Total number of physical files held across all entries in this manifest.
        entries:
          type: array
          items: { $ref: "#/components/schemas/MediaCleanQuarantineEntry" }
          description: Per-attachment entries in this manifest.
    MediaCleanQuarantineList:
      type: object
      description: Response body for the list-quarantined-media endpoint.
      required: [ok, manifests]
      properties:
        ok:
          type: boolean
        manifests:
          type: array
          items: { $ref: "#/components/schemas/MediaCleanQuarantineManifest" }
          description: All quarantine manifests currently held on the site.

    # -------------------------------------------------------------------------
    # Email / SMTP (Phase 0+1)
    # -------------------------------------------------------------------------
    SiteEmailConfig:
      type: object
      description: >
        Per-site (or org-wide default) email configuration.
        The provider secret is never returned — only `secret_set` indicates
        whether a credential is stored. When `site_id` is present, the row is
        a per-site override; when absent it is the org-wide default.
        A GET for a site that inherits the org default sets `site_id` to the
        queried site so the frontend can detect inheritance.
      required:
        - id
        - tenant_id
        - provider
        - from_address
        - from_name
        - force_from_email
        - force_from_name
        - return_path
        - secret_set
        - log_emails
        - store_body
        - retention_days
        - config
        - mappings
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key for this config row.
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
          nullable: true
          description: Present for per-site rows; absent for the org-wide default.
        provider:
          type: string
          description: >
            Provider slug (smtp | ses | sendgrid | mailgun | postmark).
            Must match a slug in the provider catalog.
        from_address:
          type: string
          description: Sender envelope address (e.g. no-reply@example.com).
        from_name:
          type: string
          description: Sender display name shown in the From header.
        force_from_email:
          type: boolean
          description: >
            When true the agent overrides any plugin-supplied From address
            with `from_address`.
        force_from_name:
          type: boolean
          description: >
            When true the agent overrides any plugin-supplied From name
            with `from_name`.
        return_path:
          type: boolean
          description: Set the Return-Path / Bounce-To header to `from_address`.
        secret_set:
          type: boolean
          description: True when an encrypted provider secret is stored for this row.
        default_connection:
          type: string
          nullable: true
          description: >
            Slug of the connection to use for regular mail (for providers that
            support multiple connections, e.g. SMTP-Multi — Phase 2+).
        fallback_connection:
          type: string
          nullable: true
          description: Slug of the fallback connection (Phase 2+).
        log_emails:
          type: boolean
          description: Whether outgoing emails are recorded in site_email_log.
        store_body:
          type: boolean
          description: When log_emails is true, also persist the full email body.
        retention_days:
          type: integer
          description: Number of days email log rows are retained (1-365).
        config:
          type: object
          additionalProperties: true
          description: Provider-specific configuration fields (non-secret).
        mappings:
          type: object
          additionalProperties: true
          description: >
            Provider-specific field mappings (e.g. WP-Mail -> provider header
            mappings -- Phase 2+).
        connections:
          type: array
          items:
            $ref: "#/components/schemas/EmailConnection"
          description: >
            Named provider connections for this config (multi-connection, m62+).
            Empty array when no named connections have been created.
        webhook_url:
          type: string
          nullable: true
          description: >
            The full inbound webhook URL for this config row, e.g.
            https://manage.wpmgr.app/webhooks/email/{provider}/{token}.
            Shows a placeholder token segment when a token is stored but not
            freshly rotated. Absent when no token has been generated yet.
        webhook_signing_key_set:
          type: boolean
          description: >
            True when an HMAC signing key is stored for this row. The key
            itself is never returned.
        ses_topic_arns:
          type: array
          items:
            type: string
          description: >
            SES only. SNS TopicArn allowlist -- only events delivered from
            these topics are accepted. Empty array means no filter is applied.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PutEmailWebhookConfigRequest:
      type: object
      description: >
        Request body for PUT /email/org-config/webhook-config and
        PUT /sites/{siteId}/email/webhook-config. All fields are optional.
        Omit webhook_signing_key to preserve the stored key (nil-sentinel).
        Send null to clear it. rotate_token: true generates a new route token
        and returns webhook_route_token in the response (shown once).
      properties:
        rotate_token:
          type: boolean
          description: >
            When true, a new route token is generated (invalidating the old
            URL) and returned once in webhook_route_token.
        webhook_signing_key:
          type: string
          nullable: true
          description: >
            HMAC signing key for verifying provider webhook payloads.
            Write-only. Omit to preserve the existing key. Send null to clear.
        ses_topic_arns:
          type: array
          nullable: true
          items:
            type: string
          description: >
            SES only. Replace the SNS TopicArn allowlist. null preserves the
            existing list. Empty array clears the list (no filter).

    EmailWebhookConfigResponse:
      type: object
      description: >
        Response for PUT webhook-config. Always returns the updated masked
        config fields. When rotate_token was true, also includes
        webhook_route_token (plain token, shown once).
      required:
        - webhook_url
        - webhook_signing_key_set
        - ses_topic_arns
      properties:
        webhook_url:
          type: string
          description: >
            The full inbound webhook URL including the (possibly new) token.
            Present whenever a token exists after the operation.
        webhook_signing_key_set:
          type: boolean
          description: True when an HMAC signing key is stored.
        ses_topic_arns:
          type: array
          items:
            type: string
          description: Current SNS TopicArn allowlist (may be empty).
        webhook_route_token:
          type: string
          nullable: true
          description: >
            Plain route token, returned once when rotate_token was true.
            Store it immediately -- it will not be shown again.

    PutEmailConfigRequest:
      type: object
      description: >
        Request body for PUT /email/org-config and PUT /sites/{siteId}/email/config.
        All fields are optional — omitted fields are unchanged (PATCH semantics
        within a PUT envelope). Omitting `secret` preserves the existing stored
        credential (nil-sentinel pattern).
      properties:
        provider:
          type: string
          description: Provider slug (smtp | ses | sendgrid | mailgun | postmark).
        from_address:
          type: string
          description: Sender envelope address.
        from_name:
          type: string
          description: Sender display name.
        force_from_email:
          type: boolean
        force_from_name:
          type: boolean
        return_path:
          type: boolean
        secret:
          type: string
          nullable: true
          description: >
            Provider credential (API key, SMTP password, etc.). Omit to
            preserve the existing stored secret. Provide an empty string to
            clear the stored secret.
        default_connection:
          type: string
          nullable: true
        fallback_connection:
          type: string
          nullable: true
        log_emails:
          type: boolean
        store_body:
          type: boolean
        retention_days:
          type: integer
          description: Days to retain email log rows (1-365).
        config:
          type: object
          additionalProperties: true
          description: Provider-specific non-secret fields.
        mappings:
          type: object
          additionalProperties: true

    EmailTestRequest:
      type: object
      description: Request body for POST /sites/{siteId}/email/test.
      required: [to]
      properties:
        to:
          type: string
          description: Recipient address for the test email.
        subject:
          type: string
          description: >
            Subject line. Defaults to "WPMgr test email" when omitted.
        body:
          type: string
          description: >
            Plain-text body. Defaults to a standard test message when omitted.

    EmailTestResult:
      type: object
      description: >
        Result of a test-send dispatch. `ok` may be false when the agent returns
        an error or when the agent does not yet implement the command (Phase 1
        expected behaviour — see endpoint description).
      required: [ok]
      properties:
        ok:
          type: boolean
          description: True when the agent confirmed the email was dispatched.
        detail:
          type: string
          nullable: true
          description: >
            Human-readable detail or error message from the agent. Present when
            ok is false.
        message_id:
          type: string
          nullable: true
          description: Provider-assigned message-id returned by the agent (Phase 2+).

    EmailProviderCatalog:
      type: object
      description: Static catalog of supported email providers and their field schemas.
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/EmailProviderSpec"

    EmailProviderSpec:
      type: object
      description: Descriptor for a single email provider.
      required: [slug, label, fields]
      properties:
        slug:
          type: string
          description: Machine-readable provider identifier (e.g. smtp, ses, sendgrid).
        label:
          type: string
          description: Human-readable provider name.
        docs_url:
          type: string
          nullable: true
          description: URL to provider-specific setup documentation.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/EmailProviderField"

    EmailProviderField:
      type: object
      description: Schema descriptor for one provider configuration field.
      required: [key, label, type, is_secret, is_required]
      properties:
        key:
          type: string
          description: Field key used in the `config` map of PutEmailConfigRequest.
        label:
          type: string
          description: Human-readable field label.
        type:
          type: string
          description: >
            Input type hint: text | password | select | boolean | number.
        is_secret:
          type: boolean
          description: >
            When true the field value is a credential that must be sent via
            the top-level `secret` field, not inside `config`.
        is_required:
          type: boolean
        options:
          type: array
          nullable: true
          description: Valid option values for select fields.
          items:
            type: string
        default:
          type: string
          nullable: true
          description: Default value hint for the UI.
        help:
          type: string
          nullable: true
          description: Short helper text shown below the field in the UI.

    # -------------------------------------------------------------------------
    # Email Log (Phase 3)
    # -------------------------------------------------------------------------

    SiteEmailLogEntry:
      type: object
      description: >
        One outgoing email log entry. In list responses `body` is always
        omitted. In the detail response (`GET /email/log/{logId}`) `body` is
        present only when `body_stored` is true and a body was captured.
      required:
        - id
        - tenant_id
        - site_id
        - to_addresses
        - from_address
        - subject
        - provider
        - status
        - response
        - error
        - retries
        - resent_count
        - body_stored
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        agent_seq:
          type: integer
          format: int64
          nullable: true
          description: Agent-local sequence number (cursor for the agent push).
        message_id:
          type: string
          nullable: true
          description: Provider-assigned Message-ID header value.
        to_addresses:
          type: array
          items:
            type: string
          description: Recipient addresses.
        from_address:
          type: string
        subject:
          type: string
        provider:
          type: string
          description: Provider slug used for this send (smtp | ses | sendgrid | mailgun | postmark).
        status:
          type: string
          description: Delivery status (sent | failed | pending | bounced | complained).
        response:
          type: object
          additionalProperties: true
          description: Raw provider API response or SMTP response detail.
        error:
          type: string
          description: Error message when status is failed. Empty string when no error.
        retries:
          type: integer
          description: Number of delivery retries attempted.
        resent_count:
          type: integer
          description: Number of times this message was manually resent.
        body_stored:
          type: boolean
          description: Whether the email body was captured at send time.
        body:
          type: string
          nullable: true
          description: >
            Full email body. Present only in the detail response and only when
            body_stored is true. Never returned in list or export responses.
        connection_key:
          type: string
          description: >
            Named connection slug that sent this email (m62+). Empty string
            when the primary config was used (no named connection).
        attachment_count:
          type: integer
          description: Number of attachments on this email (m62+). Zero when none.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/EmailAttachmentMeta"
          description: >
            Attachment metadata list. Populated in the detail response when
            attachment_count > 0 and the agent sent attachment metadata (m62+).
        created_at:
          type: string
          format: date-time
          description: Timestamp the email was sent (from the agent local clock).
        updated_at:
          type: string
          format: date-time

    EmailLogList:
      type: object
      description: A page of email log entries.
      required: [entries, next_cursor]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SiteEmailLogEntry"
        next_cursor:
          type: string
          description: >
            Opaque keyset cursor for the next page. Empty string when this is
            the last page.

    EmailLogDetail:
      type: object
      description: Single email log entry with prev/next navigation IDs.
      required: [entry]
      properties:
        entry:
          $ref: "#/components/schemas/SiteEmailLogEntry"
        prev_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the next-older entry (for the Prev button). Null when at the oldest.
        next_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the next-newer entry (for the Next button). Null when at the newest.

    EmailStatsByDay:
      type: object
      description: One day's aggregate email stats.
      required: [day, total, sent_count, failed_count, bounced_count, complained_count]
      properties:
        day:
          type: string
          description: Calendar day in YYYY-MM-DD format (UTC).
        total:
          type: integer
          format: int64
        sent_count:
          type: integer
          format: int64
        failed_count:
          type: integer
          format: int64
        bounced_count:
          type: integer
          format: int64
          description: Number of emails with status=bounced on this day.
        complained_count:
          type: integer
          format: int64
          description: Number of emails with status=complained (spam complaint) on this day.

    EmailStatsByProvider:
      type: object
      description: One provider's aggregate email stats.
      required: [provider, total, sent_count, failed_count]
      properties:
        provider:
          type: string
        total:
          type: integer
          format: int64
        sent_count:
          type: integer
          format: int64
        failed_count:
          type: integer
          format: int64

    EmailStats:
      type: object
      description: >
        Email statistics summary for a site or the whole fleet.
        `site_count` is only populated for fleet stats.
      required: [total, sent_count, failed_count, bounced_count, complained_count, provider_count, by_day, by_provider]
      properties:
        total:
          type: integer
          format: int64
        sent_count:
          type: integer
          format: int64
        failed_count:
          type: integer
          format: int64
        bounced_count:
          type: integer
          format: int64
          description: Total bounced emails in the range.
        complained_count:
          type: integer
          format: int64
          description: Total spam complaints in the range.
        provider_count:
          type: integer
          format: int64
          description: Number of distinct providers used in the range.
        site_count:
          type: integer
          format: int64
          nullable: true
          description: Number of distinct sites in the range (fleet stats only).
        by_day:
          type: array
          items:
            $ref: "#/components/schemas/EmailStatsByDay"
        by_provider:
          type: array
          items:
            $ref: "#/components/schemas/EmailStatsByProvider"

    # -------------------------------------------------------------------------
    # Deliverability report (GET /email/deliverability)
    # -------------------------------------------------------------------------

    SiteDeliveryItem:
      type: object
      description: |
        Per-site deliverability aggregate for the GET /email/deliverability
        dashboard. `bounce_rate` and `complaint_rate` are expressed as a
        percentage (0–100). Frontend reputation thresholds:
          bounce_rate: warn ≥2%, danger ≥5%
          complaint_rate: warn ≥0.05%, danger ≥0.1%
      required:
        - site_id
        - site_name
        - site_url
        - provider
        - total
        - sent_count
        - failed_count
        - bounced_count
        - complained_count
        - bounce_rate
        - complaint_rate
        - sparkline
      properties:
        site_id:
          type: string
          format: uuid
        site_name:
          type: string
        site_url:
          type: string
        provider:
          type: string
          description: Active email provider for this site (empty when unconfigured).
        total:
          type: integer
          format: int64
        sent_count:
          type: integer
          format: int64
        failed_count:
          type: integer
          format: int64
        bounced_count:
          type: integer
          format: int64
        complained_count:
          type: integer
          format: int64
        bounce_rate:
          type: number
          format: float
          description: bounced/total*100 (0 when total=0).
        complaint_rate:
          type: number
          format: float
          description: complained/total*100 (0 when total=0).
        last_sent_at:
          type: string
          format: date-time
          nullable: true
          description: When the most recent successfully-sent email was dispatched. Null when no sent email in the window.
        sparkline:
          type: array
          items:
            type: integer
            format: int64
          description: Daily sent counts across the window, oldest→newest. Always [] never null.

    DeliverabilityReport:
      type: object
      description: >
        Response for GET /email/deliverability. Contains per-site deliverability
        aggregates sorted by bounce_rate DESC then total DESC (riskiest first).
      required: [window_days, items]
      properties:
        window_days:
          type: integer
          description: The window used for the query (clamped 1–365).
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteDeliveryItem"
          description: Per-site rows. Always [] never null.

    # -------------------------------------------------------------------------
    # Phase 4a — Suppression + log actions schemas
    # -------------------------------------------------------------------------

    EmailSuppressionEntry:
      type: object
      description: |
        A single suppression entry. `email` is the plaintext address (present
        when `store_plaintext=true` at create time). `email_hash` is always
        present (SHA-256 of the lower-cased address, hex-encoded) for
        privacy-preserving checks without storing the full address.
      required: [id, tenant_id, email_hash, reason, provider, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
          nullable: true
          description: Null for fleet-wide entries (applies to all sites in tenant).
        email_hash:
          type: string
          description: SHA-256 of the lower-cased email address (hex).
        email:
          type: string
          format: email
          nullable: true
          description: Plaintext email address (null when not stored at create time).
        reason:
          type: string
          description: hard_bounce | complaint | unsubscribe | manual
        provider:
          type: string
          description: ses | sendgrid | mailgun | postmark | manual
        event_at:
          type: string
          format: date-time
          nullable: true
          description: When the provider event occurred (null for manual entries).
        source_message_id:
          type: string
          nullable: true
          description: Provider message ID that triggered this suppression (if known).
        created_at:
          type: string
          format: date-time

    EmailSuppressionPage:
      type: object
      required: [entries, has_more]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/EmailSuppressionEntry"
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    AddSuppressionRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email address to suppress.
        reason:
          type: string
          default: manual
          description: |
            Must be `manual` or `unsubscribe`. Hard_bounce and complaint entries
            are created automatically via provider webhooks.

    ResendEmailResult:
      type: object
      required: [ok]
      description: |
        Result of a resend_email agent command. `ok=true` means the agent
        confirmed the email was re-dispatched. `ok=false` means the agent was
        unavailable or returned an error — check `detail` for the reason.
        HTTP 200 is returned in both cases (matches test-send pattern).
      properties:
        ok:
          type: boolean
        detail:
          type: string
          nullable: true
          description: Agent response message or error detail.
        message_id:
          type: string
          nullable: true
          description: Provider message ID assigned to the resent email (if agent returned it).

    BulkResendRequest:
      type: object
      required: [log_ids]
      properties:
        log_ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
          description: List of log entry IDs to resend (max 100).

    BulkResendItemResult:
      type: object
      required: [log_id, ok]
      properties:
        log_id:
          type: string
          format: uuid
        ok:
          type: boolean
        detail:
          type: string
          nullable: true

    BulkResendResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BulkResendItemResult"

    BulkDeleteLogsRequest:
      type: object
      required: [log_ids]
      properties:
        log_ids:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
          description: List of log entry IDs to delete (max 500).

    BulkDeleteLogsResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          format: int64
          description: Number of rows actually deleted (may be less than requested if some IDs did not exist).

    # -------------------------------------------------------------------------
    # m62 — Multi-connection, attachment metadata, alerts/digest
    # -------------------------------------------------------------------------

    EmailAttachmentMeta:
      type: object
      description: Metadata for one email attachment (m62+).
      required: [name, size_bytes]
      properties:
        name:
          type: string
          description: Attachment filename (directory path stripped, max 255 runes).
        size_bytes:
          type: integer
          format: int64
          description: Attachment size in bytes (0 when unknown).

    EmailConnection:
      type: object
      description: >
        A named provider connection belonging to a site's email config (m62+).
        The provider secret is never returned — only `secret_set` indicates
        whether a credential is stored.
      required:
        - id
        - tenant_id
        - config_id
        - connection_key
        - provider
        - from_address
        - from_name
        - secret_set
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key.
        tenant_id:
          type: string
          format: uuid
        config_id:
          type: string
          format: uuid
          description: ID of the parent SiteEmailConfig row.
        connection_key:
          type: string
          description: >
            Operator-chosen slug (^[a-z0-9][a-z0-9_-]{0,31}$). The value
            'default' is reserved for the primary config row and cannot be
            used for named connections.
        provider:
          type: string
          description: Provider slug (smtp | ses | sendgrid | mailgun | postmark).
        from_address:
          type: string
          description: Sender envelope address for this connection.
        from_name:
          type: string
          description: Sender display name for this connection.
        config:
          type: object
          additionalProperties: true
          description: Provider-specific non-secret fields.
        secret_set:
          type: boolean
          description: True when an encrypted provider secret is stored for this connection.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PutEmailConnectionRequest:
      type: object
      description: >
        Request body for PUT /sites/{siteId}/email/connections/{connKey}.
        All fields are optional — omitted fields are unchanged (PATCH semantics
        within a PUT envelope). Omitting `secret` preserves the existing stored
        credential (nil-sentinel pattern).
      properties:
        provider:
          type: string
          description: Provider slug (smtp | ses | sendgrid | mailgun | postmark).
        from_address:
          type: string
          description: Sender envelope address for this connection.
        from_name:
          type: string
          description: Sender display name for this connection.
        config:
          type: object
          additionalProperties: true
          description: Provider-specific non-secret fields.
        secret:
          type: string
          nullable: true
          description: >
            Provider credential. Omit to preserve the existing stored secret.
            Provide an empty string to clear it.

    EmailNotifySettings:
      type: object
      description: >
        Per-tenant email alert and digest settings (m62+).
        Returns sensible defaults (enabled=false, digest_enabled=false)
        when no settings row has been created yet — this endpoint never 404s.
        `recipients` is a single shared list used for both per-failure alerts
        and the digest.
      required:
        - enabled
        - recipients
        - alert_on_failure
        - alert_throttle_minutes
        - digest_enabled
        - digest_cadence
        - digest_day
        - digest_hour
        - timezone
        - instance_mailer_configured
      properties:
        enabled:
          type: boolean
          description: >
            Master switch for email notifications. Both alerts and the digest
            require this to be true in addition to their own toggle.
        recipients:
          type: array
          maxItems: 20
          items:
            type: string
            format: email
          description: >
            Shared recipient list for both per-failure alerts and the digest
            (max 20).
        alert_on_failure:
          type: boolean
          description: Whether per-failure email alerts are active.
        alert_throttle_minutes:
          type: integer
          description: >
            Minimum minutes between two alerts for the same site (15-1440).
            Default 60.
        digest_enabled:
          type: boolean
          description: Whether the scheduled digest email is active.
        digest_cadence:
          type: string
          enum: [daily, weekly, monthly]
          description: >
            How often the digest is sent. Only enforced when digest_enabled
            is true.
        digest_day:
          type: integer
          description: >
            For weekly cadence: 0=Sunday...6=Saturday. For monthly cadence:
            1-28. Not used for daily cadence. Only enforced when
            digest_enabled is true.
        digest_hour:
          type: integer
          description: >
            Hour (0-23), in `timezone`, at which the digest fires. Default 8.
        timezone:
          type: string
          description: IANA timezone used to evaluate digest_hour/digest_day.
        next_digest_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Next scheduled digest send time, or null when the digest is
            disabled or not yet scheduled.
        instance_mailer_configured:
          type: boolean
          description: >
            True when the instance-level SMTP/mailer is configured. Alerts
            and digests require this to be true to deliver.
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: Present when a settings row exists; absent for default response.
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    PutEmailNotifySettingsRequest:
      type: object
      description: >
        Request body for PUT /email/notify-settings. This is a full replace
        (not a PATCH) — every field is required. digest_cadence/digest_day/
        digest_hour/timezone are only validated when digest_enabled is true.
      required:
        - enabled
        - recipients
        - alert_on_failure
        - alert_throttle_minutes
        - digest_enabled
        - digest_cadence
        - digest_day
        - digest_hour
        - timezone
      properties:
        enabled:
          type: boolean
        recipients:
          type: array
          maxItems: 20
          items:
            type: string
            format: email
          description: Replace the shared recipients list (max 20).
        alert_on_failure:
          type: boolean
          description: Whether per-failure email alerts are active.
        alert_throttle_minutes:
          type: integer
          description: Minimum minutes between alerts per site (15-1440).
        digest_enabled:
          type: boolean
        digest_cadence:
          type: string
          enum: [daily, weekly, monthly]
          description: >
            Required when digest_enabled is true; ignored otherwise. For
            'weekly'/'monthly', digest_day must also be set.
        digest_day:
          type: integer
          description: >
            0-6 for weekly, 1-28 for monthly. Not required for daily cadence
            or when digest_enabled is false.
        digest_hour:
          type: integer
          description: Hour (0-23) at which the digest fires.
        timezone:
          type: string
          description: IANA timezone, e.g. "UTC".

    # -------------------------------------------------------------------------
    # Clients (m63 Foundation)
    # -------------------------------------------------------------------------

    AgencyClient:
      type: object
      required: [id, tenant_id, name, site_count, timezone, created_at, updated_at]
      description: An agency client record that groups sites under a customer entity.
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name for the client.
        company:
          type: string
          description: Optional company / business name.
        contact_email:
          type: string
          format: email
          description: Optional primary contact email address.
        phone:
          type: string
          description: Optional contact phone number.
        notes:
          type: string
          description: Internal operator notes (not shown to the client).
        color:
          type: string
          description: Hex color for the color badge (e.g. "#3b82f6"). Empty when unset.
        logo_url:
          type: string
          format: uri
          description: URL of the client's logo. Empty when unset.
        site_count:
          type: integer
          format: int64
          description: Number of non-archived sites currently assigned to this client.
        timezone:
          type: string
          description: IANA timezone name governing report send time (e.g. "America/New_York"). Defaults to "UTC".
          example: UTC
        archived_at:
          type: string
          format: date-time
          description: Set when the client is soft-deleted (archived). Absent for active clients.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgencyClientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgencyClient"

    CreateAgencyClientRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        company:
          type: string
          maxLength: 200
        contact_email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          maxLength: 80
        notes:
          type: string
          maxLength: 2000
        color:
          type: string
          description: Hex color code (e.g. "#3b82f6").
        logo_url:
          type: string
          format: uri
        timezone:
          type: string
          description: IANA timezone name (e.g. "America/New_York"). Defaults to "UTC" when absent.

    UpdateAgencyClientRequest:
      type: object
      description: All fields are optional (PATCH semantics).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        company:
          type: string
          maxLength: 200
        contact_email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          maxLength: 80
        notes:
          type: string
          maxLength: 2000
        color:
          type: string
          description: Hex color code (e.g. "#3b82f6"). Pass empty string to clear.
        logo_url:
          type: string
          format: uri
        timezone:
          type: string
          description: IANA timezone name (e.g. "America/New_York"). Omit to leave unchanged.

    AssignSitesRequest:
      type: object
      required: [site_ids]
      properties:
        client_id:
          type: string
          format: uuid
          nullable: true
          description: UUID of the client to assign. Omit or pass null to unassign the sites.
        site_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 500
          description: List of site UUIDs to assign (or unassign).

    AssignSitesResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          format: int64
          description: Number of sites whose client assignment was changed.

    ClientReportSectionFlags:
      type: object
      description: Controls which data sections are included in a report.
      properties:
        overview:
          type: boolean
          default: true
        uptime:
          type: boolean
          default: true
        backups:
          type: boolean
          default: true
        updates:
          type: boolean
          default: true
        performance:
          type: boolean
          default: true
        email:
          type: boolean
          default: false

    ClientReportSchedule:
      type: object
      required: [client_id, enabled, cadence, send_day, send_hour, recipients, sections, intro_text, closing_text, powered_by_removed, instance_mailer_configured]
      description: Report schedule configuration for an agency client.
      properties:
        client_id:
          type: string
          format: uuid
        enabled:
          type: boolean
          description: Whether scheduled sending is active.
        cadence:
          type: string
          enum: [weekly, monthly]
          description: How often to send. "monthly" sends on the Nth day of the month; "weekly" sends on the Nth day of the week (0=Sunday).
        send_day:
          type: integer
          description: "For monthly: day-of-month (1–28). For weekly: day-of-week (0=Sunday … 6=Saturday)."
        send_hour:
          type: integer
          minimum: 0
          maximum: 23
          description: Hour-of-day in the client's timezone at which the report is sent.
        timezone:
          type: string
          description: IANA timezone name inherited from the client record. Informational only; update via PUT /clients/{clientId}.
        recipients:
          type: array
          items:
            type: string
            format: email
          description: Email addresses to deliver the report to.
        sections:
          $ref: "#/components/schemas/ClientReportSectionFlags"
        intro_text:
          type: string
          description: Optional opening paragraph for the report body (supports plain text).
        closing_text:
          type: string
          description: Optional closing paragraph for the report body.
        powered_by_removed:
          type: boolean
          description: When true, the "Powered by WPMgr" footer is omitted (white-label plan).
        next_run_at:
          type: string
          format: date-time
          description: Next scheduled execution time. Absent when disabled.
        last_run_at:
          type: string
          format: date-time
          description: Most recent execution time. Absent when never run.
        instance_mailer_configured:
          type: boolean
          description: Whether the instance-level SMTP mailer is configured. When false, recipients will not receive emails even if the schedule is enabled.

    ClientReportScheduleUpdate:
      type: object
      description: All fields are required (full replace).
      required: [enabled, cadence, send_day, send_hour, recipients]
      properties:
        enabled:
          type: boolean
        cadence:
          type: string
          enum: [weekly, monthly]
        send_day:
          type: integer
        send_hour:
          type: integer
          minimum: 0
          maximum: 23
        recipients:
          type: array
          items:
            type: string
            format: email
          maxItems: 20
        sections:
          $ref: "#/components/schemas/ClientReportSectionFlags"
        intro_text:
          type: string
          maxLength: 2000
        closing_text:
          type: string
          maxLength: 2000
        powered_by_removed:
          type: boolean

    GenerateClientReportRequest:
      type: object
      description: Optional overrides for an on-demand report. Omit entirely to use schedule defaults.
      properties:
        period_start:
          type: string
          format: date-time
          description: Start of the data window (inclusive). Defaults to 30 days ago when absent.
        period_end:
          type: string
          format: date-time
          description: End of the data window (exclusive). Defaults to now when absent.
        sections:
          $ref: "#/components/schemas/ClientReportSectionFlags"
        notify:
          type: boolean
          default: false
          description: When true, the report is emailed to the schedule's recipients on completion.

    ClientReport:
      type: object
      required: [id, client_id, period_start, period_end, status, created_at]
      description: A generated client report record.
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
          description: Set when the report was triggered by a schedule; absent for on-demand.
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        status:
          type: string
          enum: [queued, generating, completed, failed]
        error:
          type: string
          description: Human-readable error message. Present only when status is "failed".
        html_url:
          type: string
          format: uri
          description: Pre-signed URL for the HTML report (valid 7 days). Present only when status is "completed" and object storage is configured.
        pdf_url:
          type: string
          format: uri
          description: Pre-signed URL for the PDF report (valid 7 days). Present only when status is "completed" and object storage is configured.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          description: When the generation job finished (success or failure).

    ClientReportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientReport"
        next_cursor:
          type: string
          description: Opaque keyset cursor. Pass as `cursor` in the next request to fetch the next page. Absent when there are no more pages.

    # ---------------------------------------------------------------------------
    # m66 — Client member management schemas
    # ---------------------------------------------------------------------------

    ClientMember:
      type: object
      required: [user_id, email, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time

    ClientMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientMember"

    ClientMemberCreateRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ClientMemberInviteResult:
      type: object
      required: [email, email_sent]
      properties:
        email:
          type: string
          format: email
        invited:
          type: boolean
          description: True when an invitation was created (unknown email); false when an existing user was added directly.
        email_sent:
          type: boolean
          description: "True when the invitation email was successfully enqueued and SMTP is configured. False when SMTP is unconfigured or enqueue failed — the accept_link is always returned as the copy-link fallback."
        user_id:
          type: string
          format: uuid
          description: Present when invited=false (the user already existed).
        created_at:
          type: string
          format: date-time
          description: Present when invited=false.
        accept_link:
          type: string
          description: Always present. The invite accept URL (copyable fallback when SMTP is unconfigured).
        invitation_id:
          type: string
          format: uuid
          description: Present when invited=true.
        expires_at:
          type: string
          format: date-time
          description: Present when invited=true.

    ClientInvitation:
      type: object
      required: [id, email, created_at, expires_at, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          description: "Derived status: pending, accepted, expired, or revoked."
          enum: [pending, accepted, expired, revoked]

    ClientInvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientInvitation"

