    AdminSiteTenancy:
      type: object
      required: [site_id, site_found, site_tenant_id, site_tenant_name, site_url, data_tenants, your_memberships, site_shares, verdict]
      properties:
        site_id: { type: string, format: uuid }
        site_found: { type: boolean }
        site_tenant_id: { type: string, format: uuid }
        site_tenant_name: { type: string }
        site_url: { type: string }
        data_tenants:
          type: array
          items: { $ref: "#/components/schemas/AdminTenancyRef" }
        your_memberships:
          type: array
          items: { $ref: "#/components/schemas/AdminTenancyRef" }
        site_shares:
          type: array
          items: { $ref: "#/components/schemas/AdminTenancyRef" }
        verdict:
          type: object
          required: [site_matches_data, you_can_see_perf_data]
          properties:
            site_matches_data: { type: boolean }
            you_can_see_perf_data: { type: boolean }
    AdminGrantSelfMembershipResult:
      type: object
      required: [ok, tenant_id, tenant_name, added, detail]
      properties:
        ok: { type: boolean }
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string }
        added: { type: boolean }
        detail: { type: string }
    AdminAccountsTenancy:
      type: object
      required: [users, orgs]
      properties:
        users:
          type: array
          items:
            type: object
            required: [id, email, is_superadmin, memberships]
            properties:
              id: { type: string, format: uuid }
              email: { type: string, format: email }
              is_superadmin: { type: boolean }
              memberships:
                type: array
                items:
                  type: object
                  required: [tenant_id, tenant_name, role]
                  properties:
                    tenant_id: { type: string, format: uuid }
                    tenant_name: { type: string }
                    role: { type: string }
        orgs:
          type: array
          items:
            type: object
            required: [tenant_id, tenant_name, site_count, member_count]
            properties:
              tenant_id: { type: string, format: uuid }
              tenant_name: { type: string }
              site_count: { type: integer, format: int64 }
              member_count: { type: integer, format: int64 }
    AdminVulnFeedStatus:
      type: object
      required: [configured, source, feed_ok, record_count, enrichment_available]
      properties:
        configured: { type: boolean }
        source: { type: string, enum: [ui, env, none] }
        feed_ok: { type: boolean }
        record_count: { type: integer }
        last_synced: { type: string, format: date-time }
        last_error: { type: string }
        enrichment_available:
          type: boolean
          description: True when the Production feed has successfully enriched findings with CVSS/CVE data, independent of feed_ok (which tracks Scanner-driven detection freshness).
        last_enrichment_at: { type: string, format: date-time }

    # ---------------------------------------------------------------------------
    # Agent protocol — activity / diagnostics / errors / security ingest
    # ---------------------------------------------------------------------------
    AgentActivityIngestRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            type: object
            required: [seq, event_type, object_type, object_id, this_hash, prev_hash, occurred_at]
            properties:
              seq: { type: integer, format: int64 }
              event_type: { type: string }
              object_type: { type: string }
              object_id: { type: string }
              object_label: { type: string }
              actor_user_id: { type: integer, format: int64 }
              actor_login: { type: string }
              actor_ip: { type: string }
              summary: { type: string }
              meta:
                type: object
                description: >-
                  Verbatim wire bytes as emitted by the agent's wp_json_encode, hashed exactly as sent, never re-serialized.
              prev_hash: { type: string }
              this_hash: { type: string }
              occurred_at: { type: string, format: date-time }
        chain_start_seq: { type: integer, format: int64 }
        agent_version: { type: string }
    AgentErrorBatch:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            description: >-
              Numeric fields may arrive as a JSON number or a numeric string
              (the agent's wpdb ARRAY_A encodes numeric columns as strings).
            required: [md5, severity, message]
            properties:
              id: { type: string }
              md5: { type: string }
              code: { type: string }
              severity: { type: string }
              message: { type: string }
              file: { type: string }
              line: { type: string }
              request_path: { type: string }
              first_seen: { type: string }
              last_seen: { type: string }
              occurrence_count: { type: string }
              backtrace:
                type: array
                items:
                  type: object
                  properties:
                    file: { type: string }
                    line: { type: string }
                    function: { type: string }
    AgentLoginEventBatch:
      type: object
      required: [login_events]
      properties:
        login_events:
          type: array
          items:
            type: object
            description: >-
              Numeric fields may arrive as a JSON number or a numeric string
              (the agent's wpdb ARRAY_A encodes numeric columns as strings).
            required: [ip, status, category]
            properties:
              id: { type: string }
              ip: { type: string }
              status: { type: string }
              category: { type: string }
              username: { type: string }
              request_id: { type: string }
              occurred_at: { type: string }

    # ---------------------------------------------------------------------------
    # Agent protocol — Performance Suite callbacks
    # ---------------------------------------------------------------------------
    AgentCacheStatsReport:
      type: object
      properties:
        cached_pages_count: { type: integer }
        cache_size_bytes: { type: integer, format: int64 }
        last_purged_at: { type: integer, format: int64, description: Unix seconds. }
        last_purge_kind: { type: string }
        last_preload_at: { type: integer, format: int64, description: Unix seconds. }
        preload_pending: { type: integer }
        preload_total: { type: integer }
        cache_hit_count: { type: integer, format: int64 }
        cache_miss_count: { type: integer, format: int64 }
        woo_theme_fragments_supported: { type: boolean, nullable: true }
        object_cache:
          type: object
          description: >-
            Optional M68 object-cache heartbeat + stats-delta block; silently
            dropped when malformed or when the Object Cache feature is not
            wired.
          properties:
            state: { type: string, enum: ["", disabled, connected, degraded, down] }
            latency_ms: { type: number, format: double }
            last_error_class: { type: string }
            hit_ratio_window_pct: { type: number, format: double }
            used_memory_bytes: { type: integer, format: int64 }
            engine_version: { type: string }
            config_hash: { type: string }
            hit_count: { type: integer, format: int64 }
            miss_count: { type: integer, format: int64 }
            avg_wait_ms: { type: number, format: double }
            ops_per_sec: { type: number, format: double }
            evicted_keys_delta: { type: integer, format: int64 }
            connected_clients: { type: integer }
    AgentPerfConfigAck:
      type: object
      required: [config_version, server_software, dropin_installed, wp_cache_constant_set, htaccess_managed]
      properties:
        config_version: { type: integer }
        server_software: { type: string }
        dropin_installed: { type: boolean }
        wp_cache_constant_set: { type: boolean }
        htaccess_managed: { type: boolean }
        rum_beacon_present:
          type: boolean
          nullable: true
          description: >-
            GH #174 — whether the agent currently holds a non-empty
            rum_beacon_key. Absent (not false) when a pre-#174 agent does not
            report it.
    AgentDbCleanProgress:
      type: object
      required: [job_id, category, state, done]
      properties:
        job_id: { type: string }
        category: { type: string }
        rows_deleted: { type: integer }
        bytes_freed: { type: integer }
        state: { type: string }
        detail: { type: string }
        done: { type: boolean }
    AgentDbOrphanDeleteProgress:
      type: object
      required: [job_id, done]
      properties:
        job_id: { type: string }
        results:
          type: array
          description: Per-item result rows for the items processed in this batch.
          items:
            type: object
            properties:
              kind: { type: string }
              name: { type: string }
              status: { type: string }
              detail: { type: string }
        deleted_options: { type: integer }
        deleted_cron: { type: integer }
        deleted_tables: { type: integer }
        skipped: { type: integer }
        done: { type: boolean }
    AgentAutoOptimizeRequest:
      type: object
      required: [attachments]
      properties:
        attachments:
          type: array
          items:
            type: object
            required: [wp_attachment_id]
            properties:
              wp_attachment_id: { type: integer, format: int64 }
              title: { type: string }
              original_path: { type: string }
              original_url: { type: string }
              original_mime: { type: string }
              original_width: { type: integer, nullable: true }
              original_height: { type: integer, nullable: true }
              original_size_bytes: { type: integer, format: int64 }
              variant_count: { type: integer }
              saved_bytes: { type: integer, format: int64 }

    # ---------------------------------------------------------------------------
    # Agent protocol — m59 email log ingest + suppression fetch
    # ---------------------------------------------------------------------------
    AgentEmailLogIngestRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [agent_seq, status]
            properties:
              agent_seq: { type: integer, format: int64 }
              message_id: { type: string }
              to_addresses:
                type: array
                items: { type: string }
              from_address: { type: string }
              subject: { type: string }
              provider: { type: string }
              status: { type: string, enum: [sent, failed] }
              response:
                description: Provider response — any JSON shape (string, object, or absent).
              error: { type: string }
              retries: { type: integer }
              resent_count: { type: integer }
              body_stored: { type: boolean }
              body: { type: string, nullable: true }
              created_at:
                description: Any parseable timestamp (RFC3339 or a MySQL-style string); unparseable values default to now.
              connection_key: { type: string }
              attachments:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    size_bytes: { type: integer, format: int64 }
    AgentSuppressionDeltaPage:
      type: object
      required: [entries, next_cursor]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [id, tenant_id, reason, provider, created_at]
            properties:
              id: { type: string }
              tenant_id: { type: string, format: uuid }
              site_id: { type: string, nullable: true }
              email: { type: string, nullable: true }
              reason: { type: string }
              provider: { type: string }
              event_at: { type: string, format: date-time, nullable: true }
              source_message_id: { type: string, nullable: true }
              created_at: { type: string, format: date-time }
        next_cursor: { type: string }

    # ---------------------------------------------------------------------------
    # Agent protocol — M4 / M5.6 backup callbacks
    # ---------------------------------------------------------------------------
    AgentChunkRef:
      type: object
      required: [blake3, size]
      properties:
        blake3: { type: string }
        size: { type: integer, format: int64 }
    AgentPresignChunksRequest:
      type: object
      required: [snapshot_id, hashes]
      properties:
        snapshot_id: { type: string, format: uuid }
        hashes:
          type: array
          items: { type: string }
          description: Candidate ciphertext chunk hashes (blake3, hex) the agent produced.
    AgentPresignChunksResponse:
      type: object
      required: [uploads, ttl_seconds]
      properties:
        uploads:
          type: object
          description: blake3 hash -> presigned PUT URL, for hashes NOT already stored for the tenant.
          additionalProperties: { type: string }
        ttl_seconds: { type: integer }
    AgentManifestEntry:
      type: object
      required: [path, entry_kind, mode, size, chunks]
      properties:
        path: { type: string }
        entry_kind: { type: string }
        table_name: { type: string }
        mode: { type: integer }
        size: { type: integer, format: int64 }
        chunks:
          type: array
          items: { $ref: "#/components/schemas/AgentChunkRef" }
    AgentSubmitManifestRequest:
      type: object
      required: [snapshot_id, age_recipient, entries]
      properties:
        snapshot_id: { type: string, format: uuid }
        age_recipient: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/AgentManifestEntry" }
        cycle_files_scanned: { type: integer, format: int64 }
        cycle_files_changed: { type: integer, format: int64 }
        cycle_files_deleted: { type: integer, format: int64 }
        cycle_bytes_uploaded: { type: integer, format: int64 }
    AgentSubmitManifestResponse:
      type: object
      required: [ok, chunk_count, stored_count]
      properties:
        ok: { type: boolean }
        chunk_count: { type: integer, format: int64 }
        stored_count: { type: integer, format: int64 }
