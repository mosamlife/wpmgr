        name: { type: string }
        url: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        duration_seconds: { type: integer, format: int64, nullable: true }
        ongoing: { type: boolean }
        peak_status: { type: string }
        last_http_status: { type: integer }
        reason: { type: string }
        incident_count_30d: { type: integer }
        probes:
          type: array
          items:
            type: object
            required: [probed_at, up, http_status, total_ms]
            properties:
              probed_at: { type: string, format: date-time }
              up: { type: boolean }
              http_status: { type: integer }
              total_ms: { type: number, format: double }
              error: { type: string }
        probes_truncated: { type: boolean }

    # ---------------------------------------------------------------------------
    # Public endpoints — RUM beacon ingest + live pricing
    # ---------------------------------------------------------------------------
    RumBeacon:
      type: object
      required: [key, url, metric, value]
      properties:
        key:
          type: string
          description: Per-site beacon key (base64url). The sole access credential for this endpoint.
        url:
          type: string
          description: The full page URL (window.location.href); normalised server-side to a path pattern.
        metric:
          type: string
          enum: [lcp, inp, cls, ttfb, fcp]
        value:
          type: integer
          format: int32
          description: Raw metric value. Milliseconds for timing metrics; milli-units (value*1000) for CLS.
        device:
          type: string
          enum: [desktop, mobile, tablet]
        country:
          type: string
          description: ISO-3166-1 alpha-2 code. Falls back to "__other__" when absent/invalid.
        conn:
          type: string
          enum: ["4g", "3g", "2g", "slow-2g", "offline", "unknown"]
    PriceQuote:
      type: object
      required: [amount, currency, interval]
      properties:
        amount: { type: integer, format: int64, description: Minor currency units (e.g. cents). }
        currency: { type: string }
        interval: { type: string, description: "e.g. month" }
    PublicPricing:
      type: object
      required: [currency_default, tiers]
      properties:
        currency_default: { type: string }
        tiers:
          type: array
          items:
            type: object
            description: >-
              A free tier renders flat `{id,amount,currency,interval}`
              fields; a paid tier renders `{id,usd?,inr?}` — only the
              provider/currency pairs this instance actually resolved a
              price for.
            required: [id]
            properties:
              id: { type: string }
              amount: { type: integer, format: int64 }
              currency: { type: string }
              interval: { type: string }
              usd: { $ref: "#/components/schemas/PriceQuote" }
              inr: { $ref: "#/components/schemas/PriceQuote" }

    # ---------------------------------------------------------------------------
    # Performance Suite — DB cleaner / cache health / RUM trend
    # ---------------------------------------------------------------------------
    DbHealth:
      type: object
      description: Database-size trend and growth summary (M42 Phase 3.4).
      required: [points, growth_bytes, growth_pct]
      properties:
        points:
          type: array
          items:
            type: object
            properties:
              recorded_at: { type: string, format: date-time }
              db_size_bytes: { type: integer, format: int64 }
        growth_bytes: { type: integer, format: int64 }
        growth_pct: { type: number, format: double }
    CacheHealth:
      type: object
      description: Cache hit-ratio trend and average (M52 / #162).
      required: [points, avg_ratio_pct]
      properties:
        points:
          type: array
          items:
            type: object
            properties:
              hit_count: { type: integer, format: int64 }
              miss_count: { type: integer, format: int64 }
              ratio_pct: { type: number, format: double }
        avg_ratio_pct: { type: number, format: double }
    DbOrphanItem:
      type: object
      description: One classified candidate-orphan artifact (P3.5).
      required: [name, confidence, installed, deletable_eligible]
      properties:
        name: { type: string }
        owner_slug: { type: string }
        confidence:
          type: string
          enum: [exact, prefix, heuristic, unknown]
        known_plugins:
          type: array
          items: { type: string }
        installed: { type: boolean }
        deletable_eligible: { type: boolean }
        size_bytes: { type: integer, format: int64 }
        autoload: { type: boolean, nullable: true }
        next_run_at: { type: integer, format: int64, nullable: true }
        recurrence: { type: string }
        rows: { type: integer, format: int64, nullable: true }
    DbOrphansReport:
      type: object
      required: [options, cron, tables, corpus_version, snapshot_available, hidden_installed, counts]
      properties:
        options:
          type: array
          items: { $ref: "#/components/schemas/DbOrphanItem" }
        cron:
          type: array
          items: { $ref: "#/components/schemas/DbOrphanItem" }
        tables:
          type: array
          items: { $ref: "#/components/schemas/DbOrphanItem" }
        corpus_version: { type: integer }
        snapshot_available: { type: boolean }
        hidden_installed: { type: integer }
        counts:
          type: object
          required: [options, cron, tables, deletable]
          properties:
            options: { type: integer }
            cron: { type: integer }
            tables: { type: integer }
            deletable: { type: integer }
    DbOrphanDeleteRequest:
      type: object
      required: [items, confirm]
      properties:
        items:
          type: array
          items:
            type: object
            required: [kind, name, owner_slug]
            properties:
              kind: { type: string, enum: [option, cron, table] }
              name: { type: string }
              owner_slug: { type: string }
        confirm:
          type: string
          description: Type-to-confirm token; the agent enforces it independently.
    DbOrphanDeleteResponse:
      type: object
      required: [ok, job_id, accepted_count, dropped_count]
      properties:
        ok: { type: boolean }
        job_id: { type: string }
        accepted_count: { type: integer }
        dropped_count:
          type: integer
          description: Items dropped by the CP re-classify (no longer eligible or owner_slug drifted).
        backup_warning: { type: string }
    DbTableActionRequest:
      type: object
      required: [action, tables]
      properties:
        action:
          type: string
          enum: [optimize, repair, drop, empty, analyze, convert_innodb]
        tables:
          type: array
          items: { type: string }
        confirm:
          type: string
          description: Required type-to-confirm token for drop/empty.
    DbTableActionResponse:
      type: object
      required: [ok, job_id, action]
      properties:
        ok: { type: boolean }
        job_id: { type: string }
        action: { type: string }
        results:
          type: object
          description: Per-table result, keyed by table name (agent-defined shape).
        backup_warning: { type: string }
    DbCleanStatus:
      type: object
      required: [clean_active, active_job_id, active_started_at, last_result]
      properties:
        clean_active: { type: boolean }
        active_job_id: { type: string, nullable: true }
        active_started_at: { type: string, format: date-time, nullable: true }
        last_result:
          type: object
          nullable: true
          required: [job_id, rows_deleted, bytes_freed, result, cleaned_at]
          properties:
            job_id: { type: string }
            rows_deleted: { type: integer, format: int64 }
            bytes_freed: { type: integer, format: int64 }
            result:
              type: object
              description: Per-category {rows_deleted,bytes_freed,state} map.
            cleaned_at: { type: string, format: date-time }
    RumTrendDayPoint:
      type: object
      required: [day, p75_ms, sample_count, rating, suppressed]
      properties:
        day: { type: string, description: "YYYY-MM-DD" }
        p75_ms: { type: number, format: double, description: "0 when suppressed" }
        sample_count: { type: integer, format: int64 }
        rating: { type: string, enum: ["good", "needs-improvement", "poor", ""] }
        suppressed: { type: boolean }
    RumTrend:
      type: object
      required: [window_days, min_sample_count, metrics]
      properties:
        window_days: { type: integer }
        min_sample_count: { type: integer }
        metrics:
          type: object
          description: Keyed by metric name (lcp, inp, cls, fcp, ttfb); each value is an ascending-by-day series.
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/RumTrendDayPoint" }

