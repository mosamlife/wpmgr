name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- Go API ----
  go:
    name: Go (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/api/go.sum

      # Build the api module on its own (workspace disabled) so it does not
      # depend on sibling modules in the go.work set.
      #
      # CGO_ENABLED=0 mirrors the production main-API image. The media-encoder
      # packages (cmd/media-encoder + internal/media/encoder) wrap discord/lilliput,
      # a CGO library needing system image headers (libpng etc.) — they are built &
      # tested in their OWN image (infra/Dockerfile.media-encoder), never here, so
      # we exclude them from the package list to keep main CI pure-Go and fast.
      - name: Build
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        # apps/api/tests is excluded from BUILD specifically: every file in it is
        # a _test.go file, so it has no buildable non-test files and `go build`
        # errors on it when named explicitly. Vet (below) keeps it: vet compiles
        # the _test.go files, so the integration tests still cannot silently rot.
        #
        # The pattern is anchored with $ so it excludes ONLY that package and not
        # its subpackages. apps/api/tests/contract must keep building here.
        run: go build $(go list ./... | grep -v -e /cmd/media-encoder -e /internal/media/encoder -e '/apps/api/tests$')

      - name: Vet
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: go vet $(go list ./... | grep -v -e /cmd/media-encoder -e /internal/media/encoder)

      - name: Test
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        # Also exclude apps/api/tests here: those are container-based integration
        # tests (testcontainers — postgres/redis/minio/clickhouse) that belong in a
        # separate lane, not the fast unit CI. 262 of them stand up their own
        # ephemeral Postgres, so the cost, not any missing Docker daemon, is why
        # they sit out this lane. They are still COMPILE-checked above by
        # Build + Vet, so they can't silently rot.
        #
        # The pattern is anchored with $ so it excludes ONLY that package.
        # apps/api/tests/contract holds the containerless spec-versus-code gates
        # (TestOpenAPIRouteCoverage and TestOpenAPIRequestBodyFieldCoverage);
        # they run against an empty *db.Pool in about a second and MUST run on
        # every PR, because they are what stops an undocumented route or a
        # handler json tag that no longer matches its schema from merging.
        run: go test $(go list ./... | grep -v -e /cmd/media-encoder -e /internal/media/encoder -e '/apps/api/tests$')

  # ---- JS / web ----
  js:
    name: JS (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -w run lint

      - name: Typecheck
        run: pnpm --filter @wpmgr/web typecheck

      - name: Build
        run: pnpm --filter @wpmgr/web build

      - name: Test
        run: pnpm --filter @wpmgr/web test

  # ---- Dependency vulnerability scanning ----
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # House rule: competitor products are never named in docs or root markdown.
      # Functional source references (conflict-detection slugs, plugin-signature
      # seeds, compat handling) are out of scope, and ADR-055 is excluded because
      # it documents plugin interop behavior that mirrors shipped code.
      - name: Docs vocabulary check (no competitor names)
        run: |
          banned='flyingpress|flying-press|wpvivid|wp-rocket|wp rocket|wpremote|updraft|nitropack|perfmatters|managewp|mainwp|malcare'
          hits=$(grep -rniE "$banned" --include='*.md' docs/ ./*.md 2>/dev/null | grep -v 'docs/adr/ADR-055' || true)
          if [ -n "$hits" ]; then
            echo "Competitor names found in markdown (house rule: describe techniques neutrally):"
            echo "$hits"
            exit 1
          fi

      # Shipped-copy gate: no em dashes, no en dashes, no competitor names in
      # the marketing site, in apps/agent/readme.txt (which IS the public
      # wordpress.org listing page), in the plugin header, or in the agent's
      # user-facing PHP strings. The script previously ran only inside
      # `pnpm -C apps/marketing build`, which ci.yml never invokes, so the most
      # public copy the project ships had no gate on it at all. Plain node, no
      # install required.
      - name: Shipped copy check (no em/en dashes, no competitor names)
        run: node apps/marketing/scripts/check-copy.mjs

      # Docs-version drift guard. Two checks against the top CHANGELOG.md entry:
      #  1. packages/openapi/openapi.yaml info.version must equal it exactly
      #     (the marketing build self-heals the rendered doc, but the source of
      #     truth should never drift).
      #  2. The newest RELEASES entry in the marketing changelog page must be
      #     within 5 RELEASES of it (catches the changelog page silently falling
      #     behind, without demanding an entry for every single tag).
      #
      # DISTANCE IS COUNTED IN RELEASES, BY POSITION IN CHANGELOG.md's OWN LIST,
      # never by subtracting patch numbers. Subtracting patch numbers is only
      # meaningful while major.minor match, so the previous version of this check
      # skipped the compare whenever they did not. That was described as "the
      # first release after a minor bump warns and skips", which was false:
      # nothing ever brings a stale surface back into the current minor, so ONE
      # minor bump disabled the compare permanently and silently. With CHANGELOG
      # top at 0.66.4 and a surface left on 0.61.131 it would have warned and
      # skipped forever. Counting positions has no such hole: 0.61.131 sits
      # exactly one release behind 0.62.0, and six releases later it sits six
      # behind and fails.
      #
      # Forgiveness rule, unchanged: anything that fails to PARSE warns and skips
      # rather than blocking a PR on a false positive. Two situations are errors
      # rather than tolerances, because neither can be a parse accident: a
      # surface naming a version NEWER than the top CHANGELOG entry (a reader
      # cannot look it up), and a surface further behind than its tolerance.
      # A version that parses but that CHANGELOG.md has no entry for cannot be
      # placed in the ordering at all, so that one warns and skips.
      - name: Docs version drift guard (openapi + marketing changelog)
        run: |
          # Every released version, newest first. Position in this list is the
          # unit that "N behind" is measured in, everywhere in this workflow.
          releases=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md 2>/dev/null | tr -d '#[] ' || true)
          top=$(printf '%s\n' "$releases" | sed -n 1p)
          if [ -z "$top" ]; then
            echo "WARN: could not parse any released version from CHANGELOG.md; skipping the drift guard."
            exit 0
          fi

          # How many releases $1 sits behind the top entry. Prints nothing when
          # CHANGELOG.md has no entry for that version.
          releases_behind() {
            printf '%s\n' "$releases" | grep -n -x -F -m1 -e "$1" | cut -d: -f1 | awk '{print $1 - 1}' || true
          }

          # 1 when $1 is a strictly newer version than $2, else 0. Compares every
          # component numerically, so it is correct across a minor or major bump.
          is_newer() {
            awk -v a="$1" -v b="$2" 'BEGIN{
              na=split(a,x,"."); nb=split(b,y,".");
              n=(na>nb)?na:nb;
              for(i=1;i<=n;i++){
                xi=(i<=na)?x[i]+0:0; yi=(i<=nb)?y[i]+0:0;
                if(xi>yi){print 1; exit}
                if(xi<yi){print 0; exit}
              }
              print 0}'
          }

          # compare_surface <label> <version> <tolerance-in-releases> <remedy>
          # Returns 1 on a real drift, 0 when in tolerance or unmeasurable.
          compare_surface() {
            _label="$1"; _v="$2"; _tol="$3"; _fix="$4"
            if [ "$(is_newer "$_v" "$top")" = "1" ]; then
              echo "ERROR: $_label names $_v, which is newer than the top CHANGELOG.md entry ($top)."
              echo "Nothing may name a release the CHANGELOG has no entry for. $_fix"
              return 1
            fi
            _behind=$(releases_behind "$_v")
            if [ -z "$_behind" ]; then
              echo "WARN: CHANGELOG.md has no entry for $_v ($_label), so the distance cannot be measured; skipping that compare."
              return 0
            fi
            if [ "$_behind" -gt "$_tol" ]; then
              echo "ERROR: $_label names $_v, which is $_behind releases behind the top CHANGELOG.md entry ($top). Tolerance is $_tol."
              echo "$_fix"
              return 1
            fi
            echo "OK: $_label ($_v) is $_behind releases behind $top, tolerance $_tol."
            return 0
          }

          fail=0

          # Shape-checked, not just non-empty: a value that is not MAJOR.MINOR.PATCH
          # did not parse, and the rule everywhere in this guard is that a parse
          # failure warns and skips. Only two real versions that differ is an error.
          spec=$(grep -m1 -E '^[[:space:]]+version:' packages/openapi/openapi.yaml 2>/dev/null | awk '{print $2}' | tr -d '"' | grep -xE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$spec" ]; then
            echo "WARN: could not parse packages/openapi/openapi.yaml info.version as MAJOR.MINOR.PATCH; skipping that check."
          elif [ "$spec" != "$top" ]; then
            echo "ERROR: packages/openapi/openapi.yaml info.version is $spec but the top CHANGELOG.md entry is $top."
            echo "Bump openapi.yaml info.version alongside the CHANGELOG."
            fail=1
          else
            echo "OK: openapi.yaml info.version matches the top CHANGELOG.md entry ($top)."
          fi

          page='apps/marketing/app/(marketing)/changelog/page.tsx'
          # The newest RELEASES entry may group several releases into a range,
          # written oldest first: version: "0.61.49 - 0.61.53". Take the NEWEST
          # version in that entry, not the first one on the line. Reading the
          # first number measures the distance from the oldest end of the group,
          # so a page that truthfully covers up to the top release still reads as
          # stale once a group is wider than the tolerance. Groups of five have
          # shipped already; seven would have failed an honest page.
          mk=$(grep -m1 -oE 'version: "[^"]+"' "$page" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
          if [ -z "$mk" ]; then
            echo "WARN: could not parse the newest marketing changelog version from $page; skipping that check."
          else
            compare_surface "the marketing changelog's newest entry" "$mk" 5 \
              "Backfill $page (grouped entries are fine)." || fail=1
          fi

          exit "$fail"

      # Docs-version drift guard, part two: the surfaces that name a version to a
      # reader and drifted anyway because nothing compared them to anything. This
      # is a separate step on purpose. The step above exits early when CHANGELOG
      # itself cannot be parsed, so anything appended to it would be skipped along
      # with it, silently, which is exactly the failure mode being fixed here.
      # It re-derives the release ordering for the same reason: one unparseable
      # surface must never take the others down with it.
      #
      # Two surfaces, and they are compared to DIFFERENT references on purpose:
      #
      #  * apps/marketing/lib/content/home.ts AGENT_VERSION drives the hero badge
      #    and the provenance fact row, both of which name the AGENT plugin
      #    version that wordpress.org serves. Its reference is therefore
      #    apps/agent/wpmgr-agent.php, NOT the CHANGELOG.
      #
      #    Comparing it to the CHANGELOG was wrong, and expensively so. The agent
      #    version deliberately does not track the repo release version: it moves
      #    only when the agent itself changes, which release.yml states outright
      #    where it refuses to re-publish a moved artifact under a frozen agent
      #    version. Control-plane-only bursts are this project's normal cadence,
      #    0.61.128 through 0.61.131 shipped in four days with the agent frozen at
      #    0.61.127, and through all of it a badge reading 0.61.127 was telling
      #    visitors the exact truth. Measured against the CHANGELOG it looked four
      #    releases stale and would have reddened main on an honest tree. A guard
      #    that cries wolf gets switched off, and then it guards nothing.
      #
      #    Against the agent version the rule is exact equality, with no
      #    tolerance, because there is nothing legitimate for a tolerance to
      #    forgive. Checked against the live directory on 2026-08-10: the repo's
      #    agent was 0.61.131 and wordpress.org served 0.61.131. The publish is
      #    manually gated (wporg-deploy.yml) but it follows the agent bump within
      #    days, and the agent bump lands in the release commit, so the badge
      #    belongs in that same commit. Equality also catches the drift this whole
      #    guard exists for: at the 0.61.131 release commit the agent moved and
      #    the badge did not.
      #
      #    NOT DERIVED FROM apps/agent/wpmgr-agent.php AT BUILD TIME, deliberately,
      #    even though sync-openapi.mjs shows the shape of how that would work.
      #    infra/Dockerfile.marketing copies only the workspace manifests,
      #    packages/ and apps/marketing/ into the build context, so a read outside
      #    those paths does not resolve in the image that actually ships. That is
      #    not hypothetical: sync-openapi.mjs's own CHANGELOG.md read already
      #    falls into its catch on every production build for exactly this reason,
      #    silently. Deriving would mean widening a live image's build context and
      #    depending on it staying wide, where the failure mode is a silently
      #    stale badge and no guard left to catch it. Fifteen lines of comparison
      #    here cost less and fail loudly.
      #
      #  * The install pins a self-hoster copies verbatim: the GHCR pull tags and
      #    the status line in README.md, and the WPMGR_VERSION export in BOTH
      #    README.md and docs/install.md. They are checked as ONE set, because
      #    README.md links docs/install.md as the full install guide directly
      #    under its own pull block, so a reader crosses between them mid-install.
      #    Guarding only README.md is why docs/install.md was still handing people
      #    v0.19.0, 42 releases behind, one link away from the block this guard
      #    was written to protect. They must agree with each other exactly, and
      #    sit within 1 release of the top CHANGELOG entry: enough to forgive the
      #    window inside a release PR where the entry exists but the tag has not
      #    been pushed, and nothing more.
      #
      #    infra/docker-compose.prod.yml is deliberately NOT in this set. Its
      #    functional default, image: ...:${WPMGR_VERSION:-latest}, names no
      #    version and needs no guard. Its header comment did name one, and had
      #    rotted to the same v0.19.0, but it is a comment about the mechanism
      #    rather than an install step anyone follows, and the step it duplicated
      #    is the guarded one in docs/install.md. So the concrete version was
      #    removed from that comment instead of adding a fourth surface to bump
      #    every release. Guard the copy people follow; delete the copy that only
      #    exists to be duplicated.
      #
      # Same forgiveness rule throughout: anything that fails to parse warns and
      # skips instead of blocking a PR on a false positive. Both sub-checks always
      # run and the step exits once at the end, so a tree with two stale surfaces
      # reports both in one CI cycle rather than one per push.
      - name: Docs version drift guard (marketing badge + install pins)
        run: |
          releases=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md 2>/dev/null | tr -d '#[] ' || true)
          top=$(printf '%s\n' "$releases" | sed -n 1p)
          if [ -z "$top" ]; then
            echo "WARN: could not parse any released version from CHANGELOG.md; skipping the drift guard."
            exit 0
          fi

          releases_behind() {
            printf '%s\n' "$releases" | grep -n -x -F -m1 -e "$1" | cut -d: -f1 | awk '{print $1 - 1}' || true
          }

          is_newer() {
            awk -v a="$1" -v b="$2" 'BEGIN{
              na=split(a,x,"."); nb=split(b,y,".");
              n=(na>nb)?na:nb;
              for(i=1;i<=n;i++){
                xi=(i<=na)?x[i]+0:0; yi=(i<=nb)?y[i]+0:0;
                if(xi>yi){print 1; exit}
                if(xi<yi){print 0; exit}
              }
              print 0}'
          }

          fail=0

          # --- the marketing hero badge, against the agent it names ---
          # Anchored at the start of the line so a differently named constant
          # sitting above the real one cannot be matched instead, but matching
          # only the NAME rather than the whole assignment: pinning the exact
          # spelling of the line means an `export` keyword, a quote-style change
          # or a reformat turns this check off and prints a WARN nobody reads.
          # A guard that a formatter can silently disable is the same defect as
          # a guard that skips forever after a minor bump.
          home='apps/marketing/lib/content/home.ts'
          agent_main='apps/agent/wpmgr-agent.php'
          badge=$(grep -m1 -E '^(export )?const AGENT_VERSION[[:space:]]*=' "$home" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          agent=$(grep -m1 -E "^define\('WPMGR_AGENT_VERSION'" "$agent_main" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -z "$badge" ] || [ -z "$agent" ]; then
            echo "WARN: could not parse both the badge and the agent version (badge='$badge' agent='$agent'); skipping that check."
          elif [ "$badge" != "$agent" ]; then
            echo "ERROR: the marketing hero badge names agent $badge but $agent_main is on $agent."
            echo "The badge and the provenance fact row tell visitors which agent version wordpress.org serves,"
            echo "so they must name the agent release this repo carries. Bump AGENT_VERSION in $home."
            fail=1
          else
            echo "OK: the marketing hero badge names agent $badge, matching $agent_main."
          fi

          # --- the install pins a self-hoster copies, README.md + docs/install.md ---
          pin_files='README.md docs/install.md'
          pins=$( { grep -Hn -oE 'ghcr\.io/mosamlife/wpmgr-[a-z-]+:v[0-9]+\.[0-9]+\.[0-9]+' $pin_files;
                    grep -Hn -oE 'WPMGR_VERSION=v[0-9]+\.[0-9]+\.[0-9]+' $pin_files;
                    grep -Hn -oE '^\*\*v[0-9]+\.[0-9]+\.[0-9]+\*\*:' $pin_files; } 2>/dev/null || true )
          seen=$( { grep -h -oE 'ghcr\.io/mosamlife/wpmgr-[a-z-]+:v[0-9]+\.[0-9]+\.[0-9]+' $pin_files;
                    grep -h -oE 'WPMGR_VERSION=v[0-9]+\.[0-9]+\.[0-9]+' $pin_files;
                    grep -h -oE '^\*\*v[0-9]+\.[0-9]+\.[0-9]+\*\*:' $pin_files; } 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u || true )
          if [ -z "$seen" ]; then
            echo "WARN: could not parse any install pin from $pin_files (no ghcr.io pull tag, no WPMGR_VERSION export); skipping that check."
          elif [ "$(printf '%s\n' "$seen" | wc -l | tr -d ' ')" -gt 1 ]; then
            echo "ERROR: the install instructions name more than one version:"
            echo "$pins"
            echo "The GHCR pull tags, the WPMGR_VERSION exports and the README status line must all name the same release."
            fail=1
          else
            compare_fix="Update the ghcr.io pull tags, the WPMGR_VERSION exports and the README status line in $pin_files."
            if [ "$(is_newer "$seen" "$top")" = "1" ]; then
              echo "ERROR: the install instructions name v$seen, which is newer than the top CHANGELOG.md entry ($top)."
              echo "They must never hand a self-hoster a tag that was never released. $compare_fix"
              fail=1
            else
              behind=$(releases_behind "$seen")
              if [ -z "$behind" ]; then
                echo "WARN: CHANGELOG.md has no entry for $seen, so the distance cannot be measured; skipping that compare."
              elif [ "$behind" -gt 1 ]; then
                echo "ERROR: the install instructions still tell self-hosters to pull v$seen, $behind releases behind the top CHANGELOG.md entry ($top)."
                echo "$compare_fix"
                fail=1
              else
                echo "OK: install pin $seen is $behind releases behind $top, tolerance 1."
              fi
            fi
          fi

          exit "$fail"

      # Agent version triple. apps/agent/wpmgr-agent.php carries its version twice
      # (the plugin header WordPress reads, and the WPMGR_AGENT_VERSION constant
      # the agent code reads) and apps/agent/readme.txt carries it a third time as
      # the wordpress.org Stable tag. Nothing here compares them to the CHANGELOG,
      # deliberately: `make agent-zip VERSION=` stamps a staged copy and never the
      # source, so the checked-in values legitimately sit at the last released
      # version rather than the one being prepared. What is never legitimate is
      # the three disagreeing with each other. Self-update compares the constant
      # against the version the release manifest advertises while WordPress reads
      # the header, so a mismatch produces an update that either never offers
      # itself or offers itself forever, with no error message anywhere. No
      # tolerance applies to this one, only the usual parse forgiveness.
      - name: Agent version triple check (plugin header, constant, Stable tag)
        run: |
          main='apps/agent/wpmgr-agent.php'
          readme='apps/agent/readme.txt'
          header=$(grep -m1 -oE '^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' "$main" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          constant=$(grep -m1 -E "^define\('WPMGR_AGENT_VERSION'" "$main" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          stable=$(grep -m1 -oE '^Stable tag:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' "$readme" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$header" ] || [ -z "$constant" ] || [ -z "$stable" ]; then
            echo "WARN: could not parse the agent version from all three places (header='$header' constant='$constant' stable='$stable'); skipping the agent triple check."
            exit 0
          fi
          if [ "$header" != "$constant" ] || [ "$header" != "$stable" ]; then
            echo "ERROR: the agent version disagrees with itself."
            echo "  $main plugin header:      $header"
            echo "  $main WPMGR_AGENT_VERSION: $constant"
            echo "  $readme Stable tag:        $stable"
            echo "All three must name the same version, or self-update version comparison breaks silently."
            exit 1
          fi
          echo "Agent version triple agrees ($header)."

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/api/go.sum

      # govulncheck does call-graph reachability analysis, so it only fails on
      # vulnerabilities the binary actually reaches (few false positives). Rooting
      # it at ./cmd/wpmgr/... scans exactly the deployed main-API binary and stays
      # CGO-free (the media-encoder lives in a separate image), matching the
      # CGO_ENABLED=0 production build.
      - name: Go govulncheck
        working-directory: apps/api
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./cmd/wpmgr/...

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      # No `cache: pnpm` here: this job never runs `pnpm install`, so the pnpm
      # store is empty and setup-node's cache-save post-step fails on a missing
      # path. The audit only needs the checked-out lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Audit the dependency graph from the lockfile (no install needed). Scoped
      # to production dependencies at high+ severity: dev-only tooling advisories
      # do not reach shipped code, and low/moderate noise should not block PRs.
      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level high

  # ---- nginx routing (infra/nginx/nginx.conf) ----
  # `nginx -t` only checks syntax; it does not catch a public Go route with no
  # matching nginx location (GH #175 — self-hosted RUM ingest 405'd on every
  # beacon because /rum/ had no location and fell through to the SPA
  # try_files catch-all). This runs the real config against a stub upstream
  # and asserts proxy-vs-405 outcomes for every known public root-engine
  # route, plus a class invariant (unrouted public POST still 405, SPA
  # fallback still serves index.html) so a FUTURE missing route fails the
  # same way.
  nginx-routing:
    name: nginx routing smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: nginx -t (syntax)
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Routing smoke test (real infra/Dockerfile.web image vs stub upstream)
        run: infra/nginx/routing_smoke_test.sh

  # ---- PHP agent ----
  php:
    name: PHP (agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4

      # The agent plugin carries its own WPMGR_AGENT_VERSION, which changes only
      # when the agent changes. release.yml fires on EVERY tag, including the
      # many that touch only the control plane or the dashboard, so stamping the
      # release asset with the tag published identical agent code under a
      # different number each time. The object-storage channel reads the source
      # version instead, so the two channels drifted apart, and because the
      # agent's downgrade guard refuses anything not strictly newer, a site that
      # installed a tag-stamped asset would refuse every later real release.
      # Passing VERSION here is what caused that, so it must not come back.
      - name: Agent release asset must not be stamped from the git tag
        working-directory: .
        run: |
          if grep -nE 'make +agent-zip[^\n]*VERSION=' .github/workflows/release.yml; then
            echo "::error::release.yml passes VERSION to agent-zip. The published asset would carry the git tag instead of WPMGR_AGENT_VERSION, which desynchronises the GitHub and object-storage channels and can permanently strand sites behind the downgrade guard." >&2
            exit 1
          fi
          echo "ok: release.yml lets the agent zip carry its own source version"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sodium, openssl
          tools: composer:v2
          coverage: none

      - name: Get composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/agent/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Test
        run: composer test
