name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- Go API ----
  go:
    name: Go (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: apps/api/go.sum

      # Build the api module on its own (workspace disabled) so it does not
      # depend on sibling modules in the go.work set.
      #
      # CGO_ENABLED=0 mirrors the production main-API image. The media-encoder
      # packages (cmd/media-encoder + internal/media/encoder) wrap discord/lilliput,
      # a CGO library needing system image headers (libpng etc.) — they are built &
      # tested in their OWN image (infra/Dockerfile.media-encoder), never here, so
      # we exclude them from the package list to keep main CI pure-Go and fast.
      - name: Build
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        # A package with no buildable non-test file (every .go file in it is
        # _test.go) makes `go build` error with "no non-test Go files" the
        # moment it is named explicitly. apps/api/tests is one today; any test-
        # only subpackage added under it (or anywhere else in apps/api) is
        # another. Rather than excluding by path — which has to be re-anchored
        # by hand every time such a package is added, and silently stops
        # covering the NEXT one — filter by the actual property `go build`
        # cares about: `go list -f '{{if .GoFiles}}...{{end}}'` prints an
        # import path only for packages that have buildable files at all, so
        # a test-only package drops out of the build set on its own. This
        # also means apps/api/tests/contract, which carries doc.go for
        # exactly this reason, keeps building here with no special case.
        #
        # Vet (below) still covers the packages this drops: vet compiles the
        # _test.go files too, so a test-only package still cannot silently rot.
        run: go build $(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v -e /cmd/media-encoder -e /internal/media/encoder)

      - name: Vet
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: go vet $(go list ./... | grep -v -e /cmd/media-encoder -e /internal/media/encoder)

      - name: Test
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        # Also exclude apps/api/tests here: those are container-based integration
        # tests (testcontainers: postgres, redis, minio, clickhouse) that belong
        # in a separate lane, not the fast unit CI. Nearly all of that package's
        # test functions run under CGO_ENABLED=0 (one is excluded by a
        # //go:build cgo tag), and most stand up their own ephemeral Postgres,
        # so the cost, not any missing Docker daemon, is why they sit out this
        # lane.
        #
        # THE SEPARATE LANE IS .github/workflows/api-integration.yml, and it is
        # MANUAL ONLY. It runs the package for real, but only when somebody
        # dispatches it: about 18 minutes on a standard runner is too long to
        # wait on every PR until a faster one is available. Its "Count
        # integration test functions" step prints the live total on every run;
        # this file does not restate it. Its triggers are written and commented
        # out, ready to uncomment.
        #
        # SO NOTHING IN CI EXECUTES THESE TESTS TODAY. That includes the m112
        # site-scope RLS proofs, the ones that stop a collaborator invited to a
        # single site reaching the whole organisation's email credentials. They
        # are run locally, with `make test-integration`, and a regression in
        # them will merge green. Run it before merging anything that touches
        # RLS, the email domain or tenant scoping.
        #
        # Compile-checking here is still worth having: it stops the package
        # rotting between integration runs. Note that is VET doing it, not
        # Build, for the reason given on the Build step above.
        #
        # The pattern excludes apps/api/tests ITSELF AND EVERY SUBDIRECTORY
        # ( '/apps/api/tests($|/)' ), not just the exact path: a subpackage
        # added under it (e.g. apps/api/tests/gh458) is, by the convention
        # every existing one follows, container-backed like its siblings, so
        # it belongs in api-integration.yml's lane too and must not silently
        # start running here — an anchor of just `$` would miss it and this
        # fast lane would eat a testcontainers run with none of the Docker
        # prep api-integration.yml does for it. That is not hypothetical: it
        # is what apps/api/tests/gh458 does the moment the anchor is `$`-only.
        #
        # apps/api/tests/contract is the one deliberate exception, so it is
        # added back explicitly rather than by pattern. It holds the
        # containerless spec-versus-code gates (TestOpenAPIRouteCoverage and
        # TestOpenAPIRequestBodyFieldCoverage); they run against an empty
        # *db.Pool in about a second and MUST run on every PR, because they
        # are what stops an undocumented route or a handler json tag that no
        # longer matches its schema from merging. A future package that is
        # deliberately fast and containerless needs the same explicit
        # addition — that is a one-time choice made when such a package is
        # created, the same way contract's was, not something this pattern
        # can infer from a path.
        run: go test $(go list ./... | grep -Ev -e '/cmd/media-encoder' -e '/internal/media/encoder' -e '/apps/api/tests($|/)') ./tests/contract/...

      # ---- Load-balancer route coverage -------------------------------------
      # Twice in one day a route shipped, deployed, and was unreachable: the API
      # mounted it and the url-map did not route it, so it fell through to the
      # matcher default and the web SPA answered it. POST /mcp was the first;
      # the OAuth discovery documents from #589 were about to be the second.
      #
      # Both failures return 200 text/html, so no status-code check after the
      # deploy can see them — something answered, it was just the wrong
      # something. This guard reads the route list out of the REAL Gin engine
      # (apps/api/cmd/dump-routes, which mounts EVERY optional Deps handler) and
      # proves each path has a rule in infra/urlmap.yaml pointing at the API
      # backend. It needs no cloud credentials, which is the entire point of it
      # running here: on every PR, before the deploy, instead of being something
      # someone remembers to curl afterwards.
      #
      # It lives in this job rather than `security` because it needs the Go
      # toolchain to build the engine, and this is the job that already has it
      # set up and cached. The `security` job's setup-go comes after its guard
      # steps, so the same two steps there would run on whatever Go the runner
      # happened to ship.
      #
      # The live-versus-committed drift check is deliberately NOT in CI. It
      # needs gcloud credentials, so wiring it in would gate the half that
      # matters behind the half that cannot run on a fork PR. It is
      # `make check-urlmap-drift`, run before an apply.
      #
      # Self-test FIRST, so a guard broken into failing open cannot pass by
      # reporting success over its own errors.
      - name: URL-map route coverage guard self-test
        working-directory: ${{ github.workspace }}
        run: scripts/check-urlmap-routes_test.sh

      - name: URL-map route coverage guard (every mounted API route has a path rule)
        working-directory: ${{ github.workspace }}
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: scripts/check-urlmap-routes.sh

  # ---- JS / web ----
  js:
    name: JS (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        # Version comes from the root package.json packageManager field, so the
        # lockfile and CI cannot drift apart.
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -w run lint

      - name: Typecheck
        run: pnpm --filter @wpmgr/web typecheck

      - name: Build
        run: pnpm --filter @wpmgr/web build

      - name: Test
        run: pnpm --filter @wpmgr/web test

  # ---- Codegen drift ----
  # packages/openapi/openapi.yaml is the source of truth for two committed
  # generated trees: apps/api/internal/api/gen (ogen) and
  # packages/openapi-client/src/generated (@hey-api/openapi-ts). This job
  # regenerates both and fails if what is committed differs from what the spec
  # now produces.
  #
  # WHY IT EXISTS (GH #511). `make gen` used to run a script that echoed
  # "wired in Phase 4" and exited 0 while both generators had been wired and in
  # daily use for months. So the documented command reported success and
  # regenerated nothing, and a spec edit could be committed with a stale
  # generated tree that looked freshly generated. Fixing the script fixes the
  # command; this job is what stops the stale commit itself, rather than
  # trusting every contributor to have run the right thing.
  #
  # THE LOGIC LIVES IN A SCRIPT, NOT IN THIS FILE, and so does the drift
  # comparison: `scripts/gen-openapi.sh --check` is the same script `make gen`
  # runs, with the diff on the end, so the developer command and the CI command
  # cannot drift apart the way the thing they check drifts apart. The suite runs
  # FIRST, as it does for the version-surface guard: if the guard's own
  # behaviour has regressed, that is the more useful failure to read, and a
  # guard that has failed open cannot pass by finding nothing.
  codegen-drift:
    name: Codegen drift (OpenAPI -> Go + TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Shims only, no toolchain needed, so a broken guard is caught before the
      # expensive setup below rather than after it.
      - name: Codegen guard self-test
        run: scripts/gen-openapi_test.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Regenerates both trees and fails if either generator is absent, exits
      # non-zero, or exits 0 without writing; then fails if the committed trees
      # differ from the fresh generation.
      - name: Regenerate and compare against the committed trees
        run: scripts/gen-openapi.sh --check

  # ---- Commit message hygiene ----
  # Refuses a PR whose own commits carry an assistant trailer or a session URL.
  #
  # WHY. This repository is public, and a Claude Code session URL in a commit
  # message is published with it, permanently, to everyone. 149 commits already
  # in main's history carry one, from 2026-06-22 to 2026-07-28. Those are being
  # left alone deliberately: removing them means rewriting public history, which
  # changes every SHA since June, orphans the release tags that point at them,
  # and breaks every existing clone and fork. The cost of the rewrite is higher
  # than the cost of the leak. So the rule starts here instead, and this job is
  # what makes it hold.
  #
  # It reads ONLY the commits the PR itself adds, never the history behind them,
  # so the existing 149 cannot fail anybody's unrelated PR.
  commit-hygiene:
    name: Commit message hygiene
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The PR's own commits only. fetch-depth 0 because the range needs the
          # base commit present, and a shallow clone does not have it.
          fetch-depth: 0

      - name: No assistant trailers or session URLs in new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # A session URL is the one that actually matters: it is a live link
          # published to a public repository. The trailers are a house style
          # rule. Both are checked; the message says which is which.
          url_re='claude\.ai/code/session'
          trailer_re='^[[:space:]]*(Co-Authored-By:[[:space:]]*Claude|Claude-Session:)'

          bad=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            body="$(git log -1 --format='%B' "$sha")"
            if printf '%s' "$body" | grep -qiE "$url_re"; then
              echo "ERROR: $(git log -1 --format='%h %s' "$sha")"
              echo "       carries a Claude Code session URL. This repository is public, so that"
              echo "       link would be published with the commit and cannot be taken back."
              bad=1
            fi
            if printf '%s' "$body" | grep -qiE "$trailer_re"; then
              echo "ERROR: $(git log -1 --format='%h %s' "$sha")"
              echo "       carries an assistant attribution trailer, which this project does not use."
              bad=1
            fi
          done

          if [ "$bad" -ne 0 ]; then
            echo ""
            echo "Rewrite the offending messages and force-push the branch:"
            echo "  git rebase -i $BASE_SHA     # reword each one"
            echo "  git push --force-with-lease"
            echo ""
            echo "Only this PR's commits are read, so nothing already on main is involved."
            exit 1
          fi
          echo "OK: no assistant trailers or session URLs in this PR's commits."

  # ---- Marketing site (the public wpmgr.app) ----
  # Separate from the web job so a failure says which app broke, and because
  # these two deploy independently.
  #
  # WHY THIS EXISTS. apps/marketing was never typechecked or built by CI. Only
  # its lint ran, and only as a side effect of the workspace-wide `turbo run
  # lint` inside the web job, so a type error or a broken build in the most
  # public thing this project ships would first appear during `gcloud builds
  # submit`, at deploy time, by which point the release is already out
  # everywhere else. It shipped that way on 0.61.131: the hero badge was edited
  # in a .ts file that nothing verified until the deploy build ran.
  #
  # No test step: apps/marketing has no test script. Copy is gated separately in
  # the Security audit job, which runs check-copy.mjs on plain node so it needs
  # no install and also covers the agent readme.
  marketing:
    name: JS (marketing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        # Version comes from the root package.json packageManager field, so the
        # lockfile and CI cannot drift apart.
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @wpmgr/marketing typecheck

      # Runs scripts/sync-openapi.mjs then next build, which is exactly what the
      # deploy image does, so a build that only breaks in the real pipeline
      # cannot pass here.
      - name: Build
        run: pnpm --filter @wpmgr/marketing build

  # ---- Dependency vulnerability scanning ----
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # No fetch-depth here on purpose. The only step in this job that ever
          # needed real history was the agent route guard, which was removed
          # with the rest of scripts/claude/. What remains reads the index
          # (`git ls-files`) or no git at all, so the default shallow checkout
          # is correct and faster. Restore `fetch-depth: 0` if a step added
          # below reads commits.

      # ---- The one shipped guard --------------------------------------------
      # .githooks/pre-push is now the only executable guard in the repo, and the
      # state every clone starts in is UNPROTECTED: core.hooksPath is repo-local
      # config, config is never committed, so a fresh checkout carries the hook
      # in its tree and git ignores it. That is exactly the clone
      # actions/checkout produces, which makes this runner the honest place to
      # prove the INSTALLER still works on one.
      #
      # This is deliberately the cheap half. It is a copy, a chmod and a git
      # config, and it does not re-test the hook's push logic - that is proved
      # by execution against a throwaway bare remote, not on a runner. What it
      # catches is `make hooks` breaking, after which every developer's next
      # clone would silently have no hook at all.
      #
      # hooks-status runs SECOND and exits non-zero unless the installed copy is
      # byte-identical to the tracked one, so this step cannot pass by printing
      # a success message over an install that did not happen.
      - name: Install the committed git hooks, and prove they are live
        run: |
          make hooks
          make hooks-status

      # House rule: competitor products are never named in docs or root markdown.
      # Functional source references (conflict-detection slugs, plugin-signature
      # seeds, compat handling) are out of scope, and ADR-055 is excluded because
      # it documents plugin interop behavior that mirrors shipped code.
      - name: Docs vocabulary check (no competitor names)
        run: |
          banned='flyingpress|flying-press|wpvivid|wp-rocket|wp rocket|wpremote|updraft|nitropack|perfmatters|managewp|mainwp|malcare'
          hits=$(grep -rniE "$banned" --include='*.md' docs/ ./*.md 2>/dev/null | grep -v 'docs/adr/ADR-055' || true)
          if [ -n "$hits" ]; then
            echo "Competitor names found in markdown (house rule: describe techniques neutrally):"
            echo "$hits"
            exit 1
          fi

      # Shipped-copy gate: no em dashes, no en dashes, no competitor names in
      # the marketing site, in apps/agent/readme.txt (which IS the public
      # wordpress.org listing page), in the plugin header, or in the agent's
      # user-facing PHP strings. The script previously ran only inside
      # `pnpm -C apps/marketing build`, which ci.yml never invokes, so the most
      # public copy the project ships had no gate on it at all. Plain node, no
      # install required.
      - name: Shipped copy check (no em/en dashes, no competitor names)
        run: node apps/marketing/scripts/check-copy.mjs

      # ---- Version surfaces -------------------------------------------------
      # Every place that names a version to a reader, checked against the thing
      # it claims to describe: the openapi spec version, the published
      # changelog page, the marketing hero badge, the agent's three
      # self-declarations, the install pins a self-hoster copies verbatim, and
      # a repo-wide sweep for any other concrete image tag or WPMGR_VERSION
      # value that has gone stale.
      #
      # THE LOGIC LIVES IN A SCRIPT, NOT IN THIS FILE, and that is the point.
      # It grew across three review rounds from 112 to 168 to 245 lines of
      # shell inside YAML block scalars here, with no test, and each round
      # found a real hole
      # because nobody could run it and check their work. It is now
      # scripts/check-version-surfaces.sh, it runs on a developer machine with
      # no CI (`scripts/check-version-surfaces.sh`), and the suite below builds
      # trees and asserts exit codes against it, so reopening a hole turns a
      # test red here instead of shipping.
      #
      # The suite runs FIRST: if the guard's own behaviour has regressed, that
      # is the more useful failure to read.
      # GH #565: `make test-integration` is serialised machine-wide by
      # scripts/with-machine-lock.sh, because parallel worktrees on one
      # developer machine contend for testcontainer ports and a contention
      # failure is indistinguishable from a real regression.
      #
      # CI never takes that lock — it runs one job in a clean container with
      # nothing to contend with, and this workflow does not run the integration
      # package at all. What runs here is the lock's SELF-TEST, because the lock
      # guards the one package CI does not, so nothing else would ever notice it
      # rotting. The suite uses `echo`, `false` and `sleep 2` as its payload:
      # seconds, no Docker, no integration run. It is also why the lock is built
      # on mkdir rather than the flock or shlock a developer machine might
      # offer — mkdir is the only one of the three present on both darwin and
      # this runner.
      - name: Machine-wide lock self-test
        run: scripts/with-machine-lock_test.sh

      - name: Version surface guard self-test
        run: scripts/check-version-surfaces_test.sh

      - name: Version surface guard (openapi, changelog page, badge, agent, install pins)
        run: scripts/check-version-surfaces.sh


      # ---- License surfaces --------------------------------------------------
      # GH #547: the agent declared MIT in its plugin header and GPLv2 or later
      # in the wp.org readme.txt, live, at the same time. This reconciles every
      # place in apps/agent (plus the repo-root LICENSE-AGENT carve-out) that
      # names the agent's own license, by name: the plugin header, both
      # mu-plugin headers, readme.txt's structured header AND its Description
      # prose, composer.json, NOTICE.md, README.md and LICENSE-AGENT's own
      # title line.
      #
      # THE LOGIC LIVES IN scripts/check-license-surfaces.sh, same reasoning as
      # the version surface guard immediately above: it is a file you can run
      # and test, not shell text buried in this YAML.
      #
      # A surface a guard's own pattern fails to find is an ERROR here, not a
      # skip — a check that passes because it matched nothing is the same
      # defect the version surface guard's header comment already spent three
      # review rounds discovering, one level up.
      #
      # Self-test runs FIRST, same reasoning as the version surface guard:
      # a broken guard must fail here, not pass by failing open.
      - name: License surface guard self-test (GH #547)
        run: scripts/check-license-surfaces_test.sh

      - name: License surface guard (plugin header, mu-plugins, readme.txt, composer.json, NOTICE.md, README.md, LICENSE-AGENT)
        run: scripts/check-license-surfaces.sh

      # ---- Agent release manifest guard ------------------------------------
      # scripts/release-agent.sh is the trust boundary release.yml calls to
      # build the agent's self-update manifest (GH #515: it used to publish a
      # hard-coded "tested up to 6.8" regardless of what the plugin actually
      # declared). scripts/release-agent_test.sh is its regression suite —
      # `make agent-release-test` — and until now nothing ran it: release.yml
      # invokes release-agent.sh directly, so a regression in the
      # version/requires/requires_php/tested parsing merged green and reached
      # the release path with no guard between it and a live compatibility
      # floor. It needs only zip/unzip (both on this image already) — no PHP,
      # no Go — and builds its own throwaway fixture repos, so it runs here
      # rather than in the PHP (agent) job.
      #
      # Self-test first, same reasoning as the version surface guard above: a
      # broken guard must fail here, not pass by failing open.
      - name: Agent release manifest guard self-test (GH #515)
        run: scripts/release-agent_test.sh

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: apps/api/go.sum

      # govulncheck does call-graph reachability analysis, so it only fails on
      # vulnerabilities the binary actually reaches (few false positives). Rooting
      # it at ./cmd/wpmgr/... scans exactly the deployed main-API binary and stays
      # CGO-free (the media-encoder lives in a separate image), matching the
      # CGO_ENABLED=0 production build.
      - name: Go govulncheck
        working-directory: apps/api
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./cmd/wpmgr/...

      - name: Install pnpm
        # Version comes from the root package.json packageManager field, so the
        # lockfile and CI cannot drift apart.
        uses: pnpm/action-setup@v4

      # No `cache: pnpm` here: this job never runs `pnpm install`, so the pnpm
      # store is empty and setup-node's cache-save post-step fails on a missing
      # path. The audit only needs the checked-out lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Audit the dependency graph from the lockfile (no install needed). Scoped
      # to production dependencies at high+ severity: dev-only tooling advisories
      # do not reach shipped code, and low/moderate noise should not block PRs.
      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level high

  # ---- RLS cross-tenant guard, live (GH #470) -------------------------------
  # scripts/check-rls-cross-tenant.sh enumerates every PERMISSIVE RLS policy
  # that grants access across tenants (classified on the setting its
  # expression tests, never on the policy's name) and reconciles it against
  # apps/api/db/rls-cross-tenant-policies.txt, the ledger of what access mode
  # each one is MEANT to have. Full rationale, including the three production
  # incidents (m84/#96, m89/#131, GH #463 Phase 0) it is aimed at, is in the
  # script's own header.
  #
  # THIS USED TO BE SPLIT ACROSS TWO WORKFLOWS. Only the hermetic self-test
  # ran on every PR (as a step inside Security audit, above); the live half --
  # apply every migration to a throwaway Postgres and read real pg_policies --
  # ran only in .github/workflows/api-integration.yml, which is
  # workflow_dispatch only. That meant a PR adding an unrecorded cross-tenant
  # policy, or narrowing an existing one, could merge without the live
  # reconciliation ever running against it. This job closes that gap: both
  # halves now run here, together, on every PR and every push.
  #
  # NO PATH FILTER, DELIBERATELY. Measured locally
  # (`time scripts/check-rls-cross-tenant.sh`): about 23 seconds for the live
  # half, throwaway Postgres and all migrations included, plus about 5 seconds
  # for the self-test -- cheap enough next to the other jobs in this file that
  # a filter would save nothing worth having. It would also be the wrong kind
  # of cheap: this job is a CANDIDATE required status check (context string
  # is this job's `name:` above, "RLS cross-tenant guard (live)"; adding it to
  # main's required contexts is a repo-settings decision for the owner, not
  # this file), and a workflow skipped by a `paths:` filter never posts a
  # check at all, so a required check gated on a path filter can leave a PR
  # pending forever. api-integration.yml's own `changes` job exists only to
  # avoid exactly that trap for ITS lane; the cheaper fix here is to run
  # unconditionally and not need one. Until the owner adds the context to
  # main's required checks, this job runs and can go red, but a red run does
  # not block a merge.
  #
  # api-integration.yml's copy of this job (the one named identically,
  # "RLS cross-tenant guard (live pg_policies vs the ledger)") has been
  # removed as redundant: ci.yml now runs the live check, unconditionally, on
  # every push and PR, which is a strict superset of what dispatching that
  # manual-only workflow bought. Keeping both would leave two copies of the
  # same job with no reason for the second one to exist, and no comment ever
  # stated one.
  #
  # Self-test first, as its own step, same reasoning as the version surface
  # guard and codegen-drift above: a broken guard must fail before it ever
  # touches a database, not pass by failing open.
  rls-cross-tenant:
    name: RLS cross-tenant guard (live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "RLS cross-tenant guard self-test (GH #470)"
        run: scripts/check-rls-cross-tenant_test.sh

      # No --from-extract: this manages its own throwaway Postgres (docker
      # run, apply every apps/api/migrations/*.sql file in lexical order,
      # extract, analyse) and reads real pg_policies. ubuntu-latest ships a
      # running Docker daemon; if that is ever not true, or psql is missing,
      # the script's own broken() path exits 2 with a named reason -- it does
      # not skip and does not pass.
      - name: "RLS cross-tenant guard (live, GH #470)"
        run: scripts/check-rls-cross-tenant.sh

  # ---- nginx routing (infra/nginx/nginx.conf) ----
  # `nginx -t` only checks syntax; it does not catch a public Go route with no
  # matching nginx location (GH #175 — self-hosted RUM ingest 405'd on every
  # beacon because /rum/ had no location and fell through to the SPA
  # try_files catch-all). This runs the real config against a stub upstream
  # and asserts proxy-vs-405 outcomes for every known public root-engine
  # route, plus a class invariant (unrouted public POST still 405, SPA
  # fallback still serves index.html) so a FUTURE missing route fails the
  # same way.
  nginx-routing:
    name: nginx routing smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: nginx -t (syntax)
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Routing smoke test (real infra/Dockerfile.web image vs stub upstream)
        run: infra/nginx/routing_smoke_test.sh

  # ---- PHP agent ----
  php:
    name: PHP (agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The check that release.yml must not stamp the agent zip from the git tag
      # used to live here, on its own, which is why the process doc describing
      # the version guards as one set was wrong about where they run. It is now
      # one of the checks in scripts/check-version-surfaces.sh, with the other
      # four, in the Security audit job, and it has a regression test.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sodium, openssl
          tools: composer:v2
          coverage: none

      # The guard's own regression suite. It needs php and nothing else, so a
      # guard whose behaviour has regressed is caught here, before the composer
      # install below, rather than after it. The suite runs FIRST for the same
      # reason the version surface suite does: a broken guard must not be able
      # to pass by failing open.
      #
      # working-directory is overridden because this job otherwise runs from
      # apps/agent, and these two paths are repo relative.
      - name: Agent PHPStan guard self-test
        working-directory: ${{ github.workspace }}
        run: scripts/check-agent-phpstan_test.sh

      - name: Get composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/agent/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Test
        run: composer test

      # PHPStan over the plugin. The plugin has owned a level 8 PHPStan config
      # with the WordPress extension, the stubs and a baseline for a long time,
      # and until this step existed nothing in CI ever invoked it, so it had
      # never produced a result at all.
      #
      # Why a script and not `composer analyse`: the exit code is not the
      # verdict. PHPStan exits 1 both when it analysed the whole plugin and
      # found things and when it aborted in the parser having analysed almost
      # nothing, and with --error-format=json the only thing distinguishing
      # them is a line on stderr that the JSON report itself does not carry.
      # Read carelessly, an aborted run looks like a short list of findings,
      # and the obvious way to clear a short list of findings is to widen
      # phpstan-baseline.neon, which turns this step green and leaves the
      # analyser blind over the entire plugin. The guard reports an incomplete
      # analysis as its own outcome, with its own exit code and a message that
      # says not to baseline it, and scripts/check-agent-phpstan_test.sh holds
      # that behaviour in place.
      #
      # WHY --allow-findings IS HERE, AND WHEN TO REMOVE IT. Repairing the
      # parse abort does not reveal a clean plugin, it reveals a large backlog
      # that was never visible because the analyser never ran. Making that
      # backlog blocking on day one has one predictable outcome: the first red
      # PR is cleared by regenerating the baseline, which swallows the genuine
      # findings along with the known noise and leaves this step green forever.
      # So findings are reported loudly and do not fail the build yet.
      #
      # This is NOT a soft gate. --allow-findings relaxes the findings outcome
      # and nothing else. A parse abort, a top-level analysis error (an entry
      # in PHPStan's own "errors" array, not attached to any file — the
      # analyser saying part of the run itself failed), an unparseable report,
      # a run that reports nothing while exiting non-zero, a missing binary, a
      # missing vendor tree and a missing config all still fail this step with
      # it set, and the guard's suite has a case pinning each of those. The
      # parse abort and the top-level analysis error are both enforced from day
      # one because neither can be cleared by widening the baseline: PHPStan
      # will not generate a baseline entry from a run that aborted or a
      # top-level error.
      #
      # TO MAKE IT FULLY BLOCKING: delete --allow-findings from the line below.
      # That is the whole change. Do it once the backlog has been triaged.
      - name: Agent PHPStan static analysis
        working-directory: ${{ github.workspace }}
        run: scripts/check-agent-phpstan.sh --allow-findings
