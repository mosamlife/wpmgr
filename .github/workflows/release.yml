name: release

# Publishes the self-host artifacts on a version tag (vX.Y.Z):
#   - Docker images -> GitHub Container Registry (ghcr.io):
#       ghcr.io/<owner>/wpmgr-api
#       ghcr.io/<owner>/wpmgr-web
#       ghcr.io/<owner>/wpmgr-media-encoder
#     each tagged :vX.Y.Z and :latest.
#   - WordPress agent plugin -> a GitHub Release asset (wpmgr-agent.zip).
#
# Auth uses the built-in GITHUB_TOKEN (no PAT needed) via `packages: write`.
# Trigger by pushing a tag:  git tag v0.12.0 && git push origin v0.12.0
# or run manually (Actions -> release -> Run workflow) with a version input.
#
# NOTE: GHCR packages are PRIVATE on first publish. To let anyone `docker pull`,
# set each package Public once: GitHub -> your profile -> Packages -> wpmgr-* ->
# Package settings -> Change visibility -> Public.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.12.0"
        required: true

permissions:
  contents: write # create the GitHub Release + upload the agent zip
  packages: write # push images to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.name }} → ghcr
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: infra/Dockerfile.api
            build_arg: VERSION
            platforms: linux/amd64,linux/arm64
          - name: web
            file: infra/Dockerfile.web
            build_arg: BUILD_VERSION
            platforms: linux/amd64,linux/arm64
          - name: media-encoder
            file: infra/Dockerfile.media-encoder
            build_arg: VERSION
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + lowercase owner
        id: vars
        run: |
          echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # QEMU lets buildx assemble arm64 layers on the amd64 runner.
      # For api/web the Go compile and Node/Vite build both run natively on the
      # build platform (--platform=$BUILDPLATFORM in the build stage), so QEMU
      # overhead is limited to resolving the multi-arch final-stage base images.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/wpmgr-${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=latest

      - name: Build + push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_arg }}=${{ steps.vars.outputs.version }}
          provenance: false

  agent:
    name: agent plugin → release asset
    needs: images # don't publish the release asset if any image build failed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: vars
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # make agent-zip builds vendor/ via a composer:2 container, then stages the
      # plugin under a stable wpmgr-agent/ folder (the WP slug) and zips it.
      #
      # VERSION is deliberately NOT passed. The agent plugin carries its own
      # WPMGR_AGENT_VERSION, which only changes when the agent itself changes,
      # while this workflow fires on EVERY release tag including the many that
      # touch only the control plane or the dashboard. Stamping the staged copy
      # with the tag therefore published the same agent code under a different
      # number on every release, so this asset and the object-storage channel
      # (scripts/release-agent.sh, which reads the source version) disagreed.
      # That is not cosmetic: the agent's own downgrade guard refuses anything
      # not strictly newer, so a site that installed a tag-stamped asset would
      # refuse every later offer carrying the real, lower agent version.
      # With VERSION unset, agent-zip leaves the staged copy at the source
      # version and both channels publish the same number for the same code.
      - name: Build agent plugin zip
        run: make agent-zip

      # The GitHub Releases API describes an asset with a name, a size and a
      # sha256 digest, and nothing else. A self-hosted control plane mirroring
      # this release into its own bucket also needs min_version, requires,
      # requires_php, tested and sections. min_version in particular is a real
      # control (the "you must already be at least X to take this" guard), and a
      # consumer that has to synthesise 0.0.0 for it silently permits a jump the
      # release meant to forbid. So publish the manifest itself as a second
      # asset, generated by scripts/release-agent.sh, which is the same code that
      # writes latest.json for the object-storage channel: same zip, same sha256,
      # same fields, so both channels describe this build identically.
      #
      # --dry-run keeps this step free of any storage credentials; --out only
      # changes where the manifest lands on disk. Set the repository variables
      # WPMGR_AGENT_MIN_VERSION / WPMGR_AGENT_TESTED to override the defaults
      # without editing this workflow; unset expands to empty and the script
      # falls back to its own defaults.
      - name: Build agent release manifest
        env:
          WPMGR_AGENT_MIN_VERSION: ${{ vars.WPMGR_AGENT_MIN_VERSION }}
          WPMGR_AGENT_TESTED: ${{ vars.WPMGR_AGENT_TESTED }}
        run: scripts/release-agent.sh --dry-run --out release/agent-release.json

      # ONE AGENT VERSION MEANS ONE SET OF BYTES, FOREVER (GitHub issue #322).
      #
      # The agent version deliberately does not track the repo version: it only
      # moves when the agent itself changes, so a web-only release must not push
      # a new agent to every site in a fleet. The consequence is that a web-only
      # release RE-PUBLISHES an agent version that already exists upstream, and
      # that is only safe if the archive is byte-identical. `make agent-zip` is
      # now deterministic so it is, but nothing enforced it, and four releases
      # shipped four different artifacts all claiming 0.61.114. Every mirroring
      # self-hoster correctly refused them.
      #
      # This turns a regression in that determinism into a failed build for us
      # rather than a refused mirror for them. It compares against the newest
      # PUBLISHED release carrying the same agent version, and stays silent when
      # the version has moved (a genuinely new build) or when there is nothing
      # to compare against.
      - name: Assert the agent archive is unchanged for an unchanged version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(sed -n "s/^define('WPMGR_AGENT_VERSION', *'\([^']*\)').*/\1/p" apps/agent/wpmgr-agent.php)
          [ -n "$v" ] || { echo "could not read WPMGR_AGENT_VERSION"; exit 1; }
          ours=$(sha256sum release/wpmgr-agent.zip | cut -d' ' -f1)
          echo "agent version $v, sha256 $ours"

          prev=""
          for tag in $(gh release list --limit 40 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "${{ steps.vars.outputs.version }}" ] && continue
            if gh release download "$tag" -p agent-release.json -D /tmp/prev --clobber >/dev/null 2>&1; then
              pv=$(python3 -c "import json;print(json.load(open('/tmp/prev/agent-release.json')).get('version',''))" 2>/dev/null || echo "")
              if [ "$pv" = "$v" ]; then prev="$tag"; break; fi
            fi
          done

          if [ -z "$prev" ]; then
            echo "no published release carries agent $v yet, nothing to compare"
            exit 0
          fi

          gh release download "$prev" -p wpmgr-agent.zip -D /tmp/prevzip --clobber
          theirs=$(sha256sum /tmp/prevzip/wpmgr-agent.zip | cut -d' ' -f1)
          if [ "$ours" != "$theirs" ]; then
            echo "::error::agent $v was already published in $prev with sha256 $theirs, but this build produced $ours."
            echo "::error::Same version string, different bytes. Every mirroring self-hoster will refuse this."
            echo "::error::Either the packaging stopped being deterministic, or the agent changed without its version being bumped."
            exit 1
          fi
          echo "matches $prev byte for byte"

      - name: Publish GitHub Release with the agent zip + manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: ${{ steps.vars.outputs.version }}
          generate_release_notes: true
          files: |
            release/wpmgr-agent.zip
            release/agent-release.json
